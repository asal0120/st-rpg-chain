<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接龙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0a08; /* 預設深褐色背景 */
            --panel-bg: rgba(20, 15, 12, 0.9); /* 介面底色 */
            
            --c-gold: #c5a059;   /* 古銅金 */
            --c-gold-dim: #8a6d3b;
            --c-text: #e0d6c8;   /* 羊皮紙白 */
            
            --c-red: #8a1c1c;    
            --c-red-bright: #ff4d4d;
            --c-blue: #1c4e8a;   
            --c-blue-bright: #4dabf7;
            --c-green: #2b5933;  
            --c-green-bright: #51cf66;
            --c-yellow: #b08d00; 
            --c-orange: #d97706; 
            
            --border-style: 2px solid var(--c-gold);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            font-family: "Noto Serif SC", serif;
            background-color: var(--bg-color);
            /* 預設背景，會被 JS 覆蓋 */
            background-image: radial-gradient(circle at center, #1a1512, #050403);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--c-text); 
            margin: 0; overflow: hidden; position: relative;
            width: 1080px; height: 720px;
            transition: background-image 0.5s ease-in-out; /* 背景切換動畫 */
        }

        h1, h2, .defeat-title, .sel-title, .boss-title-row, .cell-big-text, .php-val {
            font-family: "Cinzel", "Noto Serif SC", serif; 
            text-transform: uppercase;
        }

        /* === 載入與結束畫面 === */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: var(--c-gold);
            font-family: "Cinzel", serif;
            border: 4px double var(--c-gold);
        }

        #defeat-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000;
            display: none; flex-direction: column; justify-content: center; align-items: center; gap: 30px;
            animation: fadeIn 0.5s;
            backdrop-filter: blur(5px);
        }
        .defeat-title { 
            font-size: 4rem; color: var(--c-red-bright); 
            text-shadow: 0 0 20px #500; margin-bottom: 20px; 
            letter-spacing: 5px; border-bottom: 2px solid var(--c-red);
        }
        .defeat-btn-group { display: flex; gap: 40px; }
        .d-btn {
            padding: 15px 40px; font-size: 1.5rem; 
            border: 2px solid var(--c-text); 
            background: rgba(0,0,0,0.5); color: var(--c-text);
            cursor: pointer; transition: 0.2s; border-radius: 4px; 
            font-family: "Cinzel", serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .d-btn:hover { transform: scale(1.05); background: var(--c-text); color: #000; }
        .d-btn.skip { border-color: var(--c-gold); color: var(--c-gold); }
        .d-btn.skip:hover { background: var(--c-gold); color: #000; box-shadow: 0 0 20px var(--c-gold); }

        /* === 遊戲主場景 === */
        #game-stage {
            width: 100%; height: 100%; position: relative; display: none;
            /* 微微的暗角效果 */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* === 選擇介面 === */
        #selection-screen {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 999;
            background: rgba(10, 8, 6, 0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .sel-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .sel-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            max-width: 900px; margin: 20px;
        }
        .sel-card {
            background: linear-gradient(to bottom, #2a2522, #1a1512); 
            border: 1px solid #554433; 
            padding: 15px; border-radius: 4px; 
            cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; gap: 5px;
            width: 200px; height: 140px; position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .sel-card.selected { 
            border-color: var(--c-gold); 
            background: #2b2210; 
            box-shadow: 0 0 15px var(--c-gold), inset 0 0 10px var(--c-gold-dim); 
        }
        .sel-card:hover { transform: translateY(-5px); border-color: #888; }
        .sel-title { font-weight: bold; color: var(--c-gold); font-size: 1.1rem; border-bottom: 1px solid #443322; padding-bottom: 2px;}
        .sel-owner { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; font-style: italic; }
        .sel-desc { font-size: 0.8rem; color: #ccc; line-height: 1.4; font-family: "Noto Serif SC", serif; }
        
        .enemy-selector {
            padding: 10px; font-size: 1.2rem; background: #000; color: var(--c-gold); 
            border: 1px solid var(--c-gold); margin-top: 10px; font-family: inherit;
        }

        .btn-start {
            padding: 10px 50px; font-size: 1.5rem; font-weight: bold;
            background: var(--c-gold); color: #1a0f00; border: 2px solid #fff; 
            cursor: pointer; margin-top: 20px; border-radius: 2px;
            font-family: "Cinzel", "Noto Serif SC", serif;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }
        .btn-start:hover { filter: brightness(1.2); letter-spacing: 2px; transition: 0.3s; }

        /* === BOSS 區域 === */
        .area-top { 
            /* 左側 buff 面板寬 80px，間距 10px，所以從 100px 開始 */
            position: absolute; top: 10px; left: 100px; right: 280px; height: 140px; 
            display: flex; flex-direction: column; align-items: center; z-index: 10; 
        }
        /* Boss 標題列：名字 + inline orb + HP數字 */
        .boss-title-row { 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2rem; margin-bottom: 5px; color: var(--c-gold); 
            text-shadow: 0 2px 2px #000; gap: 8px; width: 100%;
        }
        .boss-name-text { flex: 1; font-family: "Cinzel", "Noto Serif SC", serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 標題列內嵌的小 orb 群 */
        .inline-orb-row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .inline-orb {
            width: 13px; height: 13px;
            background: radial-gradient(circle at 35% 30%, #ff6060, #6a0000);
            border-radius: 50%;
            border: 1px solid #442222;
            box-shadow: 0 0 4px rgba(180,20,20,0.5), inset 1px 1px 2px rgba(255,255,255,0.25);
            transition: 0.25s; flex-shrink: 0;
        }
        .inline-orb.lost {
            background: #111; border-color: #2a1a1a;
            box-shadow: none; transform: scale(0.7); opacity: 0.3;
        }
        .hp-text-val { 
            font-family: "Cinzel", serif; font-size: 1rem; 
            color: #c08080; flex-shrink: 0; text-shadow: 0 1px 3px #000;
        }
        .boss-hp-box { 
            width: 100%; 
            border: 1px solid #6a4e1a;
            border-top: 3px solid #8a6422;
            border-bottom: 3px solid #8a6422;
            padding: 8px; 
            background: 
                linear-gradient(to bottom, #1a1208, #120d06),
                repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0,0,0,0.06) 30px, rgba(0,0,0,0.06) 31px);
            position: relative; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5);
        }
        .boss-title-row { display: flex; justify-content: space-between; font-size: 1.3rem; margin-bottom: 5px; color: var(--c-gold); text-shadow: 0 2px 2px #000; }
        .hp-track { 
            width: 100%; height: 20px; 
            background: #150505; 
            border: 1px solid #2a1010;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
        }
        .hp-fill { 
            height: 100%; 
            background: linear-gradient(to right, #4a0000, #8a1010 40%, #b01818);
            width: 100%; transition: width 0.15s ease-out; 
            box-shadow: 0 0 8px rgba(150,20,20,0.4);
            /* 斜條紋增加質感 */
            background-image: 
                repeating-linear-gradient(60deg, transparent, transparent 6px, rgba(0,0,0,0.15) 6px, rgba(0,0,0,0.15) 12px),
                linear-gradient(to right, #4a0000, #8a1010 40%, #b01818);
        }
        
        .condition-box { 
            margin-top: 8px; 
            border: 1px solid #4a3820;
            border-left: 3px solid #8a6422;
            background: 
                linear-gradient(to right, #1a1208, #120d06),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
            padding: 6px 20px; font-size: 1rem; color: #b09060; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            transition: all 0.3s; text-align: center; width: 100%;
            font-family: "Noto Serif SC", serif;
            letter-spacing: 0.5px;
        }

        .special-status-box, .sum-display-box {
            margin-top: 5px; font-size: 1.2rem; color: var(--c-gold);
            font-weight: bold; text-shadow: 0 0 5px #000; display: none; gap: 15px;
        }
        .check-item.done { color: var(--c-green-bright); text-shadow: 0 0 10px var(--c-green-bright); }
        .sum-display-box { animation: pulseText 2s infinite alternate; }

        .ingame-skip-btn {
            position: absolute; right: -37px; top: 0;
            width: 30px; height: 30px; background: #222; border: 1px solid #444; color: #666;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            font-size: 1.2rem; border-radius: 4px; transition: 0.2s;
        }
        .ingame-skip-btn:hover { color: var(--c-gold); border-color: var(--c-gold); }

        /* === 左側 Buff 狀態面板 === */
        .area-left { 
            position: absolute; top: 10px; left: 10px; width: 80px;
            display: none; /* 預設隱藏，有 buff 時才顯示 */
            flex-direction: column; align-items: center; 
            padding: 6px 4px 4px; gap: 4px; z-index: 10;
            border: 1px solid #3a2e18;
            border-top: 2px solid #5a4520;
            border-bottom: 2px solid #5a4520;
            background: 
                linear-gradient(to bottom, #150e04, #0e0904 30%, #0a0603 70%, #150e04),
                repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 6px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 0 10px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .buff-panel-title {
            font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 1px;
            color: #6a5a3a; text-align: center; width: 100%;
            border-bottom: 1px solid #3a2810; padding-bottom: 4px;
            text-transform: uppercase; flex-shrink: 0;
        }
        .buff-chip {
            width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 6px 3px;
            border-top: 1px solid #5a4020;
            background: linear-gradient(to bottom, #1f1608, #120d04);
            animation: fadeIn 0.3s;
            flex-shrink: 0;
        }
        .buff-chip-icon { font-size: 1rem; line-height: 1; margin-bottom: 2px; }
        .buff-chip-name { 
            font-family: "Noto Serif SC", serif; font-size: 0.58rem; 
            color: #a09060; text-align: center; line-height: 1.3;
        }
        .buff-chip-turns {
            font-family: "Cinzel", serif; font-size: 1.2rem; font-weight: bold;
            color: #c5a059; text-shadow: 0 0 6px rgba(180,130,50,0.4);
            line-height: 1; margin-top: 2px;
        }
        .buff-chip-turns-label {
            font-family: "Cinzel", serif; font-size: 0.5rem;
            color: #6a5a3a; letter-spacing: 1px;
        }

        /* === 敵方意圖 === */
        .area-right-top { 
            position: absolute; top: 10px; right: 20px; width: 220px; height: 130px; 
            border: 1px solid #5a2020;
            border-top: 3px solid #7a2a2a;
            border-bottom: 3px solid #7a2a2a;
            background: 
                linear-gradient(160deg, #200808, #160404 40%, #0e0202),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
            padding: 10px; 
            text-align: center; z-index: 10;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
            /* 去掉現代clip-path，改用側邊裝飾線 */
        }
        /* 裝飾性角章 */
        .area-right-top::before {
            content: "⚔";
            position: absolute;
            top: 4px; right: 6px;
            font-size: 0.7rem;
            color: #5a2020;
            opacity: 0.7;
        }
        .area-right-top.broken {
            border-color: #2a6a35;
            border-top-color: #3a8a45;
            border-bottom-color: #3a8a45;
            background: 
                linear-gradient(160deg, #081a0a, #040e05 40%, #020802),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
        }
        .intent-label { font-size: 1rem; color: #ffa8a8; font-weight: bold; margin-bottom: 5px; font-family: "Cinzel", serif; }
        .dmg-val { 
            font-size: 3.5rem; color: #ff4d4d; font-weight: bold; 
            line-height: 1; text-shadow: 0 0 10px #500; margin-bottom: 5px;
            font-family: "Cinzel", serif;
        }
        .def-info { font-size: 0.9rem; color: #aaa; }
        .def-val { color: var(--c-green-bright); font-weight: bold; margin-left: 5px; font-size: 1.1rem; }

        /* === [修改] 技能欄：2x2 網格佈局 === */
        .area-right-mid { 
            position: absolute; top: 150px; right: 20px; bottom: 260px; 
            width: 220px; 
            /* 古卷/法典風格邊框 */
            border: 1px solid #5a3e1a;
            border-top: 3px solid #7a5522;
            border-bottom: 3px solid #7a5522;
            background: 
                linear-gradient(to bottom, #1a1208, #120d06 30%, #0e0a04 70%, #1a1208),
                repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.08) 20px, rgba(0,0,0,0.08) 21px);
            display: flex; flex-direction: column; 
            padding: 8px; gap: 8px;
            z-index: 10;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 2px 0 8px rgba(0,0,0,0.4), -2px 0 8px rgba(0,0,0,0.4);
        }
        /* 裝飾性邊角 */
        .area-right-mid::before, .area-right-mid::after {
            content: "✦";
            position: absolute;
            color: #7a5522;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .area-right-mid::before { top: 4px; left: 6px; }
        .area-right-mid::after { top: 4px; right: 6px; }
        
        .skill-title {
            color: #c5a059; 
            font-weight: bold; 
            text-align: center;
            padding-bottom: 4px;
            padding-top: 2px;
            border-bottom: 1px solid #3a2810;
            font-family: "Cinzel", serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(180,130,50,0.4);
        }

        .skill-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            flex-grow: 1;
        }
        
        .skill-btn {
            /* 羊皮紙/石板風格 */
            background: 
                linear-gradient(160deg, #252018 0%, #1a1610 40%, #111009 100%);
            border: 1px solid #4a3515; 
            border-top: 1px solid #5a4520;
            color: #d0c090; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            width: 100%; height: 100%; 
            transition: 0.2s;
            border-radius: 1px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4);
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
        /* 技能按鈕的石刻裝飾線 */
        .skill-btn::before {
            content: "";
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(180,130,50,0.1);
            pointer-events: none;
        }
        .skill-btn .s-img {
            position: absolute;
            top: 5px;
            height: 65%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.8)) sepia(0.2);
            transition: 0.2s;
            z-index: 1;
        }

        .skill-btn .s-name { 
            font-family: "Noto Serif SC", serif;
            font-weight: bold; 
            font-size: 1rem; 
            color: #e0d0a0;
            text-shadow: 0 1px 3px #000, 0 0 5px rgba(0,0,0,0.8);
            z-index: 2;
            margin-bottom: 1px;
        }
        .skill-btn .s-cost { font-size: 0.75rem; color: #8a7a5a; }
        .skill-btn .s-count { 
            font-family: "Cinzel", serif;
            font-size: 0.8rem; 
            color: #c5a059; 
            font-weight: bold;
            text-shadow: 0 1px 2px #000;
            z-index: 2;
            letter-spacing: 1px;
        }
        .skill-btn:hover:not(:disabled) .s-img {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px rgba(180,130,50,0.5)) sepia(0.1);
        }

        .skill-btn:hover:not(:disabled) { 
            background: linear-gradient(160deg, #302818 0%, #221c0e 40%, #1a1409 100%);
            border-color: #7a5522;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3), 0 0 8px rgba(120,80,20,0.2);
        }
        .skill-btn.active { 
            border-color: var(--c-gold); 
            background: linear-gradient(160deg, #3d3015, #2b2010, #201800);
            box-shadow: 0 0 12px rgba(180,130,40,0.4), inset 0 0 10px rgba(180,130,40,0.1); 
        }
        .skill-btn.targetable-skill { border-color: #2a6a35; background: #071a0a; cursor: crosshair; }
        .skill-btn:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
            filter: grayscale(0.9) brightness(0.6); 
        }

        /* === 玩家 HP === */
        .area-right-bot { 
            position: absolute; bottom: 20px; right: 20px; width: 220px; height: 230px; 
            /* 改為八角形紋章盾牌造型，告別現代圓形UI */
            border: none;
            background: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 10;
        }
        /* 用 SVG clip-path 做盾牌/紋章形狀 */
        .area-right-bot::before {
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 40% 30%, #0a2a0a, #001800 60%, #000d00);
            clip-path: polygon(50% 0%, 90% 15%, 100% 50%, 90% 90%, 50% 100%, 10% 90%, 0% 50%, 10% 15%);
            border: none;
            z-index: -1;
        }
        .area-right-bot::after {
            content: "";
            position: absolute; inset: 3px;
            background: transparent;
            clip-path: polygon(50% 0%, 90% 15%, 100% 50%, 90% 90%, 50% 100%, 10% 90%, 0% 50%, 10% 15%);
            border: 2px solid #1a6b2a;
            box-shadow: 0 0 20px rgba(40,140,60,0.3), inset 0 0 30px rgba(0,60,0,0.5);
            z-index: -1;
            outline: 1px solid #0d3d18;
            outline-offset: 4px;
        }
        .php-val { font-size: 4.5rem; font-weight: bold; line-height: 1; color: #6ddb7a; text-shadow: 0 0 20px #0a4010, 0 2px 0 #001800; letter-spacing: -2px; }
        .php-lbl { font-size: 0.85rem; color: #4a9a58; margin-top: 5px; font-family: "Cinzel", serif; letter-spacing: 3px; text-transform: uppercase; }

        /* === 儀表板 === */
        .dashboard-container { 
            position: absolute; bottom: 160px; left: 120px; right: 260px; height: 200px; 
            z-index: 20; 
            transform: perspective(800px) rotateX(20deg); 
            transform-origin: bottom center; 
            /* 石板/木板紋理感 */
            border: 3px solid #3e2e18;
            border-top: 4px solid #5a4020;
            border-bottom: 4px solid #5a4020;
            background-color: #1a1508;
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,0,0,0.12) 60px, rgba(0,0,0,0.12) 61px),
                repeating-linear-gradient(0deg, transparent, transparent 8px, rgba(255,255,255,0.015) 8px, rgba(255,255,255,0.015) 9px),
                linear-gradient(to bottom, #211a0a, #1a1206 30%, #120e04 70%, #1a1508);
            display: grid; grid-template-columns: 1fr 240px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.7);
        }
        .dash-left { border-right: 2px solid #3e3025; padding: 10px 20px; display: flex; flex-direction: column; }
        .track-box { 
    flex-grow: 1; background: rgba(0,0,0,0.4); border: 1px inset #554433; 
    display: flex; align-items: center; padding: 0 10px; gap: 5px;
    overflow-x: auto;   /* ← hidden 改為 auto */
    overflow-y: hidden;

.btn-end {

.mini-card[data-link]::before {

.mini-card[data-link="color"]::before { content: "—"; }

/* ---------- 增益／未來視界 ---------- */
.area-left, .future-sight-container { padding: 8px 6px !important; }

}
.buff-chip {
    border: none; border-radius: 10px; margin-top: 4px;

    box-shadow: inset 0 0 0 1px rgba(216, 180, 106, 0.25);
}

/* ---------- 手牌：扇形、可出的牌發亮、不能出的牌沉下去 ---------- */
.area-hand {
    gap: 0; padding-bottom: 6px;
    background: radial-gradient(ellipse 60% 100% at 50% 100%, rgba(40, 24, 8, 0.95), rgba(0, 0, 0, 0) 70%),
                linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
}
.card {
    width: 90px; height: 124px; margin: 0 -4px;
    border: none !important; outline: none !important; border-radius: 8px;
    background: center / 100% 100% no-repeat !important;
    transform-origin: 50% 130%;
    transform: translateY(var(--fan-y, 0)) rotate(var(--fan-r, 0deg));
    transition: transform 0.18s ease-out, filter 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 14px rgba(0, 0, 0, 0.7), 0 0 0 0 rgba(243, 220, 160, 0);
    font-size: 2.6rem;
}
.card::before { content: none; }
.card.red { background-image: var(--rf-card-red) !important; }
.card.blue { background-image: var(--rf-card-blue) !important; }
.card.green { background-image: var(--rf-card-green) !important; }
.card.yellow { background-image: var(--rf-card-yellow) !important; }
.card:not(.disabled):not(.targetable) {
    box-shadow: 0 8px 14px rgba(0, 0, 0, 0.7), 0 0 14px rgba(243, 210, 130, 0.45);
}
.card:hover {
    transform: translateY(calc(var(--fan-y, 0px) - 30px)) rotate(0deg) scale(1.1);
    box-shadow: 0 16px 26px rgba(0, 0, 0, 0.85), 0 0 22px rgba(243, 210, 130, 0.7) !important;
    z-index: 100;
}
.card.disabled {
    filter: brightness(0.45) saturate(0.35); opacity: 1;
    transform: translateY(calc(var(--fan-y, 0px) + 14px)) rotate(var(--fan-r, 0deg)) scale(0.92);
}
.card.disabled:hover { transform: translateY(calc(var(--fan-y, 0px) + 14px)) rotate(var(--fan-r, 0deg)) scale(0.92); }
.card.targetable {
    filter: brightness(1.1);
    animation: rfTarget 0.9s ease-in-out infinite alternate;
}
.card.token::after { top: 22px; right: 7px; }
@keyframes rfTarget {
    from { box-shadow: 0 8px 14px rgba(0, 0, 0, 0.7), 0 0 6px rgba(125, 240, 142, 0.5); }
    to { box-shadow: 0 8px 14px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(125, 240, 142, 0.8), 0 0 22px rgba(125, 240, 142, 0.8); }
}

/* ---------- 選色器 ---------- */
.cp-options { padding: 26px 34px !important; gap: 26px; }
.cp-btn { filter: brightness(0.85); }
.cp-btn::after {
    content: ""; position: absolute; inset: 0;

}
.cp-btn:nth-child(1)::after { background-image: var(--rf-emblem-red); }
.cp-btn:nth-child(2)::after { background-image: var(--rf-emblem-blue); }
.cp-btn:nth-child(3)::after { background-image: var(--rf-emblem-green); }
.cp-btn:nth-child(4)::after { background-image: var(--rf-emblem-yellow); }
#color-picker h2 { border-bottom: none; padding-bottom: 16px; background: var(--rf-divider) center bottom / 220px 14px no-repeat; }

#ready-screen > *, #defeat-modal > * { position: relative; z-index: 1; }
.ready-title, .defeat-title {

}
.defeat-title { font-size: 3.4rem; margin-bottom: 0; }
.btn-ready, .btn-start, .d-btn {
    position: relative; border: none !important; border-radius: 0 !important;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
    background: linear-gradient(to bottom, #f3dca0, #c89a4a 55%, #8a6224) !important;
    color: #2a1804 !important; text-shadow: 0 1px 0 rgba(255, 240, 200, 0.6);

}
.btn-ready:hover, .btn-start:hover, .d-btn:hover { filter: brightness(1.15); transform: scale(1.04); letter-spacing: normal; }
.d-btn { background: linear-gradient(to bottom, #6a5a44, #3a2e20 60%, #241a10) !important; color: #e8dcc4 !important; text-shadow: 0 1px 2px #000; }
.d-btn.skip { background: linear-gradient(to bottom, #f3dca0, #c89a4a 55%, #8a6224) !important; color: #2a1804 !important; }

.sel-header h1 {
    color: var(--rf-gold-hi) !important; letter-spacing: 6px;
    padding-bottom: 16px; background: var(--rf-divider) center bottom / 240px 14px no-repeat;
}
.sel-card {
    overflow: visible; padding: 10px 14px !important; height: 150px !important;
    transition: transform 0.2s, filter 0.2s;
}
.sel-card:hover { transform: translateY(-5px); filter: brightness(1.12); }
.sel-card.selected {
    border-image-source: var(--rf-frame-gold) !important;
    box-shadow: 0 0 24px rgba(243, 200, 110, 0.35), 0 10px 28px rgba(0, 0, 0, 0.55) !important;
}
.sel-card.selected::after {
    content: ""; position: absolute; right: -10px; top: -10px; width: 36px; height: 36px;
    background: var(--rf-seal) center / 100% no-repeat;

    animation: rfStamp 0.25s ease-out;
}
.rf-sel-portrait {
    position: absolute; right: 6px; bottom: 6px; height: 88px; width: auto;
    opacity: 0.22; pointer-events: none; filter: sepia(0.4);
    -webkit-mask: linear-gradient(to left, #000 40%, transparent);
            mask: linear-gradient(to left, #000 40%, transparent);
}
.sel-card.selected .rf-sel-portrait { opacity: 0.45; filter: none; }
.sel-card > *:not(.rf-sel-portrait) { position: relative; }
.sel-title { border-bottom: 1px solid rgba(216, 180, 106, 0.25); }
.rf-sel-count {
    margin-top: 6px; padding: 4px 18px; border-radius: 14px; letter-spacing: 2px;
    color: #c8b8a0; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(216, 180, 106, 0.3);
}
.rf-sel-count.rf-full { color: var(--rf-gold-hi); border-color: var(--rf-gold); }

#turn-overlay { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.9) 70%); }
#turn-overlay-text {

        var(--rf-divider) center top / 420px 14px no-repeat,

}

}
#bgm-toggle-btn { border-radius: 50%; border: 1px solid rgba(216, 180, 106, 0.4); }

@keyframes rfBreath { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
@keyframes rfPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@keyframes rfStamp { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
</style>
</head>

    async function getST(varName) {

    async function setST(varName, val) {
    try {
        if (window.parent && window.parent.RPGBridge && typeof window.parent.RPGBridge.setVar === 'function') {
            return await window.parent.RPGBridge.setVar(varName, val);
        }
    } catch(e) {
        console.warn('[Mini] setST via Bridge 失敗，嘗試 fallback:', e);
    }
    // Fallback：直接呼叫 top window 的 setGlobalVariable
    try {
        if (typeof window.top.setGlobalVariable === 'function') {
            return window.top.setGlobalVariable(varName, val);
        }
    } catch(e2) {
        console.error('[Mini] setST 所有方式皆失敗:', e2);
    }
}

async function execST(cmd) {
    // 舊：window.parent.RPGBridge.execute(cmd)
    try { return await triggerSlash(cmd); } 
    catch(e) { console.warn('[Mini] execST 失敗:', cmd, e); }
}

        if (window.parent && window.parent.RPGBridge) {
            targetName = await window.parent.RPGBridge.getVar('世界.迷宫攻略.当前攻略对象');

                enemyId = "enemy_1";

        } else {

                enemyId = sel.value;
            } else if (targetName && CHAR_TO_ENEMY_MAP[targetName]) {
                enemyId = CHAR_TO_ENEMY_MAP[targetName];
            }
        }
        
        if (!ENEMIES_DB[enemyId]) enemyId = "enemy_1";
        currentEnemyData = JSON.parse(JSON.stringify(ENEMIES_DB[enemyId]));
        
        // [新增] 應用 BOSS 專屬背景
        if (currentEnemyData.bg) {
            document.body.style.backgroundImage = currentEnemyData.bg;
        } else {
             document.body.style.backgroundImage = "radial-gradient(circle at center, #1a1512, #050403)";
        }

        // 隨機化處理
        if (enemyId === "enemy_2") {
    // 只抽出顏色部分來打亂
    const colors = currentEnemyData.phases.map(p => p.params.color);
    const descs = {
        'red': '红色连击：连续出红牌造成 1 点伤害',
        'blue': '蓝色连击：连续出蓝牌造成 1 点伤害',
        'green': '绿色连击：连续出绿牌造成 1 点伤害',
        'yellow': '黄色连击：连续出黄牌造成 1 点伤害'
    };
    
    // 打亂顏色順序
    for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
    }
    
    // 顏色套回各階段，atk 保持原本遞增設定不動
    currentEnemyData.phases.forEach((p, i) => {
        p.params = { color: colors[i] };
        p.desc = descs[colors[i]];
    });
}

        if (enemyId === "enemy_9") {
            const firstThree = [currentEnemyData.phases[0], currentEnemyData.phases[1], currentEnemyData.phases[2]];
            for (let i = firstThree.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [firstThree[i], firstThree[j]] = [firstThree[j], firstThree[i]];
            }
            currentEnemyData.phases[0] = firstThree[0];
            currentEnemyData.phases[1] = firstThree[1];
            currentEnemyData.phases[2] = firstThree[2];
        }

        if (enemyId === "enemy_8") {
            const modeGenerators = [
                // 1. 基礎計數 (參考 Enemy 1)
                // 原版 HP 10，BOSS 版提升至 20
                () => ({ 
                    mode: "count", 
                    hp: 15,
                    params: {}, 
                    desc: "计数：出一张牌造成 1 伤害" 
                }),
                
                // 2. 顏色連擊 (參考 Enemy 2)

                () => {
                    const colors = ['red', 'blue', 'green', 'yellow'];
                    const cMap = {'red':'红', 'blue':'蓝', 'green':'绿', 'yellow':'黄'};
                    const picked = colors[Math.floor(Math.random() * colors.length)];
                    return { 
                        mode: "color_chain", 
                        hp: 10,
                        params: { color: picked }, 
                        desc: `同色：连续出${cMap[picked]}牌造成伤害` 
                    };
                },

                // 3. 顏色變換 (參考 Enemy 3)
                () => ({ 
                    mode: "color_switch", 
                    hp: 7,
                    params: {}, 
                    desc: "变幻：切换颜色时造成伤害" 
                }),

                // 4. 數值落差 (參考 Enemy 4)
                () => ({ 
                    mode: "diff", 
                    hp: 40,
                    params: {}, 
                    desc: "落差：造成前后牌差值的伤害" 
                }),

                // 5. 連擊節奏 (參考 Enemy 5)
                // 攻擊頻率極低 (每 3~5 張牌才打一下)，HP 必須極低
                () => {
                    const mod = Math.floor(Math.random() * 3) + 3; // 隨機 3, 4, 5 連擊

                    const adjustedHp = Math.floor(60 / mod / 4); 
                    return { 
                        mode: "combo_mod", 
                        hp: adjustedHp, 
                        params: { mod: mod }, 
                        desc: `节奏：每 ${mod} 连击造成伤害` 
                    };
                },

                // 6. 總和目標 (參考 Enemy 6)
                () => {
                    const targets = [15, 20, 25]; 
                    const t = targets[Math.floor(Math.random() * targets.length)];
                    return { 
                        mode: "sum_target", 
                        hp: 2, 
                        params: { target: t }, 
                        desc: `总和：总和刚好 ${t} 造成伤害` 
                    };
                },

                // 7. 數值重擊 (參考 Enemy 7)
       
                () => ({ 
                    mode: "value", 
                    hp: 120, 
                    params: {}, 
                    desc: "重击：牌面数值即为伤害" 
                }),

                // 8. 比較大小 (參考 Enemy 9)
                () => {
                    const types = [
                        { m: "compare_asc", d: "升序：后牌 > 前牌", hp: 10 },
                        { m: "compare_desc", d: "降序：后牌 < 前牌", hp: 10 },
                        { m: "compare_eq", d: "同号：后牌 = 前牌", hp: 5 }, 
                        { m: "compare_all", d: "全序：集齐 升/降/同", hp: 1 } 
                    ];
                    const t = types[Math.floor(Math.random() * types.length)];
                    return { 
                        mode: t.m, 
                        hp: t.hp,
                        params: {}, 
                        desc: `${t.d} 时伤害` 
                    };
                }
            ];

            // 1. 洗牌
            for (let i = modeGenerators.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [modeGenerators[i], modeGenerators[j]] = [modeGenerators[j], modeGenerators[i]];
            }

            currentEnemyData.phases.forEach((p, index) => {
                const generator = modeGenerators[index % modeGenerators.length];
                const config = generator();
                

                const stageMultiplier = 1 ; 
                
                p.mode = config.mode;
                p.params = config.params;
                p.hp = Math.floor(config.hp * stageMultiplier); // 這裡設定血量
                p.maxHp = p.hp; // 記得更新 maxHp
                p.desc = `[混沌${index+1}] ${config.desc}`;
            });
        }
        // === 修改結束 ===

        availableSkills = [];
        for (let skill of SKILLS_DB) {
            if (IS_DEBUG_MODE) {
                availableSkills.push(skill);

                if (status === '3' || status === 3 ) {
                    availableSkills.push(skill);
                }
            }
        }
    }

    function toggleSkillSelection(id) {
        const idx = selectedSkillIds.indexOf(id);
        if (idx >= 0) {
            selectedSkillIds.splice(idx, 1);
        } else {
            if (selectedSkillIds.length < 4) selectedSkillIds.push(id);
        }
        updateSelectionUI();
    }

        document.querySelectorAll('.sel-card').forEach(el => el.classList.remove('selected'));
        selectedSkillIds.forEach(id => {
            const el = document.getElementById(`sel-skill-${id}`);
            if(el) el.classList.add('selected');
        });
    }

        player.equippedSkills = selectedSkillIds.map(id => {
            const proto = availableSkills.find(s => s.id === id);
            return { ...proto, charges: proto.max };
        });
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('game-stage').style.display = 'block';
        initGame();

        COLORS.forEach(color => {
            NUMBERS.forEach(num => {
                deck.push({ color: color, number: num, isToken: false });
            });
        });
        shuffle(deck);
        startNewTurn();
		playBattleMusic();
    }

    function loadEnemyPhase(index) {

        document.getElementById('game-stage').style.display = 'none';

    async function skipBattle() {
        document.getElementById('defeat-modal').style.display = 'none';
        await handleVictory();
    }

    function startNewTurn() {
        turnStats.cardsPlayed = 0; turnStats.damageDealt = 0; turnStats.combo = 0;
        currentTurnCards = []; isFirstMoveOfTurn = true;
        
        cancelTargetingMode();
        
        battleState.colorChainCount = 0; 
        battleState.sumAccumulator = 0; 
        battleState.compareFlags = { asc: false, desc: false, eq: false };
        
        isPhaseBrokenThisTurn = false;
		
		if (buffs.futureSightTurns > 0) {
        buffs.futureSightTurns--;
        if (buffs.futureSightTurns === 0) {
            showLog("未来视界效果结束");
        }
    }
		
        if (buffs.keepHandTurns > 0) {
            showLog(`Buff: 保留手牌 (${buffs.keepHandTurns})`);
            buffs.keepHandTurns--;
        } else {
            if (hand.length > 0) {
                hand.forEach(c => { if(!c.isToken) discardPile.push(c); });
                hand = [];
            }
        }

        let drawCount = 5;
        if (buffs.extraDrawTurns > 0) {
            drawCount += 2;
            showLog(`Buff: 多抽2张 (${buffs.extraDrawTurns})`);
            buffs.extraDrawTurns--;
        }

        for(let i=0; i<drawCount; i++) {
            const c = drawCardFromDeck();
            if(c) hand.push(c);
        }
        updateUI();
    }

    function drawCardFromDeck() {
        if (deck.length === 0) {
            const validDiscard = discardPile.filter(c => !c.isToken);
            if (validDiscard.length <= 0) return null; 
            
            deck = [...validDiscard];
            discardPile = [];
            shuffle(deck);
        }
        return deck.pop();
    }

    function playCard(index) {
        const card = hand[index];
        
        let effectiveTopCard = null;
        if (currentTurnCards.length > 0) {
            effectiveTopCard = currentTurnCards[currentTurnCards.length - 1];
        } else {
            effectiveTopCard = discardPile[discardPile.length - 1];
        }

        let isValid = false;

        if (isFirstMoveOfTurn) isValid = true;
        else if (effectiveTopCard) {
            if (card.color === effectiveTopCard.color || Math.abs(card.number - effectiveTopCard.number) === 1 || card.number === effectiveTopCard.number) isValid = true;
        }

        if (isValid) {
            hand.splice(index, 1);
            if (!card.isToken) discardPile.push(card);
            currentTurnCards.push(card);
            turnStats.cardsPlayed++;
            turnStats.combo++; 

            let bonusDraw = false;
            if (!isFirstMoveOfTurn && effectiveTopCard) {
    const sameColor = card.color === effectiveTopCard.color;
    const sameNum = card.number === effectiveTopCard.number;
    const adjNum = Math.abs(card.number - effectiveTopCard.number) === 1;
    
    if ((sameColor && adjNum) || (!sameColor && sameNum) || (sameColor && sameNum)) bonusDraw = true;
}

            isFirstMoveOfTurn = false;
            if (bonusDraw) {
                const newCard = drawCardFromDeck();
                if (newCard) hand.push(newCard);
                showLog("BONUS DRAW!");
            }
            
            processDamageAction();
            updateUI();
        } else {
            const el = document.querySelectorAll('#hand-area .card')[index];
            if(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
        }
    }

    function calculateInstantDamage() {
        const mode = enemy.mode || "count";
        const lastCard = currentTurnCards[currentTurnCards.length - 1];
        if (!lastCard) return 0; 

        let dmg = 0;

        if (mode === "count") {
            dmg = 1; 
        } 
        else if (mode === "color_chain") {
            const targetColor = enemy.params.color;
            if (lastCard.color !== targetColor) return 0;
            
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                if (prev.color === targetColor) {
                    dmg = 1;
                }
            }
        }
        else if (mode === "color_switch") {
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                if (lastCard.color !== prev.color) dmg = 1;
            }
        }
        else if (mode === "diff") {
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                dmg = Math.abs(lastCard.number - prev.number);
            }
        }
        else if (mode === "combo_mod") {
            const mod = enemy.params.mod || 3;
            if (turnStats.combo > 0 && turnStats.combo % mod === 0) dmg = 1;
        }
        else if (mode === "sum_target") {
            const target = enemy.params.target || 15;
            battleState.sumAccumulator += lastCard.number;
            
            if (battleState.sumAccumulator === target) {
                dmg = 1;
                battleState.sumAccumulator = 0; 
            } else if (battleState.sumAccumulator > target) {
                battleState.sumAccumulator -= target; 
            }
        }
        else if (mode === "value") {
            dmg = lastCard.number;
        }
        else if (mode === "compare_asc") {
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                if (lastCard.number > prev.number) dmg = 1;
            }
        }
        else if (mode === "compare_desc") {
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                if (lastCard.number < prev.number) dmg = 1;
            }
        }
        else if (mode === "compare_eq") {
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                if (lastCard.number === prev.number) dmg = 1;
            }
        }
        else if (mode === "compare_all") {
            if (currentTurnCards.length >= 2) {
                const prev = currentTurnCards[currentTurnCards.length - 2];
                if (lastCard.number > prev.number) battleState.compareFlags.asc = true;
                else if (lastCard.number < prev.number) battleState.compareFlags.desc = true;
                else battleState.compareFlags.eq = true;
                
                if (battleState.compareFlags.asc && battleState.compareFlags.desc && battleState.compareFlags.eq) {
                    dmg = 1;
                    battleState.compareFlags = { asc: false, desc: false, eq: false };
                }
            }
        }

        return dmg;
    }

    function processDamageAction() {
        const damage = calculateInstantDamage();
        if (damage > 0) {
            enemy.hp = Math.max(0, enemy.hp - damage);
            showLog(`- ${damage} `);
        }

        if (enemy.hp <= 0) {
            const hasNextPhase = loadEnemyPhase(enemy.phaseIndex + 1);
            if (hasNextPhase) {
                isPhaseBrokenThisTurn = true;
                showLog("BREAK!!");
            } else {
                handleVictory();
            }
        }
    }

    function cancelTargetingMode() {
        if (!targetingMode) return;
        targetingMode = null;
        pendingColorSrc = null;
        document.getElementById('color-picker').style.display = 'none';
        showLog("操作已取消");
        updateUI();
    }

    function useSkill(index) {
        if (targetingMode) {
            if (targetingMode.type === 'MIMIC_SELECT') {
                if (index === targetingMode.skillIndex) {
                    cancelTargetingMode();
                    return;
                }
                resolveMimicSelection(index);
                return;
            }
            
            cancelTargetingMode();
            return;
        }
        
        const skill = player.equippedSkills[index];
        if (skill.charges <= 0) { showLog("次数已用尽！"); return; }

        if (skill.id === 2) { 
             if (player.equippedSkills.length <= 1) { showLog("无其它支援可选择"); return; }
             showLog("请点击另一个支援...");
             targetingMode = { type: 'MIMIC_SELECT', skillIndex: index }; 
             updateUI();
             return;
        }
        executeSkillLogic(skill.id, index);
    }

    function resolveMimicSelection(targetIndex) {
        const sourceIndex = targetingMode.skillIndex;
        const targetSkill = player.equippedSkills[targetIndex];
        if (targetSkill.id === 2) { showLog("无法选择自身"); return; }
        showLog(`发动了 ${targetSkill.name}`);
        targetingMode = null; 
        executeSkillLogic(targetSkill.id, sourceIndex);
    }

    function executeSkillLogic(skillId, costIndex) {
        const costSkill = player.equippedSkills[costIndex];
        switch (skillId) {
            case 1:
                costSkill.charges--;
                const count = hand.length === 0 ? 4 : 2;
                for(let i=0; i<count; i++) { const c=drawCardFromDeck(); if(c) hand.push(c); }
                showLog(`抽牌 +${count}`); 
                updateUI(); 
                break;
            case 3:
                showLog("选择丢弃手牌...");
                targetingMode = { type: 'DISCARD_HEAL', skillIndex: costIndex };
                updateUI(); break;
            case 4:
                showLog("选择切割手牌...");
                targetingMode = { type: 'SPLIT', skillIndex: costIndex };
                updateUI(); break;
            case 5: // 芙蕾嘉的新技能邏輯
        costSkill.charges--;
        buffs.futureSightTurns = 3; // 設定 Buff 持續 3 回合 (本回合開始算)
        showLog("开启未来视界 (3回合)"); 
        updateUI(); 
        break;
            case 6:
                showLog("选择来源颜色...");
                targetingMode = { type: 'COLOR_SRC', skillIndex: costIndex };
                updateUI(); break;
            case 7:
                costSkill.charges--;
                buffs.extraDrawTurns += 3;
                showLog("Buff: 回合抽牌增加"); updateUI(); break;
            case 8:
                costSkill.charges--;
                buffs.keepHandTurns += 3;
                showLog("Buff: 手牌保留"); updateUI(); break;
        }
    }

    function handleCardClick(index) {
        if (targetingMode) {
            if (targetingMode.type === 'MIMIC_SELECT') {
                cancelTargetingMode();
                return;
            }

            const card = hand[index];
            const skillIdx = targetingMode.skillIndex; 

            if (targetingMode.type === 'DISCARD_HEAL') {
                hand.splice(index, 1);
                if (!card.isToken) discardPile.push(card);
                player.hp = Math.min(player.maxHp, player.hp + 20);
                player.equippedSkills[skillIdx].charges--;
                showLog("生命 +20");
                targetingMode = null;
            }
            else if (targetingMode.type === 'SPLIT') {
                if (card.number <= 1) { showLog("數字太小無法切割"); return; }
                hand.splice(index, 1);
                if (!card.isToken) discardPile.push(card);
                const v1 = Math.floor(Math.random() * (card.number - 1)) + 1;
                const v2 = card.number - v1;
                hand.push({color:card.color, number:v1, isToken:true, id:Math.random()}, {color:card.color, number:v2, isToken:true, id:Math.random()});
                player.equippedSkills[skillIdx].charges--;
                showLog(`切割為 ${v1} & ${v2}`);
                targetingMode = null;
            }
            else if (targetingMode.type === 'COLOR_SRC') {
                pendingColorSrc = card.color;
                document.getElementById('color-picker').style.display = 'flex';
                return;
            }
            updateUI();
        } else {
            playCard(index);
        }
    }

    function resolveColorPick(targetColor) {
        const skillIdx = targetingMode.skillIndex;
        const srcColor = pendingColorSrc;
        let count = 0;
        for (let i = 0; i < hand.length; i++) {
            if (hand[i].color === srcColor) {
                const old = hand[i];
                hand[i] = { color: targetColor, number: old.number, isToken: true, id: Math.random() };
                if (!old.isToken) discardPile.push(old);
                count++;
            }
        }
        player.equippedSkills[skillIdx].charges--;
        showLog(`轉化了 ${count} 張牌`);
        document.getElementById('color-picker').style.display = 'none';
        targetingMode = null; pendingColorSrc = null;
        updateUI();
    }

    function cancelColorPick() {
        cancelTargetingMode();
    }

    async function endTurn() {
    if (targetingMode) { 
        cancelTargetingMode();
        return; 
    }

    // 先把所有按鈕鎖住，防止重複點擊
    document.getElementById('game-stage').style.pointerEvents = 'none';

    const currentEnemyAtk = isPhaseBrokenThisTurn ? 0 : enemy.atk;
    const defense = turnStats.cardsPlayed * DEFENSE_PER_CARD;
    const incoming = Math.max(0, currentEnemyAtk - defense);

    // === 第一幕：Enemy Turn ===
    const overlay = document.getElementById('turn-overlay');
    const overlayText = document.getElementById('turn-overlay-text');
    const overlaySub = document.getElementById('turn-overlay-sub');

    overlayText.style.color = '#ff4d4d';
    overlayText.innerText = 'ENEMY ATTACK!';

    if (isPhaseBrokenThisTurn) {
        overlaySub.innerText = '— STUNNED —';
        overlayText.style.color = '#51cf66';
        overlayText.innerText = 'BREAK!';
    } else if (incoming > 0) {
        overlaySub.innerText = `受到 ${incoming} 点伤害`;
    } else {
        overlaySub.innerText = '— GUARD —';
        overlayText.style.color = '#4dabf7';
    }

    overlay.classList.add('visible');
    await sleep(700);

	overlay.style.animation = 'fadeOut 0.3s ease-out forwards';
	await sleep(300);
	overlay.classList.remove('visible');
	overlay.style.animation = '';

    // 實際結算傷害
    if (incoming > 0) {
        player.hp = Math.max(0, player.hp - incoming);
        updateUI();
    }

    if (player.hp <= 0) {
        overlay.classList.remove('visible');
        document.getElementById('game-stage').style.pointerEvents = '';
        document.getElementById('defeat-modal').style.display = 'flex';
        return;
    }

    // === 第二幕：Your Turn ===
	await sleep(300);
    overlayText.style.color = '#c5a059';
    overlayText.innerText = 'YOUR TURN';
    overlaySub.innerText = 'FORWARD!';
	overlay.classList.add('visible');
    await sleep(600);

    // 淡出遮罩
    overlay.style.animation = 'fadeOut 0.3s ease-out forwards';
    await sleep(300);
    overlay.classList.remove('visible');
    overlay.style.animation = '';

    document.getElementById('game-stage').style.pointerEvents = '';

    startNewTurn();
}

// 輔助函數
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function handleVictory() {
    showLog("勝利！");
    try {
        if (currentTargetName && currentTargetName !== '非攻略中') {
            // 直接更新變量
            await setST(`世界.妈妈.${currentTargetName}.状态`, '3');
            await setST(`世界.妈妈.${currentTargetName}.在队状态`, '是');
            await setST('世界.迷宫攻略.当前攻略对象', '非攻略中');

            // 發訊息通知 AI
            const success = sendMsgViaDOM(`战斗结束！成功攻略${currentTargetName}！`);
            if (!success) {
                showLog("訊息發送失敗，請手動發送");
            }
        }
        setTimeout(() => {
            window.parent?.RPGBridge?.closeGame?.();
        }, 1000);
    } catch (err) {          
        console.error("结算失败:", err);
        showLog("结算发生错误: " + (err?.message || String(err)));
    }
}

	function sendMsgViaDOM(message) {
        try {
            // 1. 尝试获取顶层窗口 (SillyTavern 主窗口)
            // 使用 window.top 比 window.parent 更安全，防止多层嵌套
            const targetWin = window.top; 
            const targetDoc = targetWin.document;

            // 2. 查找关键元素
            const textarea = targetDoc.getElementById('send_textarea');
            const sendButton = targetDoc.getElementById('send_but');

            if (!textarea || !sendButton) {
                // 如果找不到，很可能是因为开启了"沉浸模式"(Immersive Mode)导致UI被隐藏
                showLog("错误: 找不到发送按钮 (请关闭沉浸模式)");
                console.error("DOM Elements missing. Textarea:", textarea, "Btn:", sendButton);
                return false;
            }

            // 3. 填入消息 (优先使用 jQuery 触发，确保 ST 识别到变动)
            if (targetWin.jQuery) {
                const $ = targetWin.jQuery;
                $(textarea).val(message).trigger('input').trigger('change'); // 同时触发 input 和 change
            } else {
                // 降级方案：原生 JS
                textarea.value = message;
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
                textarea.dispatchEvent(new Event('change', { bubbles: true }));
            }

            // 4. 模拟点击 (优先使用 jQuery 点击)
            if (targetWin.jQuery) {
                const $ = targetWin.jQuery;
                $(sendButton).click();
            } else {
                sendButton.click();
            }
            
            showLog("指令已发送至 ST");
            return true;

        } catch (e) {
            // 将错误打印到游戏屏幕上，方便调试
            showLog("发送失败: " + e.message);
            console.error("DOM Send Error:", e);
            return false;
        }
    }

        }
    }

	// 未來視界、鼓舞之心、不動信念的顯示統一由 updateBuffPanel() 處理（在 updateUI 末段呼叫）
}

        document.getElementById('hp-text').innerText = `${enemy.hp}/${enemy.maxHp}`;

        else {
			const displayCards = currentTurnCards.slice(-11);
            trackDiv.innerHTML = displayCards.map(c => `<div class="mini-card ${c.color}">${c.number}</div>`).join('');
            trackDiv.scrollLeft = trackDiv.scrollWidth;
        }

    function updateBuffPanel() {
        const panel = document.getElementById('buff-panel');
        if (!panel) return;

        // 清除舊 chip（保留標題）
        panel.querySelectorAll('.buff-chip').forEach(el => el.remove());

        const chips = [];

        if (buffs.extraDrawTurns > 0) {
            chips.push(`
                <div class="buff-chip">
                    <div class="buff-chip-icon">✦</div>
                    <div class="buff-chip-name">鼓舞<br>之心</div>
                    <div class="buff-chip-turns">${buffs.extraDrawTurns}</div>
                    <div class="buff-chip-turns-label">TURNS</div>
                </div>`);
        }

        if (buffs.keepHandTurns > 0) {
            chips.push(`
                <div class="buff-chip">
                    <div class="buff-chip-icon">🛡</div>
                    <div class="buff-chip-name">不动<br>信念</div>
                    <div class="buff-chip-turns">${buffs.keepHandTurns}</div>
                    <div class="buff-chip-turns-label">TURNS</div>
                </div>`);
        }

        // 整個面板：有 buff 才顯示
        if (chips.length === 0) {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'flex';
            chips.forEach(html => {
                const tmp = document.createElement('div');
                tmp.innerHTML = html.trim();
                panel.appendChild(tmp.firstElementChild);
            });
        }

        // 未來視界：獨立面板
        const fsArea = document.getElementById('future-sight-area');
        const fsList = document.getElementById('fs-cards-list');
        if (fsArea && fsList) {
            if (buffs.futureSightTurns > 0 && deck.length > 0) {
                fsArea.style.display = 'flex';
                let previewHtml = '';
                const peekCount = Math.min(3, deck.length);
                for (let i = 1; i <= peekCount; i++) {
                    const card = deck[deck.length - i];
                    previewHtml += `<div class="mini-card fs-card-slot ${card.color}">${card.number}</div>`;
                }
                fsList.innerHTML = previewHtml;
            } else {
                fsArea.style.display = 'none';
            }
        }
    }

    function showLog(msg) {
        const el = document.getElementById('log-overlay');
        el.innerText = msg; el.style.opacity = 1;
        setTimeout(() => el.style.opacity = 0, 1500);
    }

    window.addEventListener('click', function(e) {
        if (!targetingMode) return;

        if (e.target.closest('.card') || 
            e.target.closest('.skill-btn') || 
            e.target.closest('.btn-full') || 
            e.target.closest('.ingame-skip-btn') ||
            e.target.closest('#color-picker')) {
            return;
        }

        cancelTargetingMode();
    });

<script id="rf-refresh-deco">
/* miniMVU2 視覺更新提案 — canvas 素材產生 + 純裝飾觀察器
 * 只加裝飾節點、class、CSS 變數，不改任何遊戲狀態或流程。
 * 必須放在遊戲主 <script> 之後（會讀取 SKILLS_DB / SKILL_ICONS）。 */
(function () {
    'use strict';
    const DPR = 2;
    const ASSETS = {};   // 供預覽頁「素材」分頁讀取
    const root = document.documentElement;

    function paint(name, w, h, note, draw) {
        const c = document.createElement('canvas');
        c.width = w * DPR; c.height = h * DPR;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.scale(DPR, DPR);
        draw(g, w, h);
        ASSETS[name] = { canvas: c, w, h, note };
        // 素材畫在 CPU 畫布（willReadFrequently）上，再用 toBlob 背景壓縮，開場只多約 15ms
        c.toBlob(blob => {
            root.style.setProperty('--rf-' + name, 'url("' + URL.createObjectURL(blob) + '")');
        }, 'image/png');
    }

    function chamfer(g, x, y, w, h, c) {
        g.beginPath();
        g.moveTo(x + c, y); g.lineTo(x + w - c, y); g.lineTo(x + w, y + c);
        g.lineTo(x + w, y + h - c); g.lineTo(x + w - c, y + h); g.lineTo(x + c, y + h);
        g.lineTo(x, y + h - c); g.lineTo(x, y + c); g.closePath();
    }
    function rrect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function goldGrad(g, x0, y0, x1, y1, hi, mid, lo) {
        const gr = g.createLinearGradient(x0, y0, x1, y1);
        gr.addColorStop(0, hi); gr.addColorStop(0.45, mid); gr.addColorStop(1, lo);
        return gr;
    }

    // ---------- 9-slice 面板框（切角 + 角落卷紋） ----------
    function drawCornerOrnament(g, col, colDim) {
        g.save();
        g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.2;
        // 切角上的菱形
        g.beginPath(); g.moveTo(11, 5); g.lineTo(17, 11); g.lineTo(11, 17); g.lineTo(5, 11); g.closePath(); g.fill();
        // 沿上邊與左邊的卷紋
        g.beginPath(); g.moveTo(20, 9); g.quadraticCurveTo(27, 9, 29, 13); g.arc(26.5, 13, 2.5, 0, Math.PI * 1.6); g.stroke();
        g.beginPath(); g.moveTo(9, 20); g.quadraticCurveTo(9, 27, 13, 29); g.arc(13, 26.5, 2.5, Math.PI / 2, Math.PI * 2.1); g.stroke();
        g.fillStyle = colDim;
        g.beginPath(); g.arc(33, 9, 1.2, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(9, 33, 1.2, 0, Math.PI * 2); g.fill();
        g.restore();
    }
    function frame(name, w, h, o, note) {
        paint(name, w, h, note, (g) => {
            chamfer(g, 3, 3, w - 6, h - 6, 14);
            const fill = g.createLinearGradient(0, 0, 0, h);
            fill.addColorStop(0, o.fillTop); fill.addColorStop(0.5, o.fillMid); fill.addColorStop(1, o.fillBot);
            g.fillStyle = fill; g.fill();
            // 內側暈光
            g.save(); g.clip();
            g.lineWidth = 10; g.strokeStyle = o.glow; chamfer(g, 3, 3, w - 6, h - 6, 14); g.stroke();
            g.restore();
            // 外框
            g.lineWidth = 2;
            g.strokeStyle = goldGrad(g, 0, 0, 0, h, o.rimHi, o.rim, o.rimLo);
            chamfer(g, 3, 3, w - 6, h - 6, 14); g.stroke();

            g.lineWidth = 1; g.strokeStyle = o.line;
            chamfer(g, 8.5, 8.5, w - 17, h - 17, 10.5); g.stroke();

    }

    const FRAME_GOLD = { fillTop: '#241a0e', fillMid: '#150f08', fillBot: '#1d150b', glow: 'rgba(216,170,90,0.10)', rimHi: '#f3dca0', rim: '#b48a42', rimLo: '#5e421a', line: 'rgba(216,180,106,0.28)' };

    const FRAME_CRIMSON = { fillTop: '#2c0c0a', fillMid: '#180505', fillBot: '#220807', glow: 'rgba(255,70,50,0.12)', rimHi: '#f0b08a', rim: '#a4402c', rimLo: '#4a140c', line: 'rgba(255,140,110,0.22)' };
    const FRAME_VERDANT = { fillTop: '#0c2410', fillMid: '#061408', fillBot: '#0a1c0c', glow: 'rgba(90,230,120,0.14)', rimHi: '#b8f0b0', rim: '#3e9a4a', rimLo: '#164a1c', line: 'rgba(140,240,150,0.22)' };
    const FRAME_AZURE = { fillTop: '#0a1a30', fillMid: '#050d1a', fillBot: '#081528', glow: 'rgba(90,170,255,0.14)', rimHi: '#b8dcff', rim: '#3e78b8', rimLo: '#142a4a', line: 'rgba(140,200,255,0.22)' };

    frame('frame-gold', 120, 120, FRAME_GOLD, '通用面板框（9-slice，切片 36px）');
    frame('frame-dim', 120, 120, FRAME_DIM, '次要面板框：儀表板、增益、選卡');

    frame('frame-verdant', 120, 120, FRAME_VERDANT, '敵方意圖框（BREAK）');

    // ---------- 花色徽記：紅=火焰 藍=水滴 綠=葉 黃=太陽（形狀不同，色弱也分得出） ----------

        blue:   { dark: '#050d24', mid: '#173a7a', light: '#a8ccff', rim: '#4f7fd0' },
        green:  { dark: '#051608', mid: '#1c5a2a', light: '#a6ecb2', rim: '#4fa45e' },
        yellow: { dark: '#1e1402', mid: '#7a5a08', light: '#ffe49a', rim: '#d0a232' }
    };
    function emblemPath(g, suit, cx, cy, s) {
        g.beginPath();
        if (suit === 'red') {
            g.moveTo(cx, cy - s * .5);
            g.quadraticCurveTo(cx + s * .12, cy - s * .22, cx + s * .3, cy - s * .06);
            g.bezierCurveTo(cx + s * .5, cy + s * .18, cx + s * .32, cy + s * .5, cx, cy + s * .5);
            g.bezierCurveTo(cx - s * .32, cy + s * .5, cx - s * .5, cy + s * .2, cx - s * .3, cy - s * .08);
            g.quadraticCurveTo(cx - s * .16, cy + s * .06, cx - s * .12, cy - s * .2);
            g.quadraticCurveTo(cx - s * .06, cy - s * .36, cx, cy - s * .5);
        } else if (suit === 'blue') {
            g.moveTo(cx, cy - s * .5);
            g.bezierCurveTo(cx + s * .15, cy - s * .22, cx + s * .38, cy - s * .02, cx + s * .38, cy + s * .18);
            g.arc(cx, cy + s * .18, s * .38, 0, Math.PI);
            g.bezierCurveTo(cx - s * .38, cy - s * .02, cx - s * .15, cy - s * .22, cx, cy - s * .5);
        } else if (suit === 'green') {
            g.moveTo(cx, cy - s * .5);
            g.quadraticCurveTo(cx + s * .52, cy - s * .08, cx, cy + s * .44);
            g.quadraticCurveTo(cx - s * .52, cy - s * .08, cx, cy - s * .5);
        } else {
            for (let i = 0; i < 16; i++) {
                const r = i % 2 === 0 ? s * .5 : s * .24;
                const a = -Math.PI / 2 + i * Math.PI / 8;
                const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
                i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
            }
        }
        g.closePath();
    }
    function emblem(g, suit, cx, cy, s, fill, inner) {
        emblemPath(g, suit, cx, cy, s);
        g.fillStyle = fill; g.fill();
        if (!inner) return;
        if (suit === 'green') {
            g.strokeStyle = inner; g.lineWidth = Math.max(0.8, s * .04);

    }

    function suitAssets(suit) {
        const S = SUITS[suit];
        paint('card-' + suit, 90, 124, '手牌牌面 ' + suit + '（90×124）', (g, w, h) => {
            rrect(g, 1, 1, w - 2, h - 2, 8);
            const bg = g.createRadialGradient(w / 2, h * .45, 4, w / 2, h * .45, h * .7);
            bg.addColorStop(0, S.mid); bg.addColorStop(1, S.dark);
            g.fillStyle = bg; g.fill();
            g.save(); g.clip();
            g.strokeStyle = 'rgba(255,255,255,0.035)'; g.lineWidth = 1;
            for (let x = -h; x < w; x += 5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + h, h); g.stroke(); }
            g.globalAlpha = 0.2; emblem(g, suit, w / 2, h / 2, 64, S.light); g.globalAlpha = 1;
            const hl = g.createLinearGradient(0, 0, 0, h * .35);

    Object.keys(SUITS).forEach(suitAssets);

    // ---------- 階段寶石 ----------
    paint('gem', 28, 28, '階段寶石（尚存）', (g) => {
        g.beginPath(); g.arc(14, 14, 12.5, 0, Math.PI * 2);

    paint('socket', 28, 28, '階段寶石（已擊破的空座）', (g) => {
        g.beginPath(); g.arc(14, 14, 12.5, 0, Math.PI * 2);

    // ---------- 勝利條件緞帶（左右 40px 切片，中段拉伸） ----------
    paint('ribbon', 300, 56, '勝利條件緞帶（左右 40px 切片）', (g, w) => {

            g.fillStyle = '#2a0e08'; g.fill();
            g.strokeStyle = 'rgba(216,180,106,0.45)'; g.lineWidth = 1; g.stroke();

        g.beginPath(); g.moveTo(20, 9.5); g.lineTo(w - 20, 9.5); g.moveTo(20, 39.5); g.lineTo(w - 20, 39.5); g.stroke();
        g.strokeStyle = 'rgba(0,0,0,0.6)';
        g.beginPath(); g.moveTo(20, 5.5); g.lineTo(w - 20, 5.5); g.moveTo(20, 43.5); g.lineTo(w - 20, 43.5); g.stroke();
    });

    // ---------- 標題分隔飾紋 ----------
    paint('divider', 200, 14, '標題分隔飾紋', (g, w, h) => {
        const cy = h / 2;
        const lg = g.createLinearGradient(0, 0, w, 0);
        lg.addColorStop(0, 'rgba(216,180,106,0)'); lg.addColorStop(0.5, 'rgba(243,220,160,0.9)'); lg.addColorStop(1, 'rgba(216,180,106,0)');
        g.strokeStyle = lg; g.lineWidth = 1;

        g.beginPath(); g.arc(w / 2 - 10, cy, 1.4, 0, Math.PI * 2); g.arc(w / 2 + 10, cy, 1.4, 0, Math.PI * 2); g.fill();

    // ---------- 敵方意圖浮水印（盾 + 交叉雙劍） ----------
    paint('crest', 120, 120, '敵方意圖浮水印', (g) => {
        g.strokeStyle = '#ffffff'; g.fillStyle = '#ffffff'; g.lineWidth = 4; g.lineCap = 'round';

    paint('medallion', 200, 200, '玩家生命紋章（環道留空給血量環）', (g) => {

        const d = g.createRadialGradient(c - 18, c - 22, 6, c, c, 75);
        d.addColorStop(0, '#1e2a1a'); d.addColorStop(0.7, '#0a100a'); d.addColorStop(1, '#040604');
        g.beginPath(); g.arc(c, c, 75, 0, Math.PI * 2); g.fillStyle = d; g.fill();

    // ---------- 選中技能的蠟封 ----------
    paint('seal', 44, 44, '已選中蠟封', (g) => {
        g.beginPath();
        for (let i = 0; i < 24; i++) {
            const r = i % 2 ? 19 : 21, a = i * Math.PI / 12;
            i ? g.lineTo(22 + Math.cos(a) * r, 22 + Math.sin(a) * r) : g.moveTo(22 + r, 22);
        }
        g.closePath();
        const r = g.createRadialGradient(17, 15, 2, 22, 22, 21);
        r.addColorStop(0, '#e05a44'); r.addColorStop(0.6, '#9a1c14'); r.addColorStop(1, '#4a0806');
        g.fillStyle = r; g.fill();
        g.beginPath(); g.arc(22, 22, 13, 0, Math.PI * 2); g.strokeStyle = 'rgba(40,0,0,0.6)'; g.lineWidth = 1.5; g.stroke();
        g.strokeStyle = '#ffe0c8'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
        g.beginPath(); g.moveTo(15, 22); g.lineTo(20, 27); g.lineTo(29, 16); g.stroke();
    });

    // ---------- 戰鬥場景光效層（光束、地面光暈、塵點） ----------
    function paintStage(cv) {
        const W = 1080, H = 720, cx = 480;
        cv.width = W; cv.height = H;
        const g = cv.getContext('2d');
        for (let i = 0; i < 5; i++) {
            const spread = (i - 2) * 60;
            const lg = g.createLinearGradient(0, 0, 0, 520);
            lg.addColorStop(0, 'rgba(255,220,150,0.10)'); lg.addColorStop(1, 'rgba(255,220,150,0)');
            g.fillStyle = lg;
            g.beginPath(); g.moveTo(cx + spread * 0.3 - 18, 0); g.lineTo(cx + spread * 0.3 + 18, 0);
            g.lineTo(cx + spread * 1.6 + 70, 520); g.lineTo(cx + spread * 1.6 - 70, 520); g.closePath(); g.fill();
        }
        g.save(); g.translate(cx, 440); g.scale(1, 0.28);
        const fg = g.createRadialGradient(0, 0, 10, 0, 0, 300);
        fg.addColorStop(0, 'rgba(255,200,120,0.28)'); fg.addColorStop(1, 'rgba(255,200,120,0)');
        g.fillStyle = fg; g.beginPath(); g.arc(0, 0, 300, 0, Math.PI * 2); g.fill();
        g.restore();
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (let i = 0; i < 70; i++) {
            const x = cx + (rnd() - 0.5) * 600, y = rnd() * 460, r = rnd() * 1.6 + 0.3;
            g.fillStyle = 'rgba(255,230,170,' + (0.15 + rnd() * 0.35) + ')';
            g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        }
        ASSETS['stage-fx'] = { canvas: cv, w: W, h: H, note: '戰鬥場景光效層（光束／地面光暈／塵點）' };
    }

    window.RF_ASSETS = ASSETS;

    // ================== DOM 裝飾（純視覺） ==================
    function decorateStage() {
        const stage = document.getElementById('game-stage');
        if (!stage || stage.querySelector('.rf-stage-fx')) return;
        const cv = document.createElement('canvas');
        cv.className = 'rf-stage-fx';
        paintStage(cv);
        stage.prepend(cv);
    }

    // 手牌扇形排列；沒牌可出時提示「結束回合」
    function decorateHand() {
        const cards = document.querySelectorAll('#hand-area .card');
        const n = cards.length;
        const step = n > 7 ? 3 : 4.5;
        const curve = n > 7 ? 1.4 : 2.4;
        cards.forEach((el, i) => {
            const off = i - (n - 1) / 2;
            const r = (off * step).toFixed(2) + 'deg', y = (off * off * curve).toFixed(1) + 'px';
            // 值不變就不寫，避免觸發觀察器無限循環
            if (el.style.getPropertyValue('--fan-r') !== r) el.style.setProperty('--fan-r', r);
            if (el.style.getPropertyValue('--fan-y') !== y) el.style.setProperty('--fan-y', y);
        });
        const endBtn = document.querySelector('.btn-end');
        const stage = document.getElementById('game-stage');
        if (endBtn && stage) {
            const playable = [...cards].some(c => !c.classList.contains('disabled'));
            const suggest = stage.style.display === 'block' && (n === 0 || !playable);
            endBtn.classList.toggle('rf-suggest', suggest);
        }
    }

    // 出牌紀錄：標出每張牌和前一張的接續方式（同色／同數字／觸發追加抽牌）
    function decorateTrack() {
        const minis = document.querySelectorAll('#played-cards-track .mini-card');
        const colorOf = el => ['red', 'blue', 'green', 'yellow'].find(c => el.classList.contains(c));
        minis.forEach((el, i) => {
            if (i === 0) { if (el.hasAttribute('data-link')) el.removeAttribute('data-link'); return; }
            const prev = minis[i - 1];
            const sameColor = colorOf(el) === colorOf(prev);
            const a = parseInt(el.textContent, 10), b = parseInt(prev.textContent, 10);
            let link = sameColor ? 'color' : 'num';
            if ((sameColor && Math.abs(a - b) === 1) || a === b) link = 'bonus';
            if (el.getAttribute('data-link') !== link) el.setAttribute('data-link', link);
        });
    }

    function decorateIntent() {
        const box = document.getElementById('intent-box');
        const val = document.getElementById('enemy-intent-val');
        if (!box || !val) return;
        const safe = val.textContent.trim() === '0' && !box.classList.contains('broken');
        if (box.classList.contains('rf-safe') !== safe) box.classList.toggle('rf-safe', safe);
    }

    function decoratePlayerHp() {
        const el = document.getElementById('player-hp-text');
        const wrap = document.querySelector('.area-right-bot');
        if (!el || !wrap) return;
        const hp = Math.max(0, Math.min(100, parseInt(el.textContent, 10) || 0));
        if (wrap.style.getPropertyValue('--rf-hp') !== String(hp)) wrap.style.setProperty('--rf-hp', hp);
        const low = hp <= 30;
        if (wrap.classList.contains('rf-low') !== low) wrap.classList.toggle('rf-low', low);
    }

    function decorateSelection() {
        const grid = document.getElementById('skill-grid');
        if (!grid) return;
        let db = [], icons = {};
        try { db = SKILLS_DB; icons = SKILL_ICONS; } catch (e) { /* 沒有也不影響 */ }
        grid.querySelectorAll('.sel-card').forEach(card => {
            if (card.querySelector('.rf-sel-portrait')) return;
            const id = parseInt(card.id.replace('sel-skill-', ''), 10);
            const s = db.find(x => x.id === id);
            if (!s || !icons[s.owner]) return;
            const img = document.createElement('img');
            img.className = 'rf-sel-portrait';
            img.alt = '';
            img.src = icons[s.owner];
            card.prepend(img);
        });
        const btn = document.getElementById('btn-start-game');
        if (!btn) return;
        let counter = document.querySelector('.rf-sel-count');
        if (!counter) {
            counter = document.createElement('div');
            counter.className = 'rf-sel-count';
            btn.parentNode.insertBefore(counter, btn);
        }
        const n = grid.querySelectorAll('.sel-card.selected').length;
        const text = '已选 ' + n + ' / 4';
        if (counter.textContent !== text) counter.textContent = text;
        if (counter.classList.contains('rf-full') !== (n >= 4)) counter.classList.toggle('rf-full', n >= 4);
    }

    function refresh() {
        decorateStage();
        decorateHand();
        decorateTrack();
        decorateIntent();
        decoratePlayerHp();
        decorateSelection();
    }

    let queued = false;
    const schedule = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; refresh(); });
    };
    new MutationObserver(schedule).observe(document.body, {
        childList: true, subtree: true, characterData: true,
        attributes: true, attributeFilter: ['class', 'style']
    });
    refresh();
})();
</script>
</body>
</html>
