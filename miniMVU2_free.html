    // 沒有自由戰鬥資料的角色（選擇畫面顯示「尚未開放」）：CHAR_TO_ENEMY_MAP 的其餘角色

    // ============================================================
    // 敵人資料：隨機化（enemy_2、enemy_8、enemy_9）
    // 亂數呼叫的順序與原版 loadBattleData 完全一致
    // ============================================================
    function shuffleWith(array, rng) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 就地修改 data.phases（data 是 ENEMIES_DB[enemyId] 的深拷貝）
    function randomizeEnemyData(enemyId, data, rng) {
        rng = rng || defaultRng;

        if (enemyId === "enemy_2") {
            // 只抽出顏色部分來打亂
            const colors = data.phases.map(p => p.params.color);
            const descs = {
                'red': '红色连击：连续出红牌造成 1 点伤害',
                'blue': '蓝色连击：连续出蓝牌造成 1 点伤害',
                'green': '绿色连击：连续出绿牌造成 1 点伤害',
                'yellow': '黄色连击：连续出黄牌造成 1 点伤害'
            };

            // 打亂顏色順序
            for (let i = colors.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [colors[i], colors[j]] = [colors[j], colors[i]];
            }

            // 顏色套回各階段，atk 保持原本遞增設定不動
            data.phases.forEach((p, i) => {
                p.params = { color: colors[i] };
                p.desc = descs[colors[i]];
            });
        }

        if (enemyId === "enemy_9") {
            const firstThree = [data.phases[0], data.phases[1], data.phases[2]];
            for (let i = firstThree.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [firstThree[i], firstThree[j]] = [firstThree[j], firstThree[i]];
            }
            data.phases[0] = firstThree[0];
            data.phases[1] = firstThree[1];
            data.phases[2] = firstThree[2];
        }

        if (enemyId === "enemy_8") {
            const modeGenerators = [
                // 1. 基礎計數 (參考 Enemy 1)
                () => ({
                    mode: "count",
                    hp: 15,
                    params: {},
                    desc: "计数：出一张牌造成 1 伤害"
                }),

                // 2. 顏色連擊 (參考 Enemy 2)
                () => {
                    const colors = ['red', 'blue', 'green', 'yellow'];
                    const cMap = { 'red': '红', 'blue': '蓝', 'green': '绿', 'yellow': '黄' };
                    const picked = colors[Math.floor(rng() * colors.length)];
                    return {
                        mode: "color_chain",
                        hp: 10,
                        params: { color: picked },
                        desc: `同色：连续出${cMap[picked]}牌造成伤害`
                    };
                },

                // 3. 顏色變換 (參考 Enemy 3)
                () => ({
                    mode: "color_switch",
                    hp: 7,
                    params: {},
                    desc: "变幻：切换颜色时造成伤害"
                }),

                // 4. 數值落差 (參考 Enemy 4)
                () => ({
                    mode: "diff",
                    hp: 40,
                    params: {},
                    desc: "落差：造成前后牌差值的伤害"
                }),

                // 5. 連擊節奏 (參考 Enemy 5)：攻擊頻率極低 (每 3~5 張牌才打一下)，HP 必須極低
                () => {
                    const mod = Math.floor(rng() * 3) + 3; // 隨機 3, 4, 5 連擊
                    const adjustedHp = Math.floor(60 / mod / 4);
                    return {
                        mode: "combo_mod",
                        hp: adjustedHp,
                        params: { mod: mod },
                        desc: `节奏：每 ${mod} 连击造成伤害`
                    };
                },

                // 6. 總和目標 (參考 Enemy 6)
                () => {
                    const targets = [15, 20, 25];
                    const t = targets[Math.floor(rng() * targets.length)];
                    return {
                        mode: "sum_target",
                        hp: 2,
                        params: { target: t },
                        desc: `总和：总和刚好 ${t} 造成伤害`
                    };
                },

                // 7. 數值重擊 (參考 Enemy 7)
                () => ({
                    mode: "value",
                    hp: 120,
                    params: {},
                    desc: "重击：牌面数值即为伤害"
                }),

                // 8. 比較大小 (參考 Enemy 9)
                () => {
                    const types = [
                        { m: "compare_asc", d: "升序：后牌 > 前牌", hp: 10 },
                        { m: "compare_desc", d: "降序：后牌 < 前牌", hp: 10 },
                        { m: "compare_eq", d: "同号：后牌 = 前牌", hp: 5 },
                        { m: "compare_all", d: "全序：集齐 升/降/同", hp: 1 }
                    ];
                    const t = types[Math.floor(rng() * types.length)];
                    return {
                        mode: t.m,
                        hp: t.hp,
                        params: {},
                        desc: `${t.d} 时伤害`
                    };
                }
            ];

            // 1. 洗牌
            shuffleWith(modeGenerators, rng);

            data.phases.forEach((p, index) => {
                const generator = modeGenerators[index % modeGenerators.length];
                const config = generator();

                const stageMultiplier = 1;

                p.mode = config.mode;
                p.params = config.params;
                p.hp = Math.floor(config.hp * stageMultiplier); // 這裡設定血量
                p.maxHp = p.hp; // 記得更新 maxHp
                p.desc = `[混沌${index + 1}] ${config.desc}`;
            });
        }
        return data;
    }

    // 模擬用：由 ENEMY_PHASES 複製一份並套上隨機化（HTML 版用 ENEMIES_DB 的拷貝，再呼叫 randomizeEnemyData）
    function makeEnemyData(enemyId, rng) {
        const base = ENEMY_PHASES[enemyId] || ENEMY_PHASES["enemy_1"];
        const data = JSON.parse(JSON.stringify(base));
        return randomizeEnemyData(ENEMY_PHASES[enemyId] ? enemyId : "enemy_1", data, rng);
    }

    // 自由戰鬥：由 FREE_DB 複製一份敵人資料（HTML 會再補上圖片、音樂）。opts 見檔頭
    function makeFreeEnemyData(key, opts) {
        const def = FREE_DB[key];
        if (!def) return null;
        opts = opts || {};
        const data = { name: def.name, phases: JSON.parse(JSON.stringify(def.phases)) };
        if (opts.hpScale) data.phases.forEach(p => { p.hp = Math.max(1, Math.round(p.hp * opts.hpScale)); });
        data.free = {
            key,
            fieldOn: opts.field !== false,
            skillOn: opts.skill !== false,
            mpCost: opts.mpCost || (def.enemySkill ? def.enemySkill.mpCost : 0)
        };
        return data;
    }

    // ============================================================
    // 遊戲實例
    // ============================================================
    function createGame(opts) {
        opts = opts || {};
        const rng = opts.rng || defaultRng;
        const noop = () => {};
        const log = opts.log || noop;
        const onVictory = opts.onVictory || noop;
        const onPhaseLoaded = opts.onPhaseLoaded || noop;

        const state = {
            deck: [], hand: [], discardPile: [], currentTurnCards: [],
            enemy: { phaseIndex: 0, hp: 0, maxHp: 0, atk: 0, mode: "count", params: {}, mp: 0 },
            battleState: { sumAccumulator: 0, colorChainCount: 0, compareFlags: { asc: false, desc: false, eq: false } },
            player: { hp: 100, maxHp: 100, equippedSkills: [], lives: 3 },
            turnStats: { cardsPlayed: 0, damageDealt: 0, combo: 0 },
            isFirstMoveOfTurn: false,
            buffs: { extraDrawTurns: 0, keepHandTurns: 0 },
            isPhaseBrokenThisTurn: false,
            targetingMode: null,
            pendingColorSrc: null,
            enemyData: null,        // 目前這場的敵人資料（phases 等），由 startBattle 設定
            free: null,             // 自由戰鬥：{ key, def, fieldOn, skillOn, mpCost }；劇情模式是 null
            fx: freshFx(),          // 自由戰鬥的效果狀態（劇情模式永遠是初始值）
            turn: 0                 // 目前是第幾個玩家回合（自由戰鬥的結算畫面用）
        };

        const g = { state, rng, log };

        // 預設鉤子：劇情模式（state.free 是 null）什麼都不做；自由戰鬥時轉給 FREE_DB 的領域與敵人技能
        function freeHook(name, a, b, c) {
            const f = state.free;
            if (!f) return undefined;
            let r;
            const lists = [];
            if (f.fieldOn && f.def.field) lists.push(f.def.field.hooks);
            if (f.skillOn && f.def.enemySkill) lists.push(f.def.enemySkill.hooks);
            for (const h of lists) {
                if (h && h[name]) { const v = h[name](g, a, b, c); if (v !== undefined) r = v; }
            }
            return r;
        }
        // 敵人技能：敵人階段 MP 足夠就發動（被擊暈那回合不發動）。回傳 { name, desc } 或 null
        function maybeFireEnemySkill(info) {
            const f = state.free;
            if (!f || !f.skillOn || !f.def.enemySkill || info.stunned) return null;
            if (state.enemy.mp < f.mpCost) return null;
            state.enemy.mp -= f.mpCost;
            const note = f.def.enemySkill.effect(g, info);   // effect 可以回傳一行結果文字（枯萎：清掉了幾張），畫面接在技能說明後面
            return { name: f.def.enemySkill.name, desc: f.def.enemySkill.desc, note };
        }

        g.hooks = Object.assign({
            turnStartAfterDiscard(g) { freeHook('turnStartAfterDiscard'); },
            turnStartBeforeDraw(g, ctx) { freeHook('turnStartBeforeDraw', ctx); },
            turnStartAfterDraw(g) { freeHook('turnStartAfterDraw'); },
            canPlay(g, card, base, top) { return freeHook('canPlay', card, base, top); },
            noBonus(g, card, top) { return freeHook('noBonus', card, top); },   // 回傳 true＝這張牌沒有追加抽牌（花圃的开花牌）
            beforeDamage(g, card) { freeHook('beforeDamage', card); },   // 傷害計算之前（還沒改 compareFlags、還沒換階段）：璐法在這裡記下這張牌符不符合條件
            afterPlay(g, info) { freeHook('afterPlay', info); },
            turnEnd(g, info) { freeHook('turnEnd', info); },
            enemyPhase(g, info) {
                freeHook('enemyPhase', info);
                const sk = maybeFireEnemySkill(info);
                if (sk) info.skill = sk;
            }
        }, opts.hooks || {});

        // ---------- 牌庫 ----------
        function shuffle(array) { shuffleWith(array, rng); }

        function buildDeck() {
            const d = [];
            COLORS.forEach(color => {
                NUMBERS.forEach(num => {
                    d.push({ color: color, number: num, isToken: false });
                });
            });
            return d;
        }

        function drawCardFromDeck() {
            if (state.deck.length === 0) {
                const validDiscard = state.discardPile.filter(c => !c.isToken);
                if (validDiscard.length <= 0) return null;

                state.deck = [...validDiscard];
                state.discardPile = [];
                if (state.free) state.deck.forEach(c => { delete c.bloom; });   // 花圃：洗回牌庫的牌一定沒有开花標記
                shuffle(state.deck);
            }
            const c = state.deck.pop();
            if (c && c.hidden) delete c.hidden;
            if (c && state.free) c.mana = 0;   // 魔力：從牌庫抽出的牌沒有魔力（劇情模式不加這個欄位）
            return c;
        }

        // ---------- 敵人階段 ----------
        function loadEnemyPhase(index) {
            const phases = state.enemyData.phases;
            if (index >= phases.length) return false;

            const pData = phases[index];
            const enemy = state.enemy;
            enemy.phaseIndex = index;
            enemy.hp = pData.hp;
            enemy.maxHp = pData.hp;
            enemy.atk = pData.atk;
            enemy.mode = pData.mode;
            enemy.params = pData.params || {};

            state.battleState.sumAccumulator = 0;
            state.battleState.colorChainCount = 0;
            state.battleState.compareFlags = { asc: false, desc: false, eq: false };

            if (Object.prototype.hasOwnProperty.call(MODE_INIT, enemy.mode)) MODE_INIT[enemy.mode](g);

            onPhaseLoaded(index, pData);
            return true;
        }

        // 開戰：載入第 1 階段、重設牌庫與狀態、洗牌、第一回合（對應原版 initGame 的規則部分）
        function startBattle(enemyData) {
            state.enemyData = enemyData;
            state.enemy.mp = 0;
            state.fx = freshFx();
            state.turn = 0;
            const fd = enemyData.free;
            state.free = fd ? { key: fd.key, def: FREE_DB[fd.key], fieldOn: fd.fieldOn !== false, skillOn: fd.skillOn !== false, mpCost: fd.mpCost } : null;
            loadEnemyPhase(0);

            state.deck = []; state.discardPile = []; state.hand = []; state.currentTurnCards = [];
            state.player.hp = 100;
            state.player.equippedSkills.forEach(s => s.charges = s.max);
            state.buffs = { extraDrawTurns: 0, keepHandTurns: 0, futureSightTurns: 0 };

            state.battleState = { sumAccumulator: 0, colorChainCount: 0, compareFlags: { asc: false, desc: false, eq: false } };

            state.deck = buildDeck();
            shuffle(state.deck);
            startNewTurn();
        }

        // 裝備技能：protos 是 { id, max, ... } 陣列（原版 finalizeSelection 的做法）
        function equipSkills(protos) {
            state.player.equippedSkills = protos.map(p => ({ ...p, charges: p.max }));
        }

        // ---------- 回合 ----------
        function cancelTargeting() {
            if (!state.targetingMode) return false;
            state.targetingMode = null;
            state.pendingColorSrc = null;
            log("操作已取消");
            return true;
        }

        function startNewTurn() {
            const ts = state.turnStats;
            ts.cardsPlayed = 0; ts.damageDealt = 0; ts.combo = 0;
            state.currentTurnCards = []; state.isFirstMoveOfTurn = true;
            state.turn++;
            // 自由戰鬥：秩序崩坏只到回合結束；決斗宣言從下個玩家回合開始計
            state.fx.orderBreak = 0;
            state.fx.duel = state.fx.duelPending; state.fx.duelPending = null;
            state.fx.bloodPaid = 0; state.fx.bloodCards = []; state.fx.drainHeal = 0;   // 血月：費用每回合從頭算

            cancelTargeting();

            state.battleState.colorChainCount = 0;
            state.battleState.sumAccumulator = 0;
            state.battleState.compareFlags = { asc: false, desc: false, eq: false };

            state.isPhaseBrokenThisTurn = false;

            const buffs = state.buffs;
            if (buffs.futureSightTurns > 0) {
                buffs.futureSightTurns--;
                if (buffs.futureSightTurns === 0) {
                    log("未来视界效果结束");
                }
            }

            if (buffs.keepHandTurns > 0) {
                log(`Buff: 保留手牌 (${buffs.keepHandTurns})`);
                buffs.keepHandTurns--;
            } else {
                if (state.hand.length > 0) {
                    state.hand.forEach(c => { if (!c.isToken) state.discardPile.push(c); });
                    state.hand = [];
                }
            }

            g.hooks.turnStartAfterDiscard(g);

            const ctx = { drawCount: 5 };
            if (buffs.extraDrawTurns > 0) {
                ctx.drawCount += 2;
                log(`Buff: 多抽2张 (${buffs.extraDrawTurns})`);
                buffs.extraDrawTurns--;
            }

            g.hooks.turnStartBeforeDraw(g, ctx);

            for (let i = 0; i < ctx.drawCount; i++) {
                const c = drawCardFromDeck();
                if (c) state.hand.push(c);
            }

            g.hooks.turnStartAfterDraw(g);
        }

        // 目前接牌的對象：本回合最後出的牌；本回合還沒出牌就是棄牌堆頂
        function getEffectiveTop() {
            if (state.currentTurnCards.length > 0) return state.currentTurnCards[state.currentTurnCards.length - 1];
            return state.discardPile[state.discardPile.length - 1];
        }

        function checkValid(card, top) {
            let valid = false;
            if (state.isFirstMoveOfTurn) valid = true;
            else if (top) valid = cardsMatch(card, top);
            if (state.fx.orderBreak > 0) valid = true;   // 秩序崩坏：無視出牌合法判斷
            const ov = g.hooks.canPlay(g, card, valid, top);
            return typeof ov === 'boolean' ? ov : valid;
        }

        // 這張手牌現在能不能出（畫面用來標示 disabled）
        function isPlayable(card) {
            return checkValid(card, getEffectiveTop());
        }

        // ---------- 出牌與傷害 ----------
        // 回傳 { played, card, bonusDraw, damage }；played=false 表示不能出（畫面要抖動）
        // 自由戰鬥另有 auto（提线自動打出的那張：{ card, damage, events }）、events（畫面提示用的文字陣列）；劇情模式這兩個都是 undefined
        function playCard(index) { return doPlay(index, false); }
        // 強制出牌（提线連動用）：不檢查能不能接、不給追加抽牌、不消耗秩序崩坏；其餘（出牌數、連擊、傷害、MP、鉤子）照算
        function playForced(index) { return doPlay(index, true); }

        function doPlay(index, forced) {
            const card = state.hand[index];
            if (!card) return { played: false };

            const top = getEffectiveTop();
            if (!forced && !checkValid(card, top)) return { played: false, card };

            const revealed = !!card.hidden;
            if (revealed) delete card.hidden;
            const ignored = forced || state.fx.orderBreak > 0;   // 這張牌是秩序崩坏的免判斷牌（或提线自動打出的牌）：不給追加抽牌
            if (!forced && state.fx.orderBreak > 0) state.fx.orderBreak--;

            state.hand.splice(index, 1);
            if (!card.isToken) state.discardPile.push(card);
            state.currentTurnCards.push(card);
            state.turnStats.cardsPlayed++;
            state.turnStats.combo++;
            state.enemy.mp++;

            let bonusDraw = false;
            if (!state.isFirstMoveOfTurn && top && !ignored) {
                if (isBonusPlay(card, top) && !g.hooks.noBonus(g, card, top)) bonusDraw = true;
            }

            state.isFirstMoveOfTurn = false;
            if (bonusDraw) {
                const newCard = drawCardFromDeck();
                if (newCard) state.hand.push(newCard);
                log("BONUS DRAW!");
            }

            const phase0 = state.enemy.phaseIndex;
            if (state.free) g.hooks.beforeDamage(g, card);
            const damage = processDamageAction();
            const info = { card, bonusDraw, damage, phaseChanged: state.enemy.phaseIndex !== phase0 };
            g.hooks.afterPlay(g, info);
            return { played: true, card, bonusDraw, damage, revealed, ignored, auto: info.auto, events: info.events };
        }

        // ---------- 血月（琳的領域）：付生命打出接不上的牌 ----------
        function bloodCfg() {
            const f = state.free;
            return (f && f.fieldOn && f.def.field && f.def.field.blood) || null;
        }
        // 下一次付費的生命（本回合已付 bloodPaid 次）；沒有血月是 0
        function bloodCost() {
            const b = bloodCfg();
            if (!b) return 0;
            return b.costs[Math.min(state.fx.bloodPaid, b.costs.length - 1)];
        }
        // 畫面用：這張牌如果接不上，付費的狀況。{ cost, playable, canPay }；沒有血月或沒有這張牌回傳 null
        function bloodInfo(card) {
            if (!bloodCfg() || !card) return null;
            const cost = bloodCost();
            return { cost, playable: isPlayable(card), canPay: state.player.hp > cost };
        }
        // 付費打出手牌 index（只有接不上的牌）：扣生命、費用次數 +1，再用強制模式打出（不給追加抽牌，其餘照算）。
        // 回傳 { played:false, reason } 或 doPlay 的結果加上 blood（這次付的生命）
        function bloodPlay(index) {
            if (!bloodCfg()) return { played: false, reason: 'nofield' };
            const card = state.hand[index];
            if (!card) return { played: false, reason: 'none' };
            if (state.targetingMode) return { played: false, card, reason: 'targeting' };
            if (isPlayable(card)) return { played: false, card, reason: 'playable' };
            const cost = bloodCost();
            if (state.player.hp <= cost) return { played: false, card, reason: 'hp', cost };
            state.player.hp -= cost;
            state.fx.bloodPaid++;
            state.fx.bloodCards.push(card);
            log(`血月：支付 ${cost} 点生命，打出 ${COLOR_ZH[card.color]}${card.number}`);
            const r = doPlay(index, true);
            r.blood = cost;
            return r;
        }
        function cardBlood(c) { return !!state.free && state.fx.bloodCards.includes(c); }

        function calculateInstantDamage() {
            const mode = state.enemy.mode || "count";
            const cards = state.currentTurnCards;
            const lastCard = cards[cards.length - 1];
            if (!lastCard) return 0;
            if (!Object.prototype.hasOwnProperty.call(DAMAGE_MODES, mode)) return 0;
            return DAMAGE_MODES[mode](g, lastCard);
        }

        function processDamageAction() {
            const enemy = state.enemy;
            const damage = calculateInstantDamage();
            if (damage > 0) {
                enemy.hp = Math.max(0, enemy.hp - damage);
                log(`- ${damage} `);
            }

            if (enemy.hp <= 0) {
                const hasNextPhase = loadEnemyPhase(enemy.phaseIndex + 1);
                if (hasNextPhase) {
                    state.isPhaseBrokenThisTurn = true;
                    log("BREAK!!");
                } else {
                    onVictory();
                }
            }
            return damage;
        }

        // ---------- 技能 ----------
        // 回傳 { cancelled: true } 表示這一下取消了選牌步驟（畫面要收起選色器）
        function useSkill(index) {
            const tm = state.targetingMode;
            if (tm) {
                if (tm.type === 'MIMIC_SELECT') {
                    if (index === tm.skillIndex) {
                        cancelTargeting();
                        return { cancelled: true };
                    }
                    resolveMimicSelection(index);
                    return;
                }

                cancelTargeting();
                return { cancelled: true };
            }

            const skill = state.player.equippedSkills[index];
            if (skill.charges <= 0) { log("次数已用尽！"); return; }

            if (skill.id === 2) {
                if (state.player.equippedSkills.length <= 1) { log("无其它支援可选择"); return; }
                log("请点击另一个支援...");
                state.targetingMode = { type: 'MIMIC_SELECT', skillIndex: index };
                return;
            }
            executeSkillLogic(skill.id, index);
        }

        function resolveMimicSelection(targetIndex) {
            const sourceIndex = state.targetingMode.skillIndex;
            const targetSkill = state.player.equippedSkills[targetIndex];
            if (targetSkill.id === 2) { log("无法选择自身"); return; }
            log(`发动了 ${targetSkill.name}`);
            state.targetingMode = null;
            executeSkillLogic(targetSkill.id, sourceIndex);
        }

        function executeSkillLogic(skillId, costIndex) {
            const costSkill = state.player.equippedSkills[costIndex];
            switch (skillId) {
                case 1: {
                    costSkill.charges--;
                    const count = state.hand.length === 0 ? 4 : 2;
                    for (let i = 0; i < count; i++) { const c = drawCardFromDeck(); if (c) state.hand.push(c); }
                    log(`抽牌 +${count}`);
                    break;
                }
                case 3:
                    log("选择丢弃手牌...");
                    state.targetingMode = { type: 'DISCARD_HEAL', skillIndex: costIndex };
                    break;
                case 4:
                    log("选择切割手牌...");
                    state.targetingMode = { type: 'SPLIT', skillIndex: costIndex };
                    break;
                case 5: // 芙蕾嘉：未來視界
                    costSkill.charges--;
                    state.buffs.futureSightTurns = 3; // 設定 Buff 持續 3 回合 (本回合開始算)
                    log("开启未来视界 (3回合)");
                    break;
                case 6:
                    log("选择来源颜色...");
                    state.targetingMode = { type: 'COLOR_SRC', skillIndex: costIndex };
                    break;
                case 7:
                    costSkill.charges--;
                    state.buffs.extraDrawTurns += 3;
                    log("Buff: 回合抽牌增加");
                    break;
                case 8:
                    costSkill.charges--;
                    state.buffs.keepHandTurns += 3;
                    log("Buff: 手牌保留");
                    break;
                case 9: // 奈芙蒂：秩序崩坏（只在自由戰鬥提供）
                    costSkill.charges--;
                    state.fx.orderBreak = ORDER_BREAK_CARDS;
                    log(`秩序崩坏：接下来 ${ORDER_BREAK_CARDS} 张牌无视连击条件`);
                    break;
            }
        }

        // ---------- 點手牌（技能選牌步驟，或一般出牌）----------
        // 沒有選牌步驟時就是出牌（回傳 playCard 的結果）；否則回傳 { cancelled: true }（取消了）
        // 或 { colorSrcPicked: true }（選好千變萬化的來源顏色，畫面要顯示選色器）
        function clickCard(index) {
            const tm = state.targetingMode;
            if (!tm) return playCard(index);

            if (tm.type === 'MIMIC_SELECT') {
                cancelTargeting();
                return { cancelled: true };
            }

            const card = state.hand[index];
            const skillIdx = tm.skillIndex;
            const skills = state.player.equippedSkills;

            if (tm.type === 'DISCARD_HEAL') {
                state.hand.splice(index, 1);
                if (!card.isToken) state.discardPile.push(card);
                state.player.hp = Math.min(state.player.maxHp, state.player.hp + 20);
                skills[skillIdx].charges--;
                log("生命 +20");
                state.targetingMode = null;
            }
            else if (tm.type === 'SPLIT') {
                if (card.number <= 1) { log("數字太小無法切割"); return; }
                state.hand.splice(index, 1);
                if (!card.isToken) state.discardPile.push(card);
                const v1 = Math.floor(rng() * (card.number - 1)) + 1;
                const v2 = card.number - v1;
                const t1 = { color: card.color, number: v1, isToken: true, id: rng() };
                const t2 = { color: card.color, number: v2, isToken: true, id: rng() };
                if (state.free) { const m = card.mana || 0; t1.mana = Math.ceil(m / 2); t2.mana = Math.floor(m / 2); }   // 魔力盡量平分，多的給第一張
                state.hand.push(t1, t2);
                skills[skillIdx].charges--;
                log(`切割為 ${v1} & ${v2}`);
                state.targetingMode = null;
            }
            else if (tm.type === 'COLOR_SRC') {
                if (card.hidden) delete card.hidden;   // 選了狐火牌當來源：顏色就現形了
                state.pendingColorSrc = card.color;
                return { colorSrcPicked: true };
            }
        }

        // 千變萬化第二步：選好目標顏色
        function resolveColorPick(targetColor) {
            if (!state.targetingMode) return false;
            const skillIdx = state.targetingMode.skillIndex;
            const srcColor = state.pendingColorSrc;
            let count = 0;
            for (let i = 0; i < state.hand.length; i++) {
                if (state.hand[i].color === srcColor) {
                    const old = state.hand[i];
                    state.hand[i] = { color: targetColor, number: old.number, isToken: true, id: rng() };
                    if (state.free) { state.hand[i].mana = old.mana || 0; if (old.sealed) state.hand[i].sealed = true; if (old.bloom) state.hand[i].bloom = true; }   // 千變萬化不改魔力，也不解除禁书的封印、不拿掉开花
                    if (!old.isToken) state.discardPile.push(old);
                    count++;
                }
            }
            state.player.equippedSkills[skillIdx].charges--;
            log(`轉化了 ${count} 張牌`);
            state.targetingMode = null; state.pendingColorSrc = null;
            return true;
        }

        // ---------- 結束回合 ----------
        // 敵人這回合的攻擊預覽（畫面的「伤害预兆」用，不呼叫鉤子）
        function previewIncoming() {
            const stunned = state.isPhaseBrokenThisTurn;
            const atk = stunned ? 0 : state.enemy.atk + (state.free ? state.fx.atkBonus : 0);
            const played = state.turnStats.cardsPlayed;
            const defense = played * defensePerCard();
            let incoming = Math.max(0, atk - defense);
            // 决斗宣言：出牌不到 need 張，回合結束額外受到 dmg（不受減傷影響；敵人被擊暈那回合不生效）
            const duel = state.free ? state.fx.duel : null;
            if (duel && !stunned && played < duel.need) incoming += duel.dmg;
            return { stunned, atk, defense, incoming };
        }

        // 每張牌的連擊減傷（重甲方阵會加倍）
        function defensePerCard() {
            const f = state.free;
            if (f && f.fieldOn && f.def.field && f.def.field.defensePerCard) return f.def.field.defensePerCard(DEFENSE_PER_CARD);
            return DEFENSE_PER_CARD;
        }

        // ---------- 自由戰鬥的畫面資料 ----------
        // 目前階段的條件文字（指定數字會換成目前的數字）
        function conditionText() {
            const p = state.enemyData.phases[state.enemy.phaseIndex];
            let d = (p && p.desc) || "擊敗敵人";
            if (state.free) d = d.replace('{target}', state.fx.exactTarget);
            return d;
        }
        // 「下一層」提示（領域有 nextFloor 才有；最後一層回傳 null）
        function nextFloorText() {
            const f = state.free;
            if (!f || !f.fieldOn || !f.def.field || !f.def.field.nextFloor) return null;
            const nx = state.enemyData.phases[state.enemy.phaseIndex + 1];
            return nx ? (nx.next || nx.desc) : null;
        }
        // 增益／減益膠囊資料：{ kind: 'buff'|'debuff', icon, name, short, n, label }
        function freeChips() {
            const out = [];
            if (state.fx.orderBreak > 0) out.push({ kind: 'buff', icon: '✧', name: '秩序<br>崩坏', short: '秩序', n: state.fx.orderBreak, label: 'CARDS' });
            const f = state.free;
            if (f && f.skillOn && f.def.enemySkill && f.def.enemySkill.chips) out.push(...f.def.enemySkill.chips(g));
            return out;
        }
        // 敵人技能資料（MP 條用）：{ name, desc, mp, cost, ready }；沒有敵人技能回傳 null
        function mpInfo() {
            const f = state.free;
            if (!f || !f.skillOn || !f.def.enemySkill) return null;
            return { name: f.def.enemySkill.name, desc: f.def.enemySkill.desc, mp: state.enemy.mp, cost: f.mpCost, ready: state.enemy.mp >= f.mpCost };
        }
        // 決斗宣言的需求（預兆框的小字）：{ played, need, dmg } 或 null
        function duelInfo() {
            const d = state.free ? state.fx.duel : null;
            return d ? { played: state.turnStats.cardsPlayed, need: d.need, dmg: d.dmg } : null;
        }

        // 提线：這張手牌現在是不是被連著（兩張都還在手牌才算）；本回合被提线自動打出的牌（出牌紀錄標記用）
        function cardLinked(c) {
            const t = state.free ? state.fx.tether : null;
            return !!(t && (c === t.a || c === t.b) && state.hand.includes(t.a) && state.hand.includes(t.b));
        }
        function cardAuto(c) { return !!state.free && state.fx.autoPlayed.includes(c); }

        // 牌桌上的魔力槽（領域有 gauge 才有）：{ label, value, max } 或 null
        function gaugeInfo() {
            const f = state.free;
            if (!f || !f.fieldOn || !f.def.field || !f.def.field.gauge) return null;
            return f.def.field.gauge(g);
        }
        // 「?」說明視窗的資料：領域名稱與條列規則、目前階段條件、敵人技能（每個都列）；沒有領域回傳 null
        function helpInfo() {
            const f = state.free;
            if (!f || !f.fieldOn || !f.def.field) return null;
            const sk = f.skillOn && f.def.enemySkill ? f.def.enemySkill : null;
            return {
                field: f.def.field.name,
                rules: (f.def.field.help || [f.def.field.desc]).slice(),
                condition: conditionText(),
                dense: !!f.def.field.denseHelp,
                skills: sk ? [{ name: sk.name, desc: sk.desc, cost: f.mpCost }] : []
            };
        }

        // 回合結束：先取消選牌步驟（回傳 cancelled）；否則依序呼叫 turnEnd、算傷害、enemyPhase
        function beginEndTurn() {
            if (state.targetingMode) {
                cancelTargeting();
                return { cancelled: true };
            }
            const info = { cancelled: false };
            g.hooks.turnEnd(g, info);
            Object.assign(info, previewIncoming());
            g.hooks.enemyPhase(g, info);
            return info;
        }

        // 敵人攻擊落下；回傳玩家是否倒下
        function applyEnemyAttack(incoming) {
            if (incoming > 0) {
                state.player.hp = Math.max(0, state.player.hp - incoming);
            }
            // 吸血（琳）：攻擊造成的實際傷害一半回復敵人目前階段的生命（不超過上限）
            const heal = state.free ? state.fx.drainHeal : 0;
            if (heal > 0) {
                state.fx.drainHeal = 0;
                const e = state.enemy;
                const before = e.hp;
                e.hp = Math.min(e.maxHp, e.hp + heal);
                if (e.hp > before) log(`吸血：敌人回复 ${e.hp - before} 点生命`);
            }
            return state.player.hp <= 0;
        }

        // 一次做完（模擬、測試用）：回傳 { cancelled } 或 { dead, ...info }
        function endTurn() {
            const info = beginEndTurn();
            if (info.cancelled) return info;
            info.dead = applyEnemyAttack(info.incoming);
            if (!info.dead) startNewTurn();
            return info;
        }

    // ============================================================
    const IMG_GITHUB_BASE = 'https://cdn.jsdelivr.net/gh/asal0120/st-rpg-chain@main/images/';

    };

    const _imgWin = (() => {
        try {
            let w = window;
            while (w.parent && w.parent !== w) {
                w = w.parent;
                try { if (w.RPG_GLOBAL_STATE) return w; } catch (e) { /* 跨網域的視窗讀不到，往上找 */ }
            }
        } catch (e) { /* 往上找失敗 */ }
        try { if (window.top) return window.top; } catch (e) { /* 讀不到最上層 */ }
        return window;
    })();
    function _imgHost() {
        let host = null;
        try { host = _imgWin.RPG_GLOBAL_STATE?.imageHost; } catch (e) { /* 讀不到時用瀏覽器的記錄 */ }
        if (!IMG_HOST_ORDER[host]) {
            try { host = _imgWin.localStorage.getItem('rpgImageHost'); } catch (e) { host = null; }
        }
        return IMG_HOST_ORDER[host] ? host : 'github';
    }
    let _imgFailed;
    try {
        if (!_imgWin.__IMG_FAILED) _imgWin.__IMG_FAILED = new _imgWin.Set();
        _imgFailed = _imgWin.__IMG_FAILED;
    } catch (e) { _imgFailed = new Set(); }
    const _imgAlts = new Map();   // 網址 → 同一張圖依序嘗試的網址

    const img = (imgchestUrl, catboxUrl, githubPath) => {
        const urls = { imgchest: imgchestUrl, catbox: catboxUrl, github: githubPath ? IMG_GITHUB_BASE + githubPath : '' };
        const list = IMG_HOST_ORDER[_imgHost()].map(h => urls[h]).filter(Boolean)
            .sort((a, b) => _imgFailed.has(a) - _imgFailed.has(b));   // 失敗過的排到最後（穩定排序）
        list.forEach(u => { if (!_imgAlts.has(u)) _imgAlts.set(u, list); });
        return list[0];
    };

    // 記下 url 載入失敗，回傳同一張圖的下一個網址（沒有備援或都失敗過時回傳 null）
    function nextImgUrl(url) {
        const list = _imgAlts.get(url);
        if (!list) return null;
        _imgFailed.add(url);
        return list.slice(list.indexOf(url) + 1).find(u => !_imgFailed.has(u)) || null;
    }

    function setBodyBg(url) {
        document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('${url}')`;
        if (!_imgAlts.has(url)) return;
        const probe = new Image();
        probe.onerror = () => {
            const next = nextImgUrl(url);
            if (next && document.body.style.backgroundImage.includes(url)) setBodyBg(next);
        };
        probe.src = url;
    }

    // <img> 載入失敗時換下一個圖床（error 事件不會冒泡，所以在捕獲階段監聽整份文件）
    document.addEventListener('error', (e) => {
        const el = e.target;
        if (el?.tagName !== 'IMG') return;
        const next = nextImgUrl(el.getAttribute('src'));
        if (next) el.src = next;
    }, { capture: true });

    if (turn.stunned) {
        overlaySub.innerText = '— STUNNED —';
        overlayText.style.color = '#51cf66';
        overlayText.innerText = 'BREAK!';
    } else if (incoming > 0) {
        overlaySub.innerText = `受到 ${incoming} 点伤害` + (FREE_MODE ? freeDrainNote(turn) : '');
    } else {
        overlaySub.innerText = '— GUARD —';
        overlayText.style.color = '#4dabf7';

    await sleep(700);

	overlay.style.animation = 'fadeOut 0.3s ease-out forwards';
	await sleep(300);
	overlay.classList.remove('visible');
	overlay.style.animation = '';

    // 實際結算傷害
    if (incoming > 0) {
        G.applyEnemyAttack(incoming);
        updateUI();
    }

    if (player.hp <= 0) {
        overlay.classList.remove('visible');
        document.getElementById('game-stage').style.pointerEvents = '';
        showDefeatModal();
        return;
    }

    // === 第二幕：Your Turn ===
	await sleep(300);
    overlayText.style.color = '#c5a059';
    overlayText.innerText = 'YOUR TURN';
    overlaySub.innerText = 'FORWARD!';
	overlay.classList.add('visible');
    await sleep(600);

    overlay.style.animation = 'fadeOut 0.3s ease-out forwards';
    await sleep(300);
    overlay.classList.remove('visible');
    overlay.style.animation = '';

    document.getElementById('game-stage').style.pointerEvents = '';

    startNewTurn();

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function handleVictory() {
    if (FREE_MODE) return freeVictory();
    showLog("勝利！");
    try {
        if (currentTargetName && currentTargetName !== '非攻略中') {
            // 直接更新變量
            await setST(`世界.妈妈.${currentTargetName}.状态`, '3');
            await setST(`世界.妈妈.${currentTargetName}.在队状态`, '是');
            await setST('世界.迷宫攻略.当前攻略对象', '非攻略中');

            // 發訊息通知 AI
            const success = sendMsgViaDOM(`战斗结束！成功攻略${currentTargetName}！`);
            if (!success) {
                showLog("訊息發送失敗，請手動發送");
            }
        }
        setTimeout(() => {
            window.parent?.RPGBridge?.closeGame?.();
        }, 1000);
    } catch (err) {          
        console.error("结算失败:", err);
        showLog("结算发生错误: " + (err?.message || String(err)));
    }
}

	function sendMsgViaDOM(message) {
        try {
            // 1. 尝试获取顶层窗口 (SillyTavern 主窗口)
            // 使用 window.top 比 window.parent 更安全，防止多层嵌套
            const targetWin = window.top; 
            const targetDoc = targetWin.document;

            // 2. 查找关键元素
            const textarea = targetDoc.getElementById('send_textarea');
            const sendButton = targetDoc.getElementById('send_but');

            if (!textarea || !sendButton) {
                // 如果找不到，很可能是因为开启了"沉浸模式"(Immersive Mode)导致UI被隐藏
                showLog("错误: 找不到发送按钮 (请关闭沉浸模式)");
                console.error("DOM Elements missing. Textarea:", textarea, "Btn:", sendButton);
                return false;
            }

            // 3. 填入消息 (优先使用 jQuery 触发，确保 ST 识别到变动)
            if (targetWin.jQuery) {
                const $ = targetWin.jQuery;
                $(textarea).val(message).trigger('input').trigger('change'); // 同时触发 input 和 change
            } else {
                // 降级方案：原生 JS
                textarea.value = message;
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
                textarea.dispatchEvent(new Event('change', { bubbles: true }));
            }

            // 4. 模拟点击 (优先使用 jQuery 点击)
            if (targetWin.jQuery) {
                const $ = targetWin.jQuery;
                $(sendButton).click();
            } else {
                sendButton.click();
            }
            
            showLog("指令已发送至 ST");
            return true;

        } catch (e) {
            // 将错误打印到游戏屏幕上，方便调试
            showLog("发送失败: " + e.message);
            console.error("DOM Send Error:", e);
            return false;
        }
    }

// 自由戰鬥（試玩）：宿主注入 window.INJECTED_BATTLE_MODE = 'free' 才啟用；沒有注入時以下函式都不會被呼叫，劇情模式與原版相同。
// 規則（領域、敵人技能、狐火牌、秩序崩坏…）都在 rules-core.js 的 FREE_DB／FREE_SKILLS；這裡只有畫面與流程。
// 宿主旗標：INJECTED_BATTLE_MODE = 'free'（啟用）；INJECTED_FREE_ENEMY（指定對手，必須有 FREE_DB 資料；對手固定，每一次開戰含「再戰」都用同一位，
//   沒有指定或無效時只顯示「没有指定对手」和「关闭」，沒有選對手畫面，結算畫面也沒有「換對手」）；
//   INJECTED_FREE_SPAR（主檔的切磋會傳；仍可接受，但行為和沒傳一樣：自由戰鬥一律是固定對手）；
//   INJECTED_FREE_SEND = true | false（可否發送結果；只有 false 才隱藏發送鈕，沒注入視為可發送）。
// 自由戰鬥不寫任何變數（沒有 setST／execST 的呼叫路徑）。跳過鈕（.ingame-skip-btn）保留，但點擊走自由戰鬥自己的 freeSkip：

// 唯一會發訊息的地方：結算畫面的發送鈕（玩家自己按；用既有的 sendMsgViaDOM，訊息文字見下面的 freeReportMessage，不含 <state> 區塊）：
// 勝利（含跳過）顯示「发送战报」、失敗顯示「发送战败结果」，FREE_CAN_SEND 為 false 時兩者都不顯示。不會自動發訊息；按「关闭」「再战」都不發訊息。
// 此檔由 tools/patches/mini_free_core_20261019.py 放進兩個 _free.html 的遊戲 <script> 結尾。
// ============================================================
const FREE_MODE = window.INJECTED_BATTLE_MODE === 'free';
const FREE_CAN_SEND = window.INJECTED_FREE_SEND !== false;      // 可否發送結果（玩家在家園時 true）

// ---------- 戰報訊息（要改內容只改這個函式；不要放 <state> 區塊或任何變數指令） ----------
// opp：對手名（例如「莉迪娅」）；win：玩家的立場（勝利含跳過 → true）；turns：回合數；hp：剩餘生命；skipped：是否跳過
// 開頭的【切磋】是世界書綠燈的關鍵詞，格式不可改。「附上回合數與剩餘生命」是備選（turns、hp、skipped 先保留參數），目前不輸出。
function freeReportMessage(opp, win, turns, hp, skipped) {
    return `【切磋】对象：${opp}；结果：${win ? '胜利' : '落败'}`;
}
const freeCtx = { opp: null, skipped: false, win: false, statuses: {}, over: false, toastT: 0, gearFlash: false, bloodCard: null };
const $f = (id) => document.getElementById(id);

// ---------- 資料載入（取代 loadBattleData） ----------
async function loadFreeBattleData() {
    const st = {};
    for (const name of Object.keys(CHAR_TO_ENEMY_MAP)) {
        const v = await getST(`世界.妈妈.${name}.状态`);
        st[name] = (v === '3' || v === 3);
    }
    freeCtx.statuses = st;
    currentTargetName = '非攻略中';   // 保險：任何結算路徑都不會寫劇情變數

    // 對手固定：宿主指定（INJECTED_FREE_ENEMY）而且有 FREE_DB 資料才有效；沒有指定或無效 → 不開戰，顯示「没有指定对手」
    const inj = window.INJECTED_FREE_ENEMY;
    freeCtx.opp = (inj && RulesCore.FREE_DB[inj]) ? inj : null;
    document.documentElement.dataset.freeOpp = freeCtx.opp || '';   // 電腦版立繪位移用（free-mode.css 依對手名稱選位移）
    if (!freeCtx.opp) { availableSkills = []; return; }

    const def = RulesCore.FREE_DB[freeCtx.opp];
    const base = JSON.parse(JSON.stringify(ENEMIES_DB[def.enemyId]));
    const fd = RulesCore.makeFreeEnemyData(freeCtx.opp, window.INJECTED_FREE_OPTIONS || {});
    currentEnemyData = Object.assign(base, { name: fd.name, phases: fd.phases, free: fd.free });
    if (currentEnemyData.bg) setBodyBg(currentEnemyData.bg);
    else document.body.style.backgroundImage = "radial-gradient(circle at center, #1a1512, #050403)";

    // 支援：母親狀態 3，而且不能是這場的對手
    availableSkills = SKILLS_DB.filter(s => s.owner !== freeCtx.opp && st[s.owner]);
    selectedSkillIds = selectedSkillIds.filter(id => availableSkills.some(s => s.id === id));
}

// 跳過鈕（自由戰鬥版）：結束戰鬥、直接顯示勝利結算，標記為跳過。不呼叫 handleVictory／skipBattle，不寫任何變數
function freeSkip() {
    if (freeCtx.over) return;
    freeCtx.over = true;
    freeCtx.skipped = true;
    if (S.targetingMode) cancelTargetingMode();   // 技能選目標中：先收起選色器與選取狀態
    showFreeResult(true);

function showFreeResult(win) {
    freeCtx.win = win;
    const t = $f('defeat-title');
    t.innerText = win ? '胜利' : '失败';
    t.classList.toggle('win', win);
    $f('free-stats').innerText = freeCtx.skipped ? '已跳过' : `回合数 ${S.turn}　剩余生命 ${player.hp}`;
    // 發送鈕（勝利：发送战报；失敗：发送战败结果）只在可發送時出現；每次顯示結算都重新啟用。
    // 不能發送時只有一排：「再战」換成金色主要鈕
    const rb = $f('free-btn-report');
    $f('free-report-row').style.display = FREE_CAN_SEND ? 'flex' : 'none';
    rb.innerText = win ? '发送战报' : '发送战败结果';
    rb.disabled = false;
    $f('free-btn-again').classList.toggle('skip', !FREE_CAN_SEND);
    $f('free-sub-row').classList.toggle('solo', !FREE_CAN_SEND);
    $f('defeat-modal').style.display = 'flex';
}

// 發送結果：用既有的 sendMsgViaDOM 送一則訊息（不寫變數），1 秒後 closeGame（同劇情模式的勝利結算）。按下後停用，避免重送
function freeSendReport() {
    if (!FREE_CAN_SEND) return;
    const btn = $f('free-btn-report');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.innerText = '已发送';
    const ok = sendMsgViaDOM(freeReportMessage(freeCtx.opp, freeCtx.win, S.turn, player.hp, freeCtx.skipped));
    if (!ok) showLog("訊息發送失敗，請手動發送");
    setTimeout(() => closeGame(), 1000);
}

function showDefeatModal() {
    if (FREE_MODE) { freeCtx.over = true; showFreeResult(false); return; }
    document.getElementById('defeat-modal').style.display = 'flex';
}

// 手牌角標：魔力（爱娜）、提线連著的牌（黛芬妮，兩張牌同一個「连」記號）、禁书封印的牌（米拉露恩，「封印」）、开花的牌（芙蕾嘉，「花」）。劇情模式與沒有標記的牌傳回空字串，畫面和原版相同
function freeCardBadges(c) {
    if (!S.free) return '';
    return (c.mana > 0 ? `<i class="mana-b">${c.mana}</i>` : '') + (G.cardLinked(c) ? '<i class="link-b">连</i>' : '') + (c.sealed ? '<i class="seal-b">封印</i>' : '') + (c.bloom ? '<i class="bloom-b">花</i>' : '');
}
// 出牌紀錄小牌的屬性：魔力數、被提线自動打出的牌（data-auto）、血月付費打出的牌（data-blood）
function freeMiniAttr(c) {
    if (!S.free) return '';
    return (c.mana > 0 ? ` data-mana="${c.mana}"` : '') + (G.cardAuto(c) ? ' data-auto="1"' : '') + (G.cardBlood(c) ? ' data-blood="1"' : '');
}

// 血月（琳）：點到接不上的牌（遊戲已讓它抖動）。第一下：記住這張牌並提示費用；中間沒有其他操作（任何 updateUI 都會清掉記號）
// 再點同一張才付費打出。回傳 true＝已付費打出（畫面已更新，呼叫端不必抖動）
function freeBloodClick(index) {
    const card = S.hand[index];
    const bi = G.bloodInfo(card);
    if (!bi || bi.playable) { freeCtx.bloodCard = null; return false; }
    if (!bi.canPay) {
        freeCtx.bloodCard = null;
        freeToast(`血月：生命不足，不能支付 ${bi.cost} 生命（生命必须大于费用）`, 2600);
        return false;
    }
    if (freeCtx.bloodCard === card) {
        freeCtx.bloodCard = null;
        const r = G.bloodPlay(index);
        if (!r.played) return false;
        freeAfterPlay(r);
        updateUI();
        return true;
    }
    freeCtx.bloodCard = card;
    freeToast(`再点一次：支付 ${bi.cost} 生命打出`, 4000);
    document.querySelectorAll('#hand-area .card.blood-pend').forEach(e => e.classList.remove('blood-pend'));   // 一次只標一張
    const el = document.querySelectorAll('#hand-area .card')[index];
    if (el) el.classList.add('blood-pend');
    return false;
}
// 敵人攻擊的提示（吸血）：「受到 N 点伤害」後面接的小字；沒有回復就是空字串
function freeDrainNote(turn) {
    const h = Math.min(turn.drainHeal || 0, S.enemy.maxHp - S.enemy.hp);
    return h > 0 ? `　敌人吸血 +${h}` : '';
}

// 結束回合（G.beginEndTurn）之後：回合結束與敵人階段的事件（花圃種下、枯萎）用提示顯示
function freeAfterEndTurn(turn) {
    if (turn.events && turn.events.length) freeToast(turn.events.join('\n'), 2800);
}
// 新回合開始（G.startNewTurn、updateUI）之後：花圃的牌開花
function freeAfterTurnStart() {
    if (S.free && S.fx.bloomN > 0) freeToast(`花圃：${S.fx.bloomN} 张牌开花（可以接在任何牌后面）`, 2800);
}

// 每次出牌之後（updateUI 之前）：核心回傳的事件（机巧齿轮轉動、提线自動打出）用提示顯示，手牌閃一下
const FREE_COLOR_ZH = { red: '红', blue: '蓝', green: '绿', yellow: '黄' };
function freeAfterPlay(result) {
    const lines = [];
    const ev = (result.events || []).concat(result.auto && result.auto.events ? result.auto.events : []);
    if (result.auto) {
        const c = result.auto.card;
        lines.push(`提线：自动打出 ${FREE_COLOR_ZH[c.color]}${c.number}`);
    }
    ev.forEach(t => lines.push(t));
    if (result.blood) lines.unshift(`血月：支付 ${result.blood} 生命打出`);
    if (!lines.length) return;
    freeToast(lines.join('\n'), 2600);
    if (ev.length) freeCtx.gearFlash = true;
}

// ---------- 每次 updateUI 之後更新自由戰鬥的元件 ----------
function freeRefreshUI() {
    if (!S.free) return;
    freeCtx.bloodCard = null;   // 血月的確認只在「連續兩次點同一張接不上的牌」之間有效：任何畫面更新（出牌、技能、結束回合…）都取消
    const mp = G.mpInfo();
    const box = $f('free-mp');
    box.style.display = mp ? 'flex' : 'none';
    if (mp) {
        $f('free-mp-label').innerText = `${mp.name} ${Math.min(mp.mp, mp.cost)}/${mp.cost}`;
        $f('free-mp-fill').style.width = `${Math.min(100, 100 * mp.mp / mp.cost)}%`;
        box.classList.toggle('ready', mp.ready);
    }

    const tag = $f('free-field-tag');
    const fd = S.free.fieldOn ? S.free.def.field : null;
    tag.style.display = fd ? '' : 'none';
    if (fd) tag.innerHTML = `<span class="ft-a">领域</span><span class="ft-dot">·</span><span class="ft-b">${fd.name}</span>`;

    // 条件緞帶：璐法的全序階段把「升 降 同」換成三個小標記，已收集的亮起（收集狀態在 battleState.compareFlags，出牌即時更新）
    const cond = G.conditionText(), cmp = S.enemy.mode === 'compare_all' && cond.includes('升/降/同');
    if (cmp) {
        const f = S.battleState.compareFlags, mk = (k, t) => `<i class="cmp-k${f[k] ? ' done' : ''}">${t}</i>`;
        $f('condition-text').innerHTML = cond.replace('升/降/同', mk('asc', '升') + mk('desc', '降') + mk('eq', '同'));
    } else {
        $f('condition-text').innerText = cond;
    }
    // 緞帶下面的框：升降同（#special-status）一律不用（標記已在緞帶裡）；总和（#sum-display）在領域有总和格時不用（牌桌的总和格已有）
    $f('special-status').style.display = 'none';
    const gk = G.gaugeInfo();
    if (gk && (gk.kind === 'sum' || gk.kind === 'sumrev')) $f('sum-display').style.display = 'none';
    $f('free-help-btn').style.display = G.helpInfo() ? '' : 'none';
    if ($f('free-help').style.display === 'flex') $f('fh-cond').innerText = G.conditionText();

    const ga = G.gaugeInfo();
    const gc = $f('free-gauge');
    gc.style.display = ga ? 'flex' : 'none';
    document.querySelector('.dash-right').classList.toggle('has-gauge', !!ga);
    gc.classList.toggle('blood', !!ga && ga.kind === 'blood');
    gc.classList.toggle('sum', !!ga && (ga.kind === 'sum' || ga.kind === 'sumrev'));   // 万卷书库：总和 x/目标，倒算時標籤是「总和↓」
    gc.classList.toggle('sumrev', !!ga && ga.kind === 'sumrev');
    gc.classList.toggle('garden', !!ga && ga.kind === 'garden');   // 花圃（芙蕾嘉）：綠色
    gc.classList.toggle('sin', !!ga && ga.kind === 'sin');   // 审判（璐法）：罪，紫色；2/3 時轉紅
    gc.classList.toggle('hot', !!ga && ga.kind === 'sin' && ga.value >= ga.max - 1);
    document.querySelector('.dash-right').classList.toggle('gauge-wide', !!ga && (ga.kind === 'sum' || ga.kind === 'sumrev'));   // 手機版：总和 x/目标 比較寬
    if (ga) {
        $f('free-gauge-tag').innerText = ga.label;
        $f('free-gauge-val').innerText = ga.text !== undefined ? ga.text : `${ga.value}/${ga.max}`;
        $f('free-gauge-fill').style.width = `${Math.min(100, 100 * ga.value / ga.max)}%`;
        freeFitGaugeText();
    }

    const hpWrap = document.querySelector('.area-right-bot'), hpLbl = hpWrap.querySelector('.php-lbl');
    const pend = S.fx.sinPending;
    hpWrap.classList.toggle('rf-sin', pend > 0);
    if (pend > 0) {
        const hp = Math.max(0, Math.min(100, player.hp));
        let stops = '';

    if (!S.targetingMode) {

            el.classList.toggle('blood-able', !!bi && !bi.playable && bi.canPay && !S.hand[i].hidden);

        freeCtx.gearFlash = false;

        ha.classList.remove('gear-spin'); void ha.offsetWidth; ha.classList.add('gear-spin');
    }

    const nx = G.nextFloorText();
    const nf = $f('free-next');
    nf.style.display = nx ? 'block' : 'none';
    if (nx) nf.innerText = `下一层 ▸ ${nx}`;

    const duel = G.duelInfo();
    const dl = $f('free-duel');
    const show = !!duel && !S.isPhaseBrokenThisTurn;
    dl.style.display = show ? 'block' : 'none';
    if (show) dl.innerText = `决斗：已出 ${duel.played}/${duel.need}`;
    $f('intent-box').classList.toggle('has-sub', show);
}

// 牌桌魔力槽的數字依文字長度縮小字級：先還原成樣式的字級，再一次縮 1px，直到文字寬度放得進格子（例如「12/30」「30/30」）
function freeFitGaugeText() {
    const cell = $f('free-gauge'), el = $f('free-gauge-val');
    el.style.fontSize = '';
    if (cell.clientWidth === 0) return;
    const avail = cell.clientWidth - 8;
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > avail && size > 10) { size -= 1; el.style.fontSize = size + 'px'; }
}

// 增益／減益膠囊：自由戰鬥時整批重做（加上 2 字短名，膠囊超過 2 個時改成 2×2 緊湊排列）
function freeBuffChips(chips) {
    chips.length = 0;
    const mk = (cls, icon, full, short, n, label) =>
        `<div class="buff-chip ${cls}"><div class="buff-chip-icon">${icon}</div>` +
        `<div class="buff-chip-name"><span class="n-full">${full}</span><span class="n-short">${short}</span></div>` +
        `<div class="buff-chip-turns">${n}</div><div class="buff-chip-turns-label">${label}</div></div>`;
    const b = S.buffs;
    if (b.extraDrawTurns > 0) chips.push(mk('', '✦', '鼓舞<br>之心', '鼓舞', b.extraDrawTurns, 'TURNS'));
    if (b.keepHandTurns > 0) chips.push(mk('', '🛡', '不动<br>信念', '不动', b.keepHandTurns, 'TURNS'));
    G.freeChips().forEach(c => chips.push(mk(c.kind === 'debuff' ? 'debuff' : '', c.icon, c.name, c.short, c.n, c.label)));
    $f('buff-panel').classList.toggle('free-compact', chips.length > 2);
}

<script id="rf-refresh-deco">
/* miniMVU2 視覺更新提案 — canvas 素材產生 + 純裝飾觀察器
 * 只加裝飾節點、class、CSS 變數，不改任何遊戲狀態或流程。
 * 必須放在遊戲主 <script> 之後（會讀取 SKILLS_DB / SKILL_ICONS）。 */
(function () {
    'use strict';
    const DPR = 2;
    const ASSETS = {};   // 供預覽頁「素材」分頁讀取
    const root = document.documentElement;

    function paint(name, w, h, note, draw) {
        const c = document.createElement('canvas');
        c.width = w * DPR; c.height = h * DPR;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.scale(DPR, DPR);
        draw(g, w, h);
        ASSETS[name] = { canvas: c, w, h, note };
        // 素材畫在 CPU 畫布（willReadFrequently）上，再用 toBlob 背景壓縮，開場只多約 15ms
        c.toBlob(blob => {
            root.style.setProperty('--rf-' + name, 'url("' + URL.createObjectURL(blob) + '")');
        }, 'image/png');
    }

    function chamfer(g, x, y, w, h, c) {
        g.beginPath();
        g.moveTo(x + c, y); g.lineTo(x + w - c, y); g.lineTo(x + w, y + c);
        g.lineTo(x + w, y + h - c); g.lineTo(x + w - c, y + h); g.lineTo(x + c, y + h);
        g.lineTo(x, y + h - c); g.lineTo(x, y + c); g.closePath();
    }
    function rrect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function goldGrad(g, x0, y0, x1, y1, hi, mid, lo) {
        const gr = g.createLinearGradient(x0, y0, x1, y1);
        gr.addColorStop(0, hi); gr.addColorStop(0.45, mid); gr.addColorStop(1, lo);
        return gr;
    }

    // ---------- 9-slice 面板框（切角 + 角落卷紋） ----------
    function drawCornerOrnament(g, col, colDim) {
        g.save();
        g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.2;
        // 切角上的菱形
        g.beginPath(); g.moveTo(11, 5); g.lineTo(17, 11); g.lineTo(11, 17); g.lineTo(5, 11); g.closePath(); g.fill();
        // 沿上邊與左邊的卷紋
        g.beginPath(); g.moveTo(20, 9); g.quadraticCurveTo(27, 9, 29, 13); g.arc(26.5, 13, 2.5, 0, Math.PI * 1.6); g.stroke();
        g.beginPath(); g.moveTo(9, 20); g.quadraticCurveTo(9, 27, 13, 29); g.arc(13, 26.5, 2.5, Math.PI / 2, Math.PI * 2.1); g.stroke();
        g.fillStyle = colDim;
        g.beginPath(); g.arc(33, 9, 1.2, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(9, 33, 1.2, 0, Math.PI * 2); g.fill();
        g.restore();
    }
    function frame(name, w, h, o, note) {
        paint(name, w, h, note, (g) => {
            chamfer(g, 3, 3, w - 6, h - 6, 14);
            const fill = g.createLinearGradient(0, 0, 0, h);
            fill.addColorStop(0, o.fillTop); fill.addColorStop(0.5, o.fillMid); fill.addColorStop(1, o.fillBot);
            g.fillStyle = fill; g.fill();
            // 內側暈光
            g.save(); g.clip();
            g.lineWidth = 10; g.strokeStyle = o.glow; chamfer(g, 3, 3, w - 6, h - 6, 14); g.stroke();
            g.restore();

            g.lineWidth = 2;
            g.strokeStyle = goldGrad(g, 0, 0, 0, h, o.rimHi, o.rim, o.rimLo);

    const FRAME_GOLD = { fillTop: '#241a0e', fillMid: '#150f08', fillBot: '#1d150b', glow: 'rgba(216,170,90,0.10)', rimHi: '#f3dca0', rim: '#b48a42', rimLo: '#5e421a', line: 'rgba(216,180,106,0.28)' };
    const FRAME_DIM = { fillTop: 'rgba(28,20,11,0.93)', fillMid: 'rgba(16,11,6,0.93)', fillBot: 'rgba(24,17,9,0.93)', glow: 'rgba(0,0,0,0.35)', rimHi: '#c9a766', rim: '#80602c', rimLo: '#3e2c12', line: 'rgba(216,180,106,0.16)' };
    const FRAME_CRIMSON = { fillTop: '#2c0c0a', fillMid: '#180505', fillBot: '#220807', glow: 'rgba(255,70,50,0.12)', rimHi: '#f0b08a', rim: '#a4402c', rimLo: '#4a140c', line: 'rgba(255,140,110,0.22)' };
    const FRAME_VERDANT = { fillTop: '#0c2410', fillMid: '#061408', fillBot: '#0a1c0c', glow: 'rgba(90,230,120,0.14)', rimHi: '#b8f0b0', rim: '#3e9a4a', rimLo: '#164a1c', line: 'rgba(140,240,150,0.22)' };
    const FRAME_AZURE = { fillTop: '#0a1a30', fillMid: '#050d1a', fillBot: '#081528', glow: 'rgba(90,170,255,0.14)', rimHi: '#b8dcff', rim: '#3e78b8', rimLo: '#142a4a', line: 'rgba(140,200,255,0.22)' };

    frame('frame-gold', 120, 120, FRAME_GOLD, '通用面板框（9-slice，切片 36px）');
    frame('frame-dim', 120, 120, FRAME_DIM, '次要面板框：儀表板、增益、選卡');
    frame('frame-crimson', 120, 120, FRAME_CRIMSON, '敵方意圖框（一般）');
    frame('frame-verdant', 120, 120, FRAME_VERDANT, '敵方意圖框（BREAK）');
    frame('frame-azure', 120, 120, FRAME_AZURE, '敵方意圖框（完全格擋）');

    // ---------- 花色徽記：紅=火焰 藍=水滴 綠=葉 黃=太陽（形狀不同，色弱也分得出） ----------
    const SUITS = {
        red:    { dark: '#2a0707', mid: '#6e1616', light: '#ffb09c', rim: '#c8553e' },
        blue:   { dark: '#050d24', mid: '#173a7a', light: '#a8ccff', rim: '#4f7fd0' },
        green:  { dark: '#051608', mid: '#1c5a2a', light: '#a6ecb2', rim: '#4fa45e' },
        yellow: { dark: '#1e1402', mid: '#7a5a08', light: '#ffe49a', rim: '#d0a232' }
    };
    function emblemPath(g, suit, cx, cy, s) {
        g.beginPath();
        if (suit === 'red') {
            g.moveTo(cx, cy - s * .5);
            g.quadraticCurveTo(cx + s * .12, cy - s * .22, cx + s * .3, cy - s * .06);
            g.bezierCurveTo(cx + s * .5, cy + s * .18, cx + s * .32, cy + s * .5, cx, cy + s * .5);
            g.bezierCurveTo(cx - s * .32, cy + s * .5, cx - s * .5, cy + s * .2, cx - s * .3, cy - s * .08);
            g.quadraticCurveTo(cx - s * .16, cy + s * .06, cx - s * .12, cy - s * .2);
            g.quadraticCurveTo(cx - s * .06, cy - s * .36, cx, cy - s * .5);
        } else if (suit === 'blue') {
            g.moveTo(cx, cy - s * .5);
            g.bezierCurveTo(cx + s * .15, cy - s * .22, cx + s * .38, cy - s * .02, cx + s * .38, cy + s * .18);
            g.arc(cx, cy + s * .18, s * .38, 0, Math.PI);
            g.bezierCurveTo(cx - s * .38, cy - s * .02, cx - s * .15, cy - s * .22, cx, cy - s * .5);
        } else if (suit === 'green') {
            g.moveTo(cx, cy - s * .5);
            g.quadraticCurveTo(cx + s * .52, cy - s * .08, cx, cy + s * .44);
            g.quadraticCurveTo(cx - s * .52, cy - s * .08, cx, cy - s * .5);
        } else {
            for (let i = 0; i < 16; i++) {
                const r = i % 2 === 0 ? s * .5 : s * .24;
                const a = -Math.PI / 2 + i * Math.PI / 8;
                const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
                i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
            }
        }
        g.closePath();
    }
    function emblem(g, suit, cx, cy, s, fill, inner) {
        emblemPath(g, suit, cx, cy, s);

        paint('card-' + suit, 90, 124, '手牌牌面 ' + suit + '（90×124）', (g, w, h) => {
            rrect(g, 1, 1, w - 2, h - 2, 8);
            const bg = g.createRadialGradient(w / 2, h * .45, 4, w / 2, h * .45, h * .7);
            bg.addColorStop(0, S.mid); bg.addColorStop(1, S.dark);
            g.fillStyle = bg; g.fill();
            g.save(); g.clip();
            g.strokeStyle = 'rgba(255,255,255,0.035)'; g.lineWidth = 1;
            for (let x = -h; x < w; x += 5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + h, h); g.stroke(); }
            g.globalAlpha = 0.2; emblem(g, suit, w / 2, h / 2, 64, S.light); g.globalAlpha = 1;
            const hl = g.createLinearGradient(0, 0, 0, h * .35);

    // ---------- 階段寶石 ----------
    paint('gem', 28, 28, '階段寶石（尚存）', (g) => {
        g.beginPath(); g.arc(14, 14, 12.5, 0, Math.PI * 2);
        g.fillStyle = goldGrad(g, 0, 0, 0, 28, '#f6dfa4', '#a8803a', '#4a3212'); g.fill();

        g.fillStyle = goldGrad(g, 0, 0, 0, 28, '#8a7446', '#4e3c1c', '#241808'); g.fill();
        const r = g.createRadialGradient(14, 16, 1, 14, 14, 10);
        r.addColorStop(0, '#1a1410'); r.addColorStop(1, '#050302');
        g.beginPath(); g.arc(14, 14, 9.5, 0, Math.PI * 2); g.fillStyle = r; g.fill();
        g.strokeStyle = 'rgba(0,0,0,0.8)'; g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(9, 10); g.lineTo(14, 15); g.lineTo(12, 20); g.stroke();
    });

    // ---------- 勝利條件緞帶（左右 40px 切片，中段拉伸） ----------
    paint('ribbon', 300, 56, '勝利條件緞帶（左右 40px 切片）', (g, w) => {
        const tail = (flip) => {
            g.save();
            if (flip) { g.translate(w, 0); g.scale(-1, 1); }
            g.beginPath(); g.moveTo(0, 14); g.lineTo(34, 14); g.lineTo(34, 52); g.lineTo(0, 52); g.lineTo(11, 33); g.closePath();
            g.fillStyle = '#2a0e08'; g.fill();
            g.strokeStyle = 'rgba(216,180,106,0.45)'; g.lineWidth = 1; g.stroke();
            g.beginPath(); g.moveTo(20, 44); g.lineTo(34, 44); g.lineTo(34, 52); g.closePath();

        tail(false); tail(true);
        g.beginPath(); g.rect(20, 5, w - 40, 39);
        const b = g.createLinearGradient(0, 5, 0, 44);
        b.addColorStop(0, '#5a2414'); b.addColorStop(0.5, '#3c140c'); b.addColorStop(1, '#260a06');
        g.fillStyle = b; g.fill();
        g.strokeStyle = 'rgba(243,220,160,0.7)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(20, 9.5); g.lineTo(w - 20, 9.5); g.moveTo(20, 39.5); g.lineTo(w - 20, 39.5); g.stroke();
        g.strokeStyle = 'rgba(0,0,0,0.6)';
        g.beginPath(); g.moveTo(20, 5.5); g.lineTo(w - 20, 5.5); g.moveTo(20, 43.5); g.lineTo(w - 20, 43.5); g.stroke();
    });

    // ---------- 標題分隔飾紋 ----------
    paint('divider', 200, 14, '標題分隔飾紋', (g, w, h) => {
        const cy = h / 2;
        const lg = g.createLinearGradient(0, 0, w, 0);
        lg.addColorStop(0, 'rgba(216,180,106,0)'); lg.addColorStop(0.5, 'rgba(243,220,160,0.9)'); lg.addColorStop(1, 'rgba(216,180,106,0)');
        g.strokeStyle = lg; g.lineWidth = 1;
        g.beginPath(); g.moveTo(4, cy); g.lineTo(w / 2 - 12, cy); g.moveTo(w / 2 + 12, cy); g.lineTo(w - 4, cy); g.stroke();
        g.fillStyle = '#f3dca0';
        g.beginPath(); g.moveTo(w / 2, cy - 5); g.lineTo(w / 2 + 6, cy); g.lineTo(w / 2, cy + 5); g.lineTo(w / 2 - 6, cy); g.closePath(); g.fill();
        g.beginPath(); g.arc(w / 2 - 10, cy, 1.4, 0, Math.PI * 2); g.arc(w / 2 + 10, cy, 1.4, 0, Math.PI * 2); g.fill();
    });

    // ---------- 敵方意圖浮水印（盾 + 交叉雙劍） ----------
    paint('crest', 120, 120, '敵方意圖浮水印', (g) => {
        g.strokeStyle = '#ffffff'; g.fillStyle = '#ffffff'; g.lineWidth = 4; g.lineCap = 'round';
        g.beginPath(); g.moveTo(60, 14); g.lineTo(96, 26); g.quadraticCurveTo(96, 82, 60, 106); g.quadraticCurveTo(24, 82, 24, 26); g.closePath(); g.stroke();
        [-1, 1].forEach((d) => {
            g.save(); g.translate(60, 60); g.rotate(d * Math.PI / 4);
            g.beginPath(); g.moveTo(0, -44); g.lineTo(0, 30); g.stroke();
            g.beginPath(); g.moveTo(-10, 22); g.lineTo(10, 22); g.stroke();
            g.beginPath(); g.arc(0, 36, 4, 0, Math.PI * 2); g.fill();
            g.restore();
        });
    });

    // ---------- 玩家生命紋章（80–92 半徑的環道留空，給 CSS 畫血量環） ----------
    paint('medallion', 200, 200, '玩家生命紋章（環道留空給血量環）', (g) => {
        const c = 100;
        g.beginPath(); g.arc(c, c, 99, 0, Math.PI * 2); g.arc(c, c, 92, 0, Math.PI * 2, true);
        g.fillStyle = goldGrad(g, 0, 0, 0, 200, '#f6dfa4', '#a8803a', '#3e2a0e'); g.fill('evenodd');
        g.strokeStyle = 'rgba(40,24,6,0.8)'; g.lineWidth = 1.2;
        for (let i = 0; i < 40; i++) {
            const a = i * Math.PI / 20, r2 = i % 5 ? 96 : 98.5;
            g.beginPath(); g.moveTo(c + Math.cos(a) * 93, c + Math.sin(a) * 93); g.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2); g.stroke();
        }
        g.beginPath(); g.arc(c, c, 80, 0, Math.PI * 2); g.arc(c, c, 75, 0, Math.PI * 2, true);
        g.fillStyle = goldGrad(g, 0, 20, 0, 180, '#d8b46a', '#8a6628', '#3e2a0e'); g.fill('evenodd');
        const d = g.createRadialGradient(c - 18, c - 22, 6, c, c, 75);
        d.addColorStop(0, '#1e2a1a'); d.addColorStop(0.7, '#0a100a'); d.addColorStop(1, '#040604');
        g.beginPath(); g.arc(c, c, 75, 0, Math.PI * 2); g.fillStyle = d; g.fill();
        g.fillStyle = 'rgba(216,180,106,0.55)';
        for (let side = -1; side <= 1; side += 2) {
            for (let i = 0; i < 5; i++) {
                const a = Math.PI / 2 + side * (0.35 + i * 0.22);
                g.save(); g.translate(c + Math.cos(a) * 64, c + Math.sin(a) * 64); g.rotate(a + side * 1.2);
                g.beginPath(); g.ellipse(0, 0, 6, 2.4, 0, 0, Math.PI * 2); g.fill();
                g.restore();
            }
        }
        g.fillStyle = '#f3dca0';
        g.beginPath(); g.moveTo(c, 0); g.lineTo(c + 7, 6); g.lineTo(c, 13); g.lineTo(c - 7, 6); g.closePath(); g.fill();
    });

    // ---------- 選中技能的蠟封 ----------
    paint('seal', 44, 44, '已選中蠟封', (g) => {
        g.beginPath();
        for (let i = 0; i < 24; i++) {
            const r = i % 2 ? 19 : 21, a = i * Math.PI / 12;
            i ? g.lineTo(22 + Math.cos(a) * r, 22 + Math.sin(a) * r) : g.moveTo(22 + r, 22);
        }
        g.closePath();
        const r = g.createRadialGradient(17, 15, 2, 22, 22, 21);
        r.addColorStop(0, '#e05a44'); r.addColorStop(0.6, '#9a1c14'); r.addColorStop(1, '#4a0806');
        g.fillStyle = r; g.fill();
        g.beginPath(); g.arc(22, 22, 13, 0, Math.PI * 2); g.strokeStyle = 'rgba(40,0,0,0.6)'; g.lineWidth = 1.5; g.stroke();
        g.strokeStyle = '#ffe0c8'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
        g.beginPath(); g.moveTo(15, 22); g.lineTo(20, 27); g.lineTo(29, 16); g.stroke();
    });

    // ---------- 戰鬥場景光效層（光束、地面光暈、塵點） ----------
    function paintStage(cv) {
        const W = 1080, H = 720, cx = 480;
        cv.width = W; cv.height = H;
        const g = cv.getContext('2d');
        for (let i = 0; i < 5; i++) {
            const spread = (i - 2) * 60;
            const lg = g.createLinearGradient(0, 0, 0, 520);
            lg.addColorStop(0, 'rgba(255,220,150,0.10)'); lg.addColorStop(1, 'rgba(255,220,150,0)');
            g.fillStyle = lg;
            g.beginPath(); g.moveTo(cx + spread * 0.3 - 18, 0); g.lineTo(cx + spread * 0.3 + 18, 0);
            g.lineTo(cx + spread * 1.6 + 70, 520); g.lineTo(cx + spread * 1.6 - 70, 520); g.closePath(); g.fill();
        }
        g.save(); g.translate(cx, 440); g.scale(1, 0.28);
        const fg = g.createRadialGradient(0, 0, 10, 0, 0, 300);
        fg.addColorStop(0, 'rgba(255,200,120,0.28)'); fg.addColorStop(1, 'rgba(255,200,120,0)');
        g.fillStyle = fg; g.beginPath(); g.arc(0, 0, 300, 0, Math.PI * 2); g.fill();
        g.restore();
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (let i = 0; i < 70; i++) {
            const x = cx + (rnd() - 0.5) * 600, y = rnd() * 460, r = rnd() * 1.6 + 0.3;
            g.fillStyle = 'rgba(255,230,170,' + (0.15 + rnd() * 0.35) + ')';
            g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        }
        ASSETS['stage-fx'] = { canvas: cv, w: W, h: H, note: '戰鬥場景光效層（光束／地面光暈／塵點）' };
    }

    window.RF_ASSETS = ASSETS;

    // ================== DOM 裝飾（純視覺） ==================
    function decorateStage() {
        const stage = document.getElementById('game-stage');
        if (!stage || stage.querySelector('.rf-stage-fx')) return;
        const cv = document.createElement('canvas');
        cv.className = 'rf-stage-fx';
        paintStage(cv);
        stage.prepend(cv);
    }

    // 手牌扇形排列；沒牌可出時提示「結束回合」
    function decorateHand() {
        const cards = document.querySelectorAll('#hand-area .card');
        const n = cards.length;
        const step = n > 7 ? 3 : 4.5;
        const curve = n > 7 ? 1.4 : 2.4;
        cards.forEach((el, i) => {
            const off = i - (n - 1) / 2;
            const r = (off * step).toFixed(2) + 'deg', y = (off * off * curve).toFixed(1) + 'px';
            // 值不變就不寫，避免觸發觀察器無限循環
            if (el.style.getPropertyValue('--fan-r') !== r) el.style.setProperty('--fan-r', r);
            if (el.style.getPropertyValue('--fan-y') !== y) el.style.setProperty('--fan-y', y);
        });
        const endBtn = document.querySelector('.btn-end');
        const stage = document.getElementById('game-stage');
        if (endBtn && stage) {
            const playable = [...cards].some(c => !c.classList.contains('disabled'));
            const suggest = stage.style.display === 'block' && (n === 0 || !playable);
            endBtn.classList.toggle('rf-suggest', suggest);
        }
    }

    // 出牌紀錄：標出每張牌和前一張的接續方式（同色／同數字／觸發追加抽牌）
    function decorateTrack() {
        const minis = document.querySelectorAll('#played-cards-track .mini-card');
        const colorOf = el => ['red', 'blue', 'green', 'yellow'].find(c => el.classList.contains(c));
        minis.forEach((el, i) => {
            if (i === 0) { if (el.hasAttribute('data-link')) el.removeAttribute('data-link'); return; }
            const prev = minis[i - 1];
            const sameColor = colorOf(el) === colorOf(prev);
            const a = parseInt(el.textContent, 10), b = parseInt(prev.textContent, 10);
            let link = sameColor ? 'color' : 'num';
            if ((sameColor && Math.abs(a - b) === 1) || a === b) link = 'bonus';
            if (el.getAttribute('data-link') !== link) el.setAttribute('data-link', link);
        });
    }

    function decorateIntent() {
        const box = document.getElementById('intent-box');
        const val = document.getElementById('enemy-intent-val');
        if (!box || !val) return;
        const safe = val.textContent.trim() === '0' && !box.classList.contains('broken');
        if (box.classList.contains('rf-safe') !== safe) box.classList.toggle('rf-safe', safe);
    }

    function decoratePlayerHp() {
        const el = document.getElementById('player-hp-text');
        const wrap = document.querySelector('.area-right-bot');
        if (!el || !wrap) return;
        const hp = Math.max(0, Math.min(100, parseInt(el.textContent, 10) || 0));
        if (wrap.style.getPropertyValue('--rf-hp') !== String(hp)) wrap.style.setProperty('--rf-hp', hp);
        const low = hp <= 30;
        if (wrap.classList.contains('rf-low') !== low) wrap.classList.toggle('rf-low', low);
    }

    function decorateSelection() {
        const grid = document.getElementById('skill-grid');
        if (!grid) return;
        let db = [], icons = {};
        try { db = SKILLS_DB; icons = SKILL_ICONS; } catch (e) { /* 沒有也不影響 */ }
        grid.querySelectorAll('.sel-card').forEach(card => {
            if (card.querySelector('.rf-sel-portrait')) return;
            const id = parseInt(card.id.replace('sel-skill-', ''), 10);
            const s = db.find(x => x.id === id);
            if (!s || !icons[s.owner]) return;
            const img = document.createElement('img');
            img.className = 'rf-sel-portrait';
            img.alt = '';
            img.src = icons[s.owner];
            card.prepend(img);
        });
        const btn = document.getElementById('btn-start-game');
        if (!btn) return;
        let counter = document.querySelector('.rf-sel-count');
        if (!counter) {
            counter = document.createElement('div');
            counter.className = 'rf-sel-count';
            btn.parentNode.insertBefore(counter, btn);
        }
        const n = grid.querySelectorAll('.sel-card.selected').length;
        const text = '已选 ' + n + ' / 4';
        if (counter.textContent !== text) counter.textContent = text;
        if (counter.classList.contains('rf-full') !== (n >= 4)) counter.classList.toggle('rf-full', n >= 4);
    }

    function refresh() {
        decorateStage();
        decorateHand();
        decorateTrack();
        decorateIntent();
        decoratePlayerHp();
        decorateSelection();
    }

    let queued = false;
    const schedule = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; refresh(); });
    };
    new MutationObserver(schedule).observe(document.body, {
        childList: true, subtree: true, characterData: true,
        attributes: true, attributeFilter: ['class', 'style']
    });
    refresh();
})();
</script>
</body>
</html>
