<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接龙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0a08; /* 預設深褐色背景 */
            --panel-bg: rgba(20, 15, 12, 0.9); /* 介面底色 */
            
            --c-gold: #c5a059;   /* 古銅金 */
            --c-gold-dim: #8a6d3b;
            --c-text: #e0d6c8;   /* 羊皮紙白 */
            
            --c-red: #8a1c1c;    
            --c-red-bright: #ff4d4d;
            --c-blue: #1c4e8a;   
            --c-blue-bright: #4dabf7;
            --c-green: #2b5933;  
            --c-green-bright: #51cf66;
            --c-yellow: #b08d00; 
            --c-orange: #d97706; 
            
            --border-style: 2px solid var(--c-gold);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            font-family: "Noto Serif SC", serif;
            background-color: var(--bg-color);
            /* 預設背景，會被 JS 覆蓋 */
            background-image: radial-gradient(circle at center, #1a1512, #050403);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--c-text); 
            margin: 0; overflow: hidden; position: relative;
            width: 1080px; height: 720px;
            transition: background-image 0.5s ease-in-out; /* 背景切換動畫 */
        }

        h1, h2, .defeat-title, .sel-title, .boss-title-row, .cell-big-text, .php-val {
            font-family: "Cinzel", "Noto Serif SC", serif; 
            text-transform: uppercase;
        }

        /* === 載入與結束畫面 === */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: var(--c-gold);
            font-family: "Cinzel", serif;
            border: 4px double var(--c-gold);
        }

        #defeat-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000;
            display: none; flex-direction: column; justify-content: center; align-items: center; gap: 30px;
            animation: fadeIn 0.5s;
            backdrop-filter: blur(5px);
        }
        .defeat-title { 
            font-size: 4rem; color: var(--c-red-bright); 
            text-shadow: 0 0 20px #500; margin-bottom: 20px; 
            letter-spacing: 5px; border-bottom: 2px solid var(--c-red);
        }
        .defeat-btn-group { display: flex; gap: 40px; }
        .d-btn {
            padding: 15px 40px; font-size: 1.5rem; 
            border: 2px solid var(--c-text); 
            background: rgba(0,0,0,0.5); color: var(--c-text);
            cursor: pointer; transition: 0.2s; border-radius: 4px; 
            font-family: "Cinzel", serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .d-btn:hover { transform: scale(1.05); background: var(--c-text); color: #000; }
        .d-btn.skip { border-color: var(--c-gold); color: var(--c-gold); }
        .d-btn.skip:hover { background: var(--c-gold); color: #000; box-shadow: 0 0 20px var(--c-gold); }

        /* === 遊戲主場景 === */
        #game-stage {
            width: 100%; height: 100%; position: relative; display: none;
            /* 微微的暗角效果 */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* === 選擇介面 === */
        #selection-screen {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 999;
            background: rgba(10, 8, 6, 0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .sel-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .sel-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            max-width: 900px; margin: 20px;
        }
        .sel-card {
            background: linear-gradient(to bottom, #2a2522, #1a1512); 
            border: 1px solid #554433; 
            padding: 15px; border-radius: 4px; 
            cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; gap: 5px;
            width: 200px; height: 140px; position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .sel-card.selected { 
            border-color: var(--c-gold); 
            background: #2b2210; 
            box-shadow: 0 0 15px var(--c-gold), inset 0 0 10px var(--c-gold-dim); 
        }
        .sel-card:hover { transform: translateY(-5px); border-color: #888; }
        .sel-title { font-weight: bold; color: var(--c-gold); font-size: 1.1rem; border-bottom: 1px solid #443322; padding-bottom: 2px;}
        .sel-owner { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; font-style: italic; }
        .sel-desc { font-size: 0.8rem; color: #ccc; line-height: 1.4; font-family: "Noto Serif SC", serif; }
        
        .enemy-selector {
            padding: 10px; font-size: 1.2rem; background: #000; color: var(--c-gold); 
            border: 1px solid var(--c-gold); margin-top: 10px; font-family: inherit;
        }

        .btn-start {
            padding: 10px 50px; font-size: 1.5rem; font-weight: bold;
            background: var(--c-gold); color: #1a0f00; border: 2px solid #fff; 
            cursor: pointer; margin-top: 20px; border-radius: 2px;
            font-family: "Cinzel", "Noto Serif SC", serif;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }
        .btn-start:hover { filter: brightness(1.2); letter-spacing: 2px; transition: 0.3s; }

        /* === BOSS 區域 === */
        .area-top { 
            /* 左側 buff 面板寬 80px，間距 10px，所以從 100px 開始 */
            position: absolute; top: 10px; left: 100px; right: 280px; height: 140px; 
            display: flex; flex-direction: column; align-items: center; z-index: 10; 
        }
        /* Boss 標題列：名字 + inline orb + HP數字 */
        .boss-title-row { 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2rem; margin-bottom: 5px; color: var(--c-gold); 
            text-shadow: 0 2px 2px #000; gap: 8px; width: 100%;
        }
        .boss-name-text { flex: 1; font-family: "Cinzel", "Noto Serif SC", serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 標題列內嵌的小 orb 群 */
        .inline-orb-row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .inline-orb {
            width: 13px; height: 13px;
            background: radial-gradient(circle at 35% 30%, #ff6060, #6a0000);
            border-radius: 50%;
            border: 1px solid #442222;
            box-shadow: 0 0 4px rgba(180,20,20,0.5), inset 1px 1px 2px rgba(255,255,255,0.25);
            transition: 0.25s; flex-shrink: 0;
        }
        .inline-orb.lost {
            background: #111; border-color: #2a1a1a;
            box-shadow: none; transform: scale(0.7); opacity: 0.3;
        }
        .hp-text-val { 
            font-family: "Cinzel", serif; font-size: 1rem; 
            color: #c08080; flex-shrink: 0; text-shadow: 0 1px 3px #000;
        }
        .boss-hp-box { 
            width: 100%; 
            border: 1px solid #6a4e1a;
            border-top: 3px solid #8a6422;
            border-bottom: 3px solid #8a6422;
            padding: 8px; 
            background: 
                linear-gradient(to bottom, #1a1208, #120d06),
                repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0,0,0,0.06) 30px, rgba(0,0,0,0.06) 31px);
            position: relative; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5);
        }
        .boss-title-row { display: flex; justify-content: space-between; font-size: 1.3rem; margin-bottom: 5px; color: var(--c-gold); text-shadow: 0 2px 2px #000; }
        .hp-track { 
            width: 100%; height: 20px; 
            background: #150505; 
            border: 1px solid #2a1010;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
        }
        .hp-fill { 
            height: 100%; 
            background: linear-gradient(to right, #4a0000, #8a1010 40%, #b01818);
            width: 100%; transition: width 0.15s ease-out; 
            box-shadow: 0 0 8px rgba(150,20,20,0.4);
            /* 斜條紋增加質感 */
            background-image: 
                repeating-linear-gradient(60deg, transparent, transparent 6px, rgba(0,0,0,0.15) 6px, rgba(0,0,0,0.15) 12px),
                linear-gradient(to right, #4a0000, #8a1010 40%, #b01818);
        }
        
        .condition-box { 
            margin-top: 8px; 
            border: 1px solid #4a3820;
            border-left: 3px solid #8a6422;
            background: 
                linear-gradient(to right, #1a1208, #120d06),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
            padding: 6px 20px; font-size: 1rem; color: #b09060; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            transition: all 0.3s; text-align: center; width: 100%;
            font-family: "Noto Serif SC", serif;
            letter-spacing: 0.5px;
        }

        .special-status-box, .sum-display-box {
            margin-top: 5px; font-size: 1.2rem; color: var(--c-gold);
            font-weight: bold; text-shadow: 0 0 5px #000; display: none; gap: 15px;
        }
        .check-item.done { color: var(--c-green-bright); text-shadow: 0 0 10px var(--c-green-bright); }
        .sum-display-box { animation: pulseText 2s infinite alternate; }

        .ingame-skip-btn {
            position: absolute; right: -37px; top: 0;
            width: 30px; height: 30px; background: #222; border: 1px solid #444; color: #666;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            font-size: 1.2rem; border-radius: 4px; transition: 0.2s;
        }
        .ingame-skip-btn:hover { color: var(--c-gold); border-color: var(--c-gold); }

        /* === 左側 Buff 狀態面板 === */
        .area-left { 
            position: absolute; top: 10px; left: 10px; width: 80px;
            display: none; /* 預設隱藏，有 buff 時才顯示 */
            flex-direction: column; align-items: center; 
            padding: 6px 4px 4px; gap: 4px; z-index: 10;
            border: 1px solid #3a2e18;
            border-top: 2px solid #5a4520;
            border-bottom: 2px solid #5a4520;
            background: 
                linear-gradient(to bottom, #150e04, #0e0904 30%, #0a0603 70%, #150e04),
                repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 6px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 0 10px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .buff-panel-title {
            font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 1px;
            color: #6a5a3a; text-align: center; width: 100%;
            border-bottom: 1px solid #3a2810; padding-bottom: 4px;
            text-transform: uppercase; flex-shrink: 0;
        }
        .buff-chip {
            width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 6px 3px;
            border-top: 1px solid #5a4020;
            background: linear-gradient(to bottom, #1f1608, #120d04);
            animation: fadeIn 0.3s;
            flex-shrink: 0;
        }
        .buff-chip-icon { font-size: 1rem; line-height: 1; margin-bottom: 2px; }
        .buff-chip-name { 
            font-family: "Noto Serif SC", serif; font-size: 0.58rem; 
            color: #a09060; text-align: center; line-height: 1.3;
        }
        .buff-chip-turns {
            font-family: "Cinzel", serif; font-size: 1.2rem; font-weight: bold;
            color: #c5a059; text-shadow: 0 0 6px rgba(180,130,50,0.4);
            line-height: 1; margin-top: 2px;
        }
        .buff-chip-turns-label {
            font-family: "Cinzel", serif; font-size: 0.5rem;
            color: #6a5a3a; letter-spacing: 1px;
        }

        /* === 敵方意圖 === */
        .area-right-top { 
            position: absolute; top: 10px; right: 20px; width: 220px; height: 130px; 
            border: 1px solid #5a2020;
            border-top: 3px solid #7a2a2a;
            border-bottom: 3px solid #7a2a2a;
            background: 
                linear-gradient(160deg, #200808, #160404 40%, #0e0202),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
            padding: 10px; 
            text-align: center; z-index: 10;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
            /* 去掉現代clip-path，改用側邊裝飾線 */
        }
        /* 裝飾性角章 */
        .area-right-top::before {
            content: "⚔";
            position: absolute;
            top: 4px; right: 6px;
            font-size: 0.7rem;
            color: #5a2020;
            opacity: 0.7;
        }
        .area-right-top.broken {
            border-color: #2a6a35;
            border-top-color: #3a8a45;
            border-bottom-color: #3a8a45;
            background: 
                linear-gradient(160deg, #081a0a, #040e05 40%, #020802),
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
        }
        .intent-label { font-size: 1rem; color: #ffa8a8; font-weight: bold; margin-bottom: 5px; font-family: "Cinzel", serif; }
        .dmg-val { 
            font-size: 3.5rem; color: #ff4d4d; font-weight: bold; 
            line-height: 1; text-shadow: 0 0 10px #500; margin-bottom: 5px;
            font-family: "Cinzel", serif;
        }
        .def-info { font-size: 0.9rem; color: #aaa; }
        .def-val { color: var(--c-green-bright); font-weight: bold; margin-left: 5px; font-size: 1.1rem; }

        /* === [修改] 技能欄：2x2 網格佈局 === */
        .area-right-mid { 
            position: absolute; top: 150px; right: 20px; bottom: 260px; 
            width: 220px; 
            /* 古卷/法典風格邊框 */
            border: 1px solid #5a3e1a;
            border-top: 3px solid #7a5522;
            border-bottom: 3px solid #7a5522;
            background: 
                linear-gradient(to bottom, #1a1208, #120d06 30%, #0e0a04 70%, #1a1208),
                repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.08) 20px, rgba(0,0,0,0.08) 21px);
            display: flex; flex-direction: column; 
            padding: 8px; gap: 8px;
            z-index: 10;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 2px 0 8px rgba(0,0,0,0.4), -2px 0 8px rgba(0,0,0,0.4);
        }
        /* 裝飾性邊角 */
        .area-right-mid::before, .area-right-mid::after {
            content: "✦";
            position: absolute;
            color: #7a5522;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .area-right-mid::before { top: 4px; left: 6px; }
        .area-right-mid::after { top: 4px; right: 6px; }
        
        .skill-title {
            color: #c5a059; 
            font-weight: bold; 
            text-align: center;
            padding-bottom: 4px;
            padding-top: 2px;
            border-bottom: 1px solid #3a2810;
            font-family: "Cinzel", serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(180,130,50,0.4);
        }

        .skill-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            flex-grow: 1;
        }
        
        .skill-btn {
            /* 羊皮紙/石板風格 */
            background: 
                linear-gradient(160deg, #252018 0%, #1a1610 40%, #111009 100%);
            border: 1px solid #4a3515; 
            border-top: 1px solid #5a4520;
            color: #d0c090; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            width: 100%; height: 100%; 
            transition: 0.2s;
            border-radius: 1px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4);
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
        /* 技能按鈕的石刻裝飾線 */
        .skill-btn::before {
            content: "";
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(180,130,50,0.1);
            pointer-events: none;
        }
        .skill-btn .s-img {
            position: absolute;
            top: 5px;
            height: 65%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.8)) sepia(0.2);
            transition: 0.2s;
            z-index: 1;
        }

        .skill-btn .s-name { 
            font-family: "Noto Serif SC", serif;
            font-weight: bold; 
            font-size: 1rem; 
            color: #e0d0a0;
            text-shadow: 0 1px 3px #000, 0 0 5px rgba(0,0,0,0.8);
            z-index: 2;
            margin-bottom: 1px;
        }
        .skill-btn .s-cost { font-size: 0.75rem; color: #8a7a5a; }
        .skill-btn .s-count { 
            font-family: "Cinzel", serif;
            font-size: 0.8rem; 
            color: #c5a059; 
            font-weight: bold;
            text-shadow: 0 1px 2px #000;
            z-index: 2;
            letter-spacing: 1px;
        }
        .skill-btn:hover:not(:disabled) .s-img {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px rgba(180,130,50,0.5)) sepia(0.1);
        }

        .skill-btn:hover:not(:disabled) { 
            background: linear-gradient(160deg, #302818 0%, #221c0e 40%, #1a1409 100%);
            border-color: #7a5522;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3), 0 0 8px rgba(120,80,20,0.2);
        }
        .skill-btn.active { 
            border-color: var(--c-gold); 
            background: linear-gradient(160deg, #3d3015, #2b2010, #201800);
            box-shadow: 0 0 12px rgba(180,130,40,0.4), inset 0 0 10px rgba(180,130,40,0.1); 
        }
        .skill-btn.targetable-skill { border-color: #2a6a35; background: #071a0a; cursor: crosshair; }
        .skill-btn:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
            filter: grayscale(0.9) brightness(0.6); 
        }

        /* === 玩家 HP === */
        .area-right-bot { 
            position: absolute; bottom: 20px; right: 20px; width: 220px; height: 230px; 
            /* 改為八角形紋章盾牌造型，告別現代圓形UI */
            border: none;
            background: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 10;
        }
        /* 用 SVG clip-path 做盾牌/紋章形狀 */
        .area-right-bot::before {
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 40% 30%, #0a2a0a, #001800 60%, #000d00);
            clip-path: polygon(50% 0%, 90% 15%, 100% 50%, 90% 90%, 50% 100%, 10% 90%, 0% 50%, 10% 15%);
            border: none;
            z-index: -1;
        }
        .area-right-bot::after {
            content: "";
            position: absolute; inset: 3px;
            background: transparent;
            clip-path: polygon(50% 0%, 90% 15%, 100% 50%, 90% 90%, 50% 100%, 10% 90%, 0% 50%, 10% 15%);
            border: 2px solid #1a6b2a;
            box-shadow: 0 0 20px rgba(40,140,60,0.3), inset 0 0 30px rgba(0,60,0,0.5);
            z-index: -1;
            outline: 1px solid #0d3d18;
            outline-offset: 4px;
        }
        .php-val { font-size: 4.5rem; font-weight: bold; line-height: 1; color: #6ddb7a; text-shadow: 0 0 20px #0a4010, 0 2px 0 #001800; letter-spacing: -2px; }
        .php-lbl { font-size: 0.85rem; color: #4a9a58; margin-top: 5px; font-family: "Cinzel", serif; letter-spacing: 3px; text-transform: uppercase; }

        /* === 儀表板 === */
        .dashboard-container { 
            position: absolute; bottom: 160px; left: 120px; right: 260px; height: 200px; 
            z-index: 20; 
            transform: perspective(800px) rotateX(20deg); 
            transform-origin: bottom center; 
            /* 石板/木板紋理感 */
            border: 3px solid #3e2e18;
            border-top: 4px solid #5a4020;
            border-bottom: 4px solid #5a4020;
            background-color: #1a1508;
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,0,0,0.12) 60px, rgba(0,0,0,0.12) 61px),
                repeating-linear-gradient(0deg, transparent, transparent 8px, rgba(255,255,255,0.015) 8px, rgba(255,255,255,0.015) 9px),
                linear-gradient(to bottom, #211a0a, #1a1206 30%, #120e04 70%, #1a1508);
            display: grid; grid-template-columns: 1fr 240px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.7);
        }
        .dash-left { border-right: 2px solid #3e3025; padding: 10px 20px; display: flex; flex-direction: column; }
        .track-box { 
    flex-grow: 1; background: rgba(0,0,0,0.4); border: 1px inset #554433; 
    display: flex; align-items: center; padding: 0 10px; gap: 5px;
    overflow-x: auto;   /* ← hidden 改為 auto */
    overflow-y: hidden;

    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 2; padding: 0 8px; height: 22px; box-sizing: border-box; white-space: nowrap;
    border-radius: 11px; font: bold 14px/22px "Noto Serif SC", serif; font-style: normal; text-align: center; color: #fff; letter-spacing: 1px;
    background: linear-gradient(#d83a3a, #7a1010); box-shadow: 0 0 8px rgba(255, 70, 50, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    text-shadow: 0 1px 2px #000; pointer-events: none;
}

/* ---------- 花圃（芙蕾嘉）：牌桌格綠色；开花的手牌左上角「花」記號＋綠色光框 ---------- */
#free-gauge.garden .cell-big-text { color: #9fe0a0; }
#free-gauge.garden i { background: linear-gradient(90deg, #2a7a38, #9fe0a0); }
.card .bloom-b {
    position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; box-sizing: border-box;
    border-radius: 11px; font: bold 14px/22px "Noto Serif SC", serif; font-style: normal; text-align: center; color: #fff;
    background: radial-gradient(circle at 35% 30%, #8fe39a, #1f7a3a 75%); box-shadow: 0 0 8px rgba(120, 235, 140, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    text-shadow: 0 1px 2px #000; pointer-events: none;
}
.card:has(> .bloom-b) {
    box-shadow: inset 0 0 0 3px #8fe39a, 0 8px 14px rgba(0, 0, 0, 0.7), 0 0 16px rgba(110, 230, 130, 0.75) !important;
}

/* ---------- 审判（璐法）：罪格紫色（2/3 轉紅）；生命條上還能赎回的罪伤用紫色條紋、標籤「可赎回 N」 ---------- */
#free-gauge.sin .cell-big-text { color: #d9a8ff; }
#free-gauge.sin i { background: linear-gradient(90deg, #6a2ab0, #d9a8ff); }
#free-gauge.sin.hot .cell-big-text { color: #ff8a7a; }
#free-gauge.sin.hot i { background: linear-gradient(90deg, #a01818, #ff5a3a); }
.area-right-bot.rf-sin::before {
    background: conic-gradient(from 180deg, #52d46a 0 calc(var(--rf-hp, 100) * 1%), var(--rf-sin-stops), rgba(20, 30, 20, 0.9) 0);
}
.area-right-bot.rf-sin.rf-low::before {
    background: conic-gradient(from 180deg, #ff4a3a 0 calc(var(--rf-hp, 100) * 1%), var(--rf-sin-stops), rgba(40, 10, 10, 0.9) 0);
}
.area-right-bot.rf-sin .php-lbl { color: #e0b8ff; text-shadow: 0 0 6px rgba(190, 120, 255, 0.8); }

/* ---------- 說明視窗 ---------- */
#free-help {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3500; box-sizing: border-box; padding: 0 110px;
    flex-direction: column; justify-content: center; align-items: center; gap: 12px;
    background: radial-gradient(ellipse at 50% 45%, rgba(40, 26, 12, 0.96), rgba(4, 2, 1, 0.98) 70%);
}
.fh-title {
    font-size: 30px; letter-spacing: 6px; color: var(--rf-gold-hi, #f3dca0); padding-bottom: 10px;
    background: var(--rf-divider) center bottom / 240px 14px no-repeat;
}
.fh-rules { margin: 0; padding-left: 26px; max-width: 820px; font-size: 17px; line-height: 1.5; color: #e0d6c8; text-align: left; }
.fh-rules li { margin-bottom: 4px; }
.fh-sec { max-width: 820px; width: 100%; text-align: left; }
.fh-lab { font-size: 14px; letter-spacing: 2px; color: #a8977a; }
.fh-txt { font-size: 17px; line-height: 1.5; color: #f3dca0; }
.fh-txt b { color: #c9a8ff; }
/* 條目很多（万卷书库）：字級縮小、不編號 */
#free-help.dense .fh-rules { list-style: none; padding-left: 0; font-size: 15px; line-height: 1.3; }
#free-help.dense .fh-rules li { margin-bottom: 2px; }
#free-help.dense { gap: 6px; }
#fh-close { margin-top: 8px; font-size: 1.2rem; padding: 10px 44px; }

/* ---------- 下一層：緞帶下面條件進度的位置 ---------- */
.free-next {
    display: none; margin-top: 5px; padding: 3px 16px; border-radius: 14px; font-size: 15px; font-weight: bold;
    color: #cfe8ff; text-shadow: 0 0 5px #000; background: rgba(10, 6, 2, 0.7); border: 1px solid rgba(140, 190, 255, 0.5);
}

/* ---------- 决斗宣言：傷害預兆框的小字 ---------- */
.free-duel { display: none; margin-top: 2px; font-size: 13px; line-height: 1.2; color: #ffb0a0; text-shadow: 0 1px 2px #000; }
.area-right-top.has-sub .dmg-val { font-size: 2.6rem; margin-bottom: 2px; }

/* ---------- 狐火牌：看得到數字、看不到顏色 ---------- */
.card.fox {
    background: radial-gradient(ellipse at 50% 40%, #8a4fd0, #2a0f4a 78%) !important;
    color: #fff;
    box-shadow: inset 0 0 0 3px #c9a8ff, 0 8px 14px rgba(0, 0, 0, 0.7), 0 0 16px rgba(170, 110, 255, 0.6) !important;
}
.card.fox::before {
    content: "?"; position: absolute; top: 4px; left: 9px; font-size: 22px; line-height: 1;
    color: #ecdcff; text-shadow: 0 0 8px #b57cff;
}

/* ---------- 減益膠囊（紅）、短名 ---------- */
.n-short { display: none; }
.buff-chip.debuff {
    background: radial-gradient(ellipse at 50% 20%, rgba(255, 70, 60, 0.3), rgba(40, 0, 0, 0.55) 70%) !important;
    box-shadow: inset 0 0 0 1px rgba(255, 100, 90, 0.6) !important;
}
.buff-chip.debuff .buff-chip-name { color: #ffb0a8 !important; }
.buff-chip.debuff .buff-chip-turns { color: #ff6b5b !important; text-shadow: 0 0 6px rgba(255, 60, 40, 0.5); }

/* ---------- 領域說明（沿用 #log-overlay 的樣子，可多行） ---------- */
#free-toast {
    position: fixed; top: 160px; left: 50%; transform: translateX(-50%); max-width: 720px; text-align: center; white-space: pre-line;
    pointer-events: none; z-index: 9999; opacity: 0; transition: opacity 0.2s;
    font-size: 17px; line-height: 1.5; font-weight: bold; color: var(--c-gold); text-shadow: 0 0 10px black;
    padding: 8px 30px; border-radius: 30px; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.55) 80%);
}

/* ---------- 沒有指定對手：一行字和「关闭」 ---------- */
#free-noopp {
    width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 999; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 36px;
    background: radial-gradient(ellipse at 50% 45%, rgba(40, 26, 12, 0.92), rgba(4, 2, 1, 0.97) 70%);
}
#free-noopp .fn-txt { font-size: 2rem; letter-spacing: 4px; color: var(--rf-gold-hi, #f3dca0); text-shadow: 0 2px 4px #000; }
#free-noopp .d-btn { width: 170px; padding: 14px 0; text-align: center; font-size: 22px; }

/* ---------- 結算畫面（沿用 #defeat-modal 的底） ----------
 * 外框畫在 .free-result-box 上，高度隨內容（原本的固定高度外框 ::before 關掉）。
 * 結構：標題（底下是分隔飾線）→ 統計列 → 按鈕區（第一排 发送战报＝主要；第二排 再战、关闭＝次要；不能發送時只有一排）。
 * 內距：上下左右至少 48px（外框飾件約 36px），按鈕區和外框底線 ≥ 48px；按鈕間距 18px。 */
#defeat-modal.free-result::before { display: none !important; }
.free-result-box {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 54px 72px 56px; box-sizing: border-box;
}
.free-result-box::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    border: 10px solid transparent; border-image: var(--rf-frame-crimson) 72 fill / 36px / 0 stretch;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
}
#free-stats { display: none; margin-top: 4px; font-size: 1.3rem; letter-spacing: 2px; color: #e0d6c8; }
#defeat-modal.free-result #free-stats { display: block; }
.fr-btns { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 14px; }
.fr-main, .fr-sub { display: flex; justify-content: center; gap: 18px; }
.fr-main { display: none; }
.fr-btns .d-btn { box-sizing: border-box; text-align: center; white-space: nowrap; }
.fr-main .d-btn { width: 358px; padding: 15px 0; font-size: 26px; letter-spacing: 4px; }
.fr-sub .d-btn { width: 170px; padding: 13px 0; font-size: 22px; letter-spacing: 3px; }
.fr-sub.solo .d-btn.skip { width: 200px; padding: 15px 0; font-size: 26px; }
.fr-sub.solo .d-btn:not(.skip) { width: 140px; }
/* 停用（已发送）：變暗、去色，不再有放大效果 */
.d-btn:disabled { opacity: 0.6; cursor: default; filter: grayscale(1) brightness(0.65); transform: none; }
.d-btn:disabled:hover { filter: grayscale(1) brightness(0.65); transform: none; }
#defeat-modal.free-result .defeat-title.win { color: var(--rf-gold-hi, #f3dca0); text-shadow: 0 0 20px #a80; }
#turn-overlay-sub { text-align: center; padding: 0 30px; }

/* ================= 手機版 html.rf-m ================= */
/* BOSS 欄：名稱／血條／MP 三列（列距縮小，總高仍在 208px 內） */
html.rf-m.rf-free .area-top .boss-hp-box { row-gap: 12px; }
html.rf-m .free-mp { grid-column: 1 / -1; grid-row: 3; margin-top: 0; font-size: 34.2px; gap: 14px; }
html.rf-m .free-mp-bar { height: 16px; border-radius: 8px; }

/* 領域標籤：兩行（领域／名稱），貼在緞帶左端，高度 ≥ 70px */
html.rf-m #free-cond-row { gap: 10px; margin-top: 10px; align-items: center; }
html.rf-m #free-cond-row .condition-box { margin-top: 0 !important; max-width: none; }
html.rf-m .free-field-tag {
    display: flex; flex-direction: column; justify-content: center; align-items: center;

/* 「?」說明鈕：觸控目標 76px */
html.rf-m .free-help-btn { width: 76px; height: 76px; font-size: 48px; line-height: 76px; }

/* 魔力槽：牌桌下排 COMBO｜DECK｜魔力｜重新准备｜结束回合（五格，寬度比原本的四格窄） */
html.rf-m .dash-right.has-gauge { grid-template-columns: 150px 120px 130px 110px 1fr; }

/* 万卷书库：总和 x/目标 的格子加寬；封印記號（牌 140 × 192） */
html.rf-m .dash-right.has-gauge.gauge-wide { grid-template-columns: 140px 110px 190px 100px 1fr; }
html.rf-m #free-gauge.sum .cell-big-text { font-size: 44px; }
html.rf-m .card .seal-b { bottom: 10px; height: 50px; padding: 0 10px; border-radius: 25px; font-size: 34.2px; line-height: 50px; }

/* 审判：生命紋章下方的「可赎回 N」（電腦版直接換標籤文字；手機版標籤字級 0，用 ::after 顯示） */
html.rf-m .area-right-bot.rf-sin .php-lbl::after { content: attr(data-sin); letter-spacing: 0; color: #e0b8ff; }

/* 开花記號（牌 140 × 192） */
html.rf-m .card .bloom-b { left: 8px; top: 8px; width: 50px; height: 50px; border-radius: 25px; font-size: 34.2px; line-height: 50px; }

/* 提线記號（牌 140 × 192；小牌 66 × 96） */
html.rf-m .card .link-b { left: 8px; top: 8px; width: 50px; height: 50px; border-radius: 25px; font-size: 34.2px; line-height: 50px; }
html.rf-m .mini-card[data-auto]::after { bottom: 3px; min-width: 40px; height: 36px; padding: 0 4px; border-radius: 18px; font-size: 34.2px; line-height: 36px; }

html.rf-m .mini-card[data-blood]::after { bottom: 3px; min-width: 40px; height: 36px; padding: 0 4px; border-radius: 18px; font-size: 34.2px; line-height: 36px; }

/* 魔力標記（牌 140 × 192；小牌 66 × 96） */
html.rf-m .card .mana-b { left: 8px; bottom: 10px; min-width: 50px; height: 50px; padding: 0 6px; border-radius: 25px; font-size: 34.2px; line-height: 50px; }
html.rf-m .mini-card[data-mana]::after { bottom: 3px; min-width: 40px; height: 36px; padding: 0 4px; border-radius: 18px; font-size: 34.2px; line-height: 36px; }

/* 說明視窗：主文字 40px、標籤 34.2px */
html.rf-m #free-help { padding: 0 50px; gap: 14px; }
html.rf-m .fh-title { font-size: 60px; padding-bottom: 14px; background-size: 340px 16px; }
html.rf-m .fh-rules { max-width: 960px; font-size: 40px; line-height: 1.3; padding-left: 50px; }
html.rf-m .fh-rules li { margin-bottom: 6px; }
html.rf-m #free-help.dense { gap: 8px; }
html.rf-m #free-help.dense .fh-title { font-size: 52px; padding-bottom: 8px; }
html.rf-m #free-help.dense .fh-rules { font-size: 34.2px; line-height: 1.25; padding-left: 0; max-width: 990px; }
html.rf-m #free-help.dense .fh-rules li { margin-bottom: 3px; }
html.rf-m #free-help.dense { padding: 0 40px; }
html.rf-m .fh-sec { max-width: 960px; }
html.rf-m .fh-lab { font-size: 34.2px; }
html.rf-m .fh-txt { font-size: 40px; line-height: 1.3; }

html.rf-m .free-next { position: relative; left: -160px; margin-top: 10px; padding: 4px 30px; border-radius: 30px; font-size: 40px; line-height: 1.3; }

html.rf-m .free-duel { font-size: 34.2px; line-height: 1.2; margin-top: 0; }
html.rf-m .area-right-top.has-sub { padding: 4px 16px 6px; }
html.rf-m .area-right-top.has-sub .dmg-val { font-size: 70px; margin-bottom: 0; }
html.rf-m .area-right-top.has-sub .intent-label { line-height: 1; }
html.rf-m .area-right-top.has-sub .def-info { line-height: 1.1; padding: 0 16px; }

/* 狐火牌（牌 140 × 192） */
html.rf-m .card.fox::before { top: 8px; left: 14px; font-size: 40px; }

/* 增益／減益膠囊超過 2 個：2 × 2 排列、只留 2 字短名（圖示拿掉） */
html.rf-m .area-left.free-compact { left: 40px; width: 272px; flex-direction: row; flex-wrap: wrap; align-content: center; justify-content: flex-start; gap: 4px; }
html.rf-m .area-left.free-compact .buff-chip { width: 134px; justify-content: space-between; padding: 0 6px 0 12px; gap: 4px; }
html.rf-m .area-left.free-compact .buff-chip-icon { display: none; }
html.rf-m .area-left.free-compact .n-full { display: none; }
html.rf-m .area-left.free-compact .n-short { display: inline; }

/* 領域說明 */
html.rf-m #free-toast { top: 470px; max-width: 900px; font-size: 40px; padding: 14px 44px; }

/* 回合過場的技能說明 */
html.rf-m #turn-overlay-sub { max-width: 1000px; line-height: 1.4; }

/* 結算畫面：外框 940 寬、高度隨內容；按鈕區 700 寬（主要鈕整排寬，次要鈕各一半），字級 ≥ 34、觸控 ≥ 70；內距 ≥ 90px */
html.rf-m #defeat-modal.free-result { gap: 0; }
html.rf-m .free-result-box { width: 940px; gap: 30px; padding: 100px 120px 110px; }
html.rf-m .free-result-box::before { border-image-width: 48px; }

html.rf-m .fr-btns { gap: 28px; margin-top: 20px; }

html.rf-m .fr-main .d-btn { width: 700px; padding: 26px 0; font-size: 52px; letter-spacing: 4px; }

/* ================= 條件緞帶：璐法全序的「升 降 同」標記 ================= */
.cmp-k {
    display: inline-block; box-sizing: border-box; min-width: 1.5em; margin: 0 0.12em; padding: 0 0.1em; line-height: 1.2;
    font-style: normal; font-weight: bold; text-align: center; border-radius: 0.3em; text-shadow: none;
    color: #8a7a60; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.18);
}
.cmp-k.done {
    color: #eaffea; background: #1f7a3a; border-color: #8fe39a;
    box-shadow: 0 0 8px rgba(110, 235, 140, 0.9); text-shadow: 0 1px 2px #000;
}
html.rf-m .cmp-k { border-width: 2px; }

/* ================= 電腦版立繪位移（只有自由戰鬥電腦版） =================
 * 這三位的頭部原本被條件緞帶（含左邊的領域標籤列）遮住；依對手把立繪整個往下移（--rf-free-dy），立繪大小不變。
 * 對手名稱由 free-mode.js 的 loadFreeBattleData 寫在 <html data-free-opp>；其他五位不移動；手機版不動。 */
html.rf-free:not(.rf-m) .boss-img-container { transform: translateY(var(--rf-free-dy, 0px)); }
html.rf-free:not(.rf-m)[data-free-opp="莉迪娅"] { --rf-free-dy: 55px; }
html.rf-free:not(.rf-m)[data-free-opp="米拉露恩"] { --rf-free-dy: 60px; }
html.rf-free:not(.rf-m)[data-free-opp="璐法"] { --rf-free-dy: 50px; }

<script id="rf-mobile-switch">
/* 宿主注入 INJECTED_MOBILE_LAYOUT 時改用手機直式版面；INJECTED_STAGE_H 可指定畫布高度（預設 1440） */
if (window.INJECTED_MOBILE_LAYOUT) {
    document.documentElement.classList.add('rf-m');
    if (window.INJECTED_STAGE_H) document.documentElement.style.setProperty('--rf-stage-h', window.INJECTED_STAGE_H + 'px');
}
</script>

<body>
    <div id="bgm-toggle-btn" class="sys-btn" onclick="toggleLocalMusic()">🔊</div>

        <div class="ready-title">Mother Duel</div>

    <div id="selection-screen">
        <div class="sel-header">

            <div style="display:flex; flex-direction:column; align-items:center;">
                <label style="color:#888; font-size:0.9rem;">测试敌人选择 (Debug)</label>

                    </select>

        <div class="defeat-btn-group">

            <div class="cp-btn" style="background: linear-gradient(135deg, #1a3a7a, #060f2a)" onclick="resolveColorPick('blue')"></div>
            <div class="cp-btn" style="background: linear-gradient(135deg, #1a5a28, #071a0a)" onclick="resolveColorPick('green')"></div>

<script id="rules-core">
/* rules-core.js — 小遊戲（卡牌戰鬥）的規則核心，不碰 DOM
 *
 * 來源：miniMVU2.html / mini261014.html 的遊戲 <script>（規則函式兩份完全相同）。
 * 目的：把規則邏輯從畫面拆出來，讓之後的「自由戰鬥」（場地效果、敵人 MP 與技能、新破防條件、特殊牌）
 *       可以在這一層加，也讓 Node 可以直接模擬。劇情模式的行為必須和原版完全一樣
 *       （tools/minisim/regress.js 用同一組亂數逐步比對原版）。
 *
 * 用法（瀏覽器：一般 <script>，掛成 window.RulesCore；Node：module.exports）
 *   const G = RulesCore.createGame({ rng, log, onVictory, onPhaseLoaded, hooks });
 *   G.state                       // 所有遊戲狀態都在這一個物件裡
 *   G.startBattle(enemyData)      // 開戰：載入第 1 階段、洗牌、第一回合
 *   G.playCard(i) / G.clickCard(i) / G.useSkill(i) / G.resolveColorPick(c) / G.cancelTargeting()
 *   G.beginEndTurn() → G.applyEnemyAttack(incoming) → G.startNewTurn()   （畫面版 endTurn 中間夾動畫）
 *   G.endTurn()                   // 同上三步一次做完（模擬、測試用）
 *
 * 選項
 *   rng()            回傳 [0,1) 的亂數，預設 Math.random（每次呼叫時才取，方便測試時替換）。全部的隨機都經過它。
 *   log(msg)         原版 showLog 的位置（訊息文字和原版相同）。
 *   onVictory()      最後一階段被打倒時呼叫（原版是 handleVictory()；打倒後每次出牌都會再呼叫，這是原版行為）。
 *   onPhaseLoaded(index, phaseData)   載入某階段後呼叫（畫面更新條件文字與閃光）。
 *   hooks            覆寫下面的鉤子（預設全部是空函式，沒有場地／敵人技能時行為與原版相同）。
 *
 * 鉤子（G.hooks.*，呼叫時才取，可以之後換掉）
 *   turnStartAfterDiscard(g)         回合開始：棄牌（或保留手牌）之後、決定抽牌數之前
 *   turnStartBeforeDraw(g, ctx)      抽牌之前；可改 ctx.drawCount
 *   turnStartAfterDraw(g)            抽牌之後
 *   canPlay(g, card, base, top)      出牌合法判斷；回傳 boolean 會覆寫 base，回傳 undefined 沿用 base（領域鉤子也拿得到 top：花圃的开花牌）
 *   noBonus(g, card, top)            自由戰鬥專用：回傳 true＝這張牌（本來有追加抽牌的接牌）沒有追加抽牌
 *   beforeDamage(g, card)            自由戰鬥專用：打出之後、傷害計算（DAMAGE_MODES、換階段）之前；审判在這裡記下這張牌符不符合條件
 *   afterPlay(g, info)               出牌之後（傷害與破防處理完）；info = { card, bonusDraw, damage }
 *   turnEnd(g, info)                 結束回合：算敵人傷害之前
 *   enemyPhase(g, info)              敵人階段：玩家回合結束與敵人攻擊之間；info = { stunned, atk, defense, incoming }，可改 incoming
 *
 * enemy.mp：每出一張牌 +1，開戰時歸零。自由戰鬥會顯示在 BOSS 欄；劇情模式沒有任何作用。
 *
 * 自由戰鬥（replay 模式，劇情模式不受影響）

 *   G.startBattle(RulesCore.makeFreeEnemyData('爱娜', opts)) 開戰；enemyData.free 存在時 state.free 才非 null，
 *   所有自由戰鬥的規則都掛在 state.free／state.fx（效果狀態）上，劇情模式下兩者都是空的，行為和原版一致。
 *   領域與敵人技能的 hooks 在 FREE_DB 裡（同上面的鉤子名稱）；敵人技能在敵人階段 enemy.mp ≥ mpCost 時發動（被擊暈那回合不發動）。
 *   玩家技能 9「秩序崩坏」（FREE_SKILLS，只在自由戰鬥提供）：接下來 3 張牌無視出牌合法判斷（state.fx.orderBreak）。

 *     槽每滿 5 扣 5 抽 1 張（每打一張牌最多抽 1 張）；回合結束手牌的魔力消失（不动信念保留的牌除外）。

 *   机巧齿轮（黛芬妮的領域）：本回合每打出 3 張牌（turnStats.cardsPlayed 為 3 的倍數，第 3、6、9… 張打出之後），手牌全部顏色輪轉一格

 *   提线（黛芬妮的敵人技能）：下回合開始隨機 2 張手牌被連起來（state.fx.tether = { a, b }，G.cardLinked(card) 給畫面標示）；

 *     回合開始、換階段、書頁 4 恢復加總。每打出一個數字觸發書頁 1～10（afterPlay，傷害計算之後；bookPage()；log 一行並放進 info.events 讓畫面顯示）：

            { hp: 100, atk: 35, mode: "value", desc: "重击：牌面数值 = 伤害" }
        ] },
        "enemy_8": { name: "起始与终局之魔王 - 奈芙蒂", phases: [
            { hp: 1, atk: 30 },
            { hp: 1, atk: 35 },
            { hp: 1, atk: 40 },
            { hp: 1, atk: 50 }
        ] },
        "enemy_9": { name: "神选之圣女 - 璐法", phases: [
            { hp: 6, atk: 20, mode: "compare_asc", desc: "升序：后牌 > 前牌 时伤害" },
            { hp: 6, atk: 20, mode: "compare_desc", desc: "降序：后牌 < 前牌 时伤害" },
            { hp: 3, atk: 20, mode: "compare_eq", desc: "同号：后牌 = 前牌 时伤害" },
            { hp: 1, atk: 25, mode: "compare_all", desc: "全序：单回合内集齐 升/降/同 时伤害" }
        ] },
        "默认": { name: "訓練木樁", phases: [
            { hp: 50, atk: 5, mode: "count", desc: "練習：出一張牌 1 傷害" }
        ] }
    };

    const defaultRng = () => Math.random();

    // 自由戰鬥的效果狀態：orderBreak 秩序崩坏剩餘張數；manaPool 魔力槽；droughtNext/droughtActive 魔力枯竭；
    // shuffleNext/shuffleActive 变化之术；duelPending/duel 决斗宣言；atkBonus 重甲方阵累計的攻擊加成；exactTarget 目前的指定數字；
    // armor 重甲方阵目前的阵型（領域關掉時永遠是 0）；armorBroke 本回合破阵的次數；
    // tetherNext 下回合要提线；tether 目前連在一起的兩張牌 { a, b }；autoPlayed 本回合被提线自動打出的牌（畫面標記用）；
    // bloodPaid 血月本回合已付幾次；bloodCards 本回合付費打出的牌（畫面標記用）；drainNext 下回合起要吸血；drain 吸血生效中；drainHeal 這次攻擊要回復敵人的量；
    // sumRev 万卷书库的總和方向（1＝倒算：書頁 8 設定，書頁 4／回合開始／換階段恢復加總）；page2Trig 書頁 2 上次觸發時是本回合第幾張牌（不能連續觸發）；
    // sealNext 下回合要禁书；sealActive 禁书生效中（被封印的牌有 card.sealed）
    // sin 罪（璐法的审判，跨回合、換階段都不歸零）；sinPending 天罚扣掉、本回合還能赎回的生命；verdictNext／verdict 断罪預告／生效中；judge 這張牌打出當下的判斷結果 { ok, kind }；
    // garden 花圃（芙蕾嘉）裡的牌；bloomPlayed 本回合打出的开花牌（「前一張是开花牌」的判斷用）；bloomN 本回合開始時开花的張數（畫面提示用）
    function freshFx() {
        return { sin: 0, sinPending: 0, verdictNext: 0, verdict: 0, judge: null, garden: [], bloomPlayed: [], bloomN: 0, sumRev: 0, page2Trig: 0, sealNext: 0, sealActive: 0, bloodPaid: 0, bloodCards: [], drainNext: 0, drain: 0, drainHeal: 0, orderBreak: 0, manaPool: 0, droughtNext: 0, droughtActive: 0, shuffleNext: 0, shuffleActive: 0, duelPending: null, duel: null, atkBonus: 0, exactTarget: 0, armor: 0, armorBroke: 0, tetherNext: 0, tether: null, autoPlayed: [] };
    }

    // ============================================================
    // 牌的判斷
    // ============================================================
    // 可以接在 top 後面：同色、數字差 1、同數字
    function cardsMatch(card, top) {
        return card.color === top.color || Math.abs(card.number - top.number) === 1 || card.number === top.number;
    }

    // 追加抽牌：（同色且差 1）、（不同色但同數字）、（同色同數字）
    function isBonusPlay(card, top) {
        const sameColor = card.color === top.color;
        const sameNum = card.number === top.number;
        const adjNum = Math.abs(card.number - top.number) === 1;
        return (sameColor && adjNum) || (!sameColor && sameNum) || (sameColor && sameNum);
    }

    // ============================================================
    // 傷害模式表：mode 名稱 → (g, lastCard) → 這張牌造成的傷害
    // 會改 battleState 的模式（sum_target、compare_all）和原版一樣在這裡改
    // ============================================================
    const DAMAGE_MODES = {
        count() {
            return 1;
        },
        color_chain(g, lastCard) {
            const targetColor = g.state.enemy.params.color;
            if (lastCard.color !== targetColor) return 0;
            const cards = g.state.currentTurnCards;
            if (cards.length >= 2) {
                const prev = cards[cards.length - 2];
                if (prev.color === targetColor) return 1;
            }
            return 0;
        },
        color_switch(g, lastCard) {
            const cards = g.state.currentTurnCards;
            if (cards.length >= 2) {
                const prev = cards[cards.length - 2];
                if (lastCard.color !== prev.color) return 1;
            }
            return 0;
        },
        diff(g, lastCard) {
            const cards = g.state.currentTurnCards;
            if (cards.length >= 2) {
                const prev = cards[cards.length - 2];
                return Math.abs(lastCard.number - prev.number);
            }
            return 0;
        },
        combo_mod(g) {
            const mod = g.state.enemy.params.mod || 3;
            const combo = g.state.turnStats.combo;
            return (combo > 0 && combo % mod === 0) ? 1 : 0;
        },
        sum_target(g, lastCard) {
            const bs = g.state.battleState;
            const target = g.state.enemy.params.target || 15;
            let dmg = 0;
            bs.sumAccumulator += lastCard.number;
            if (bs.sumAccumulator === target) {
                dmg = 1;
                bs.sumAccumulator = 0;
            } else if (bs.sumAccumulator > target) {
                bs.sumAccumulator -= target;
            }
            return dmg;
        },
        value(g, lastCard) {
            return lastCard.number;
        },
        compare_asc(g, lastCard) {
            const cards = g.state.currentTurnCards;
            if (cards.length >= 2 && lastCard.number > cards[cards.length - 2].number) return 1;
            return 0;
        },
        compare_desc(g, lastCard) {
            const cards = g.state.currentTurnCards;
            if (cards.length >= 2 && lastCard.number < cards[cards.length - 2].number) return 1;
            return 0;
        },
        compare_eq(g, lastCard) {
            const cards = g.state.currentTurnCards;
            if (cards.length >= 2 && lastCard.number === cards[cards.length - 2].number) return 1;
            return 0;
        },
        compare_all(g, lastCard) {
            const bs = g.state.battleState;
            const cards = g.state.currentTurnCards;
            let dmg = 0;
            if (cards.length >= 2) {
                const prev = cards[cards.length - 2];
                if (lastCard.number > prev.number) bs.compareFlags.asc = true;
                else if (lastCard.number < prev.number) bs.compareFlags.desc = true;
                else bs.compareFlags.eq = true;

                if (bs.compareFlags.asc && bs.compareFlags.desc && bs.compareFlags.eq) {
                    dmg = 1;
                    bs.compareFlags = { asc: false, desc: false, eq: false };
                }
            }
            return dmg;
        },

        // ---- 自由戰鬥新增 ----
        // 大牌：出牌數字 ≥ params.min 時 1 傷害
        big_card(g, lastCard) {
            return lastCard.number >= (g.state.enemy.params.min || 7) ? 1 : 0;
        },
        // 指定數字：出牌數字 === 目前目標時 1 傷害，命中後重抽目標（目標存在 state.fx.exactTarget；規劃用的假 g 設 planning=true，不重抽）
        exact(g, lastCard) {
            const fx = g.state.fx;
            if (lastCard.number !== fx.exactTarget) return 0;
            if (!g.planning) fx.exactTarget = rollExactTarget(g.rng, g.state.enemy.params);
            return 1;
        },
        // 連擊達標：本回合連擊數剛好到 params.n 的那一張牌 1 傷害（連擊數只會一張一張加，所以每回合最多一次）
        combo_reach(g) {
            return g.state.turnStats.combo === (g.state.enemy.params.n || 6) ? 1 : 0;
        },
        // 魔力（只讀「被打出那張牌」的 mana，規劃用的假 g 也能算）：
        // 魔力 ≥ params.min（預設 2）時 1 傷害
        mana_over(g, lastCard) {
            return (lastCard.mana || 0) >= (g.state.enemy.params.min || 2) ? 1 : 0;
        },
        // 傷害 = 這張牌的魔力
        mana_value(g, lastCard) {
            return lastCard.mana || 0;
        },
        // 魔力剛好 params.n（預設 5）時 1 傷害（爱娜目前沒用：模擬顯示太難）
        mana_exact(g, lastCard) {
            return (lastCard.mana || 0) === (g.state.enemy.params.n || 5) ? 1 : 0;
        },
        // 阵型（莉迪娅的重甲方阵；阵型存在 state.fx.armor，規劃用的假 g 也要有 fx.armor、fx.armorBroke）：
        // 數字 ≤ 阵型 → 0 傷害，阵型 −1（最低 0，叫「破阵」）；數字 > 阵型 → 傷害 = 數字 − 阵型。領域關掉時阵型是 0，傷害 = 牌面數字
        armor(g, lastCard) {
            const fx = g.state.fx;
            const a = fx.armor || 0;
            if (a > 0 && lastCard.number <= a) {
                fx.armor = a - 1;
                fx.armorBroke = (fx.armorBroke || 0) + 1;
                return 0;
            }
            return lastCard.number - a;
        },
        // 总和（米拉露恩的万卷书库）：和 sum_target 一樣累加、刚好等于目标 1 傷害歸零、超過就減目標；差別是 state.fx.sumRev=1（書頁 8 的倒算）時
        // 總和改成減去牌面數字（最低 0），倒算不會造成傷害（到 0 也不算命中），所以「超過就減目標」只發生在加總時。不改 sum_target（劇情模式與原版一致）
        sum_book(g, lastCard) {
            const bs = g.state.battleState;
            const target = g.state.enemy.params.target || 15;
            if (g.state.fx.sumRev > 0) {
                bs.sumAccumulator = Math.max(0, bs.sumAccumulator - lastCard.number);
                return 0;
            }
            let dmg = 0;
            bs.sumAccumulator += lastCard.number;
            if (bs.sumAccumulator === target) {
                dmg = 1;
                bs.sumAccumulator = 0;
            } else if (bs.sumAccumulator > target) {
                bs.sumAccumulator -= target;
            }
            return dmg;
        }
    };

    function rollExactTarget(rng, p) {
        const lo = p.lo || 1, hi = p.hi || 10;
        return lo + Math.floor(rng() * (hi - lo + 1));
    }

    // 載入某階段時的初始化（只有自由戰鬥的模式需要；劇情模式沒有這些 mode，不會多耗亂數）
    const MODE_INIT = {
        exact(g) { g.state.fx.exactTarget = rollExactTarget(g.rng, g.state.enemy.params); },
        // 換階段（含開戰）：阵型立刻變成新階段的基本值（params.armor）；領域關掉時是 0。不耗亂數
        armor(g) {
            const f = g.state.free;
            g.state.fx.armor = (f && f.fieldOn) ? (g.state.enemy.params.armor || 0) : 0;
        },
        // 换阶段（含開戰）：總和方向恢復加總、書頁 9 的攻擊力加成清掉（「這個階段」的敵人攻擊力 +9）。不耗亂數
        sum_book(g) {
            g.state.fx.sumRev = 0;
            g.state.fx.atkBonus = 0;
        }
    };

    // ============================================================
    // 自由戰鬥資料表（唯一的一份，數字都是暫定，由 tools/minisim/sim.js --free 調整）
    //   char：角色名（對應 CHAR_TO_ENEMY_MAP、世界.妈妈.<char>.状态）；enemyId：圖片、音樂在 HTML 的 ENEMIES_DB
    //   phases：{ hp, atk, mode, params, desc, next }；desc 的 {target} 會換成目前的指定數字；next 是「下一層」提示用的短字
    //   field：領域 { name, desc, nextFloor, hooks, defensePerCard(base) }
    //   enemySkill：{ name, desc, mpCost, effect(g, info), hooks, chips(g) }；MP 每出一張牌 +1，≥ mpCost 時在敵人階段發動
    // ============================================================
    const fxChip = (name, n, label, short) => ({ kind: 'debuff', icon: '✖', name, short: short || name, n, label: label || 'TURNS' });
    const MANA_DRAW_AT = 5;   // 魔力槽每滿幾點抽 1 張
    const addMana = (c, n) => { c.mana = (c.mana || 0) + n; };
    const GEAR_EVERY = 3;   // 机巧齿轮：每打出幾張牌輪轉一次
    const COLOR_NEXT = { red: 'blue', blue: 'green', green: 'yellow', yellow: 'red' };
    const COLOR_ZH = { red: '红', blue: '蓝', green: '绿', yellow: '黄' };
    const rotateColor = (color) => COLOR_NEXT[color] || color;
    // 還原被輪轉過的牌顏色（只動有 origColor 的牌）
    const restoreColors = (list) => list.forEach(c => { if (c.origColor !== undefined) { c.color = c.origColor; delete c.origColor; } });

    // 万卷书库（米拉露恩的領域）：打出數字 n 觸發書頁 n 的效果（afterPlay 呼叫，傷害與破防處理之後）。
    // 觸發的書頁用 log 一行並放進 info.events（畫面用提示顯示）；條件沒達成的書頁（1、2、7）什麼都不顯示。
    // info.phaseChanged：這一張剛好打倒了目前階段（已經換成新階段）——書頁 9 不加到新階段（否則等於懲罰打出致命一擊）。
    function bookPage(g, info) {
        const S = g.state, fx = S.fx, n = info.card.number;
        const say = (msg) => { g.log(msg); (info.events = info.events || []).push(msg); };
        const draw = (k) => { for (let i = 0; i < k; i++) { const c = g.drawCardFromDeck(); if (c) S.hand.push(c); } };
        switch (n) {
            case 1:   // 本回合第 1 張牌是 1 → 抽 1 張
                if (S.turnStats.cardsPlayed === 1) { draw(1); say("书页·1：抽 1 张"); }
                break;
            case 2: { // 前一張也是 2 → 抽 1 張；不能連續觸發（上一張 2 觸發過，這張就不觸發）
                const cards = S.currentTurnCards, prev = cards[cards.length - 2];
                if (prev && prev.number === 2 && fx.page2Trig !== S.turnStats.cardsPlayed - 1) {
                    fx.page2Trig = S.turnStats.cardsPlayed;
                    draw(1); say("书页·2：连续的 2，抽 1 张");
                }
                break;
            }
            case 3:
                S.enemy.mp += 3; say("书页·3：敌人 MP +3");
                break;
            case 4:
                fx.sumRev = 0; say("书页·4：总和恢复加总");
                break;
            case 5: {
                const before = S.enemy.mp;
                S.enemy.mp = Math.max(0, S.enemy.mp - S.turnStats.combo);
                say(`书页·5：敌人 MP −${before - S.enemy.mp}`);
                break;
            }
            case 6: {
                const hp0 = S.player.hp;
                if (hp0 > 1) S.player.hp = Math.max(1, hp0 - 6);   // 不會讓生命降到 0
                say(`书页·6：受到 ${hp0 - S.player.hp} 点伤害`);
                break;
            }
            case 7:   // 第 7 連擊打出 7 → 抽 2 張
                if (S.turnStats.combo === 7) { draw(2); say("书页·7：第 7 连击，抽 2 张"); }
                break;
            case 8:
                fx.sumRev = 1; say("书页·8：总和改为倒算");
                break;
            case 9:
                if (!info.phaseChanged) { fx.atkBonus += 9; say("书页·9：敌人攻击力 +9"); }
                else say("书页·9：阶段已被击破，无效");
                break;
            case 10: {   // 检索：牌庫裡數字 = 目標 − 目前總和（10 自己已加進總和）的牌加入手牌；優先選接得上這張 10 的牌，否則取牌庫最上面（最先會抽到）的
                const need = (S.enemy.params.target || 15) - S.battleState.sumAccumulator;
                if (need < 1 || need > 10) { say(`书页·10：检索差额 ${need} 不在 1～10，无效`); break; }
                let pick = -1;
                for (let i = S.deck.length - 1; i >= 0; i--) {
                    if (S.deck[i].number !== need) continue;
                    if (pick < 0) pick = i;
                    if (cardsMatch(S.deck[i], info.card)) { pick = i; break; }
                }
                if (pick < 0) { say(`书页·10：检索 ${need}，牌库里没有，无效`); break; }
                const c = S.deck.splice(pick, 1)[0];
                c.mana = 0;
                S.hand.push(c);
                say(`书页·10：检索 ${need}`);
                break;
            }
        }
    }

    const BLOOD_COSTS = [5, 10, 20];   // 血月：本回合第 1、2、3 次（以後都是最後一個）付費的生命
    const GARDEN_MAX = 3;   // 花圃：每回合結束最多種下幾張牌
    const SIN_MAX = 3;      // 审判：罪累積到幾點發生天罚
    const SIN_DAMAGE = 15;  // 天罚的罪伤
    const SIN_REDEEM = 5;   // 赎罪：每張造成傷害的牌回復的生命上限
    const FREE_DB = {
        "爱娜": {
            char: "爱娜", enemyId: "enemy_1", name: "高塔的魔女 - 爱娜", title: "魔女之塔",
            phases: [
                { hp: 6, atk: 20, mode: "mana_over", params: { min: 2 }, desc: "魔力牌：魔力≥2 造成 1 伤害", next: "魔力 ≥ 2" },
                { hp: 10, atk: 24, mode: "mana_value", params: {}, desc: "魔力值：伤害 = 牌上的魔力", next: "魔力值" },
                // 原案“正好 5 点”太难（模拟：单一阶段要 9 个回合以上），改成 ≥ 4；mana_exact 模式保留在 DAMAGE_MODES
                { hp: 3, atk: 28, mode: "mana_over", params: { min: 4 }, desc: "高魔力：魔力≥4 造成 1 伤害", next: "魔力 ≥ 4" },
                { hp: 16, atk: 32, mode: "mana_value", params: {}, desc: "魔力值：伤害 = 牌上的魔力", next: "魔力值" }
            ],
            field: {
                name: "魔力流动", nextFloor: false,
                desc: "回合开始时手牌各得 1 点魔力。打出带魔力的牌，魔力会转给另一张同色或同数字的手牌；魔力槽每满 5 点抽 1 张牌。",
                help: [
                    "每个回合开始（抽牌之后），手牌的每张牌获得 1 点魔力，显示在牌的角落。回合中新抽到的牌没有魔力。",
                    "打出带魔力的牌：它的魔力全部进入你的魔力槽，同时同样数量的魔力会转给手牌中一张同色或同数字的牌（有多张时随机一张）。",
